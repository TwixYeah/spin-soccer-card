    // як нагороди пасу, а тепер перенесені в резерв під іншими id (custom_...)
    if (w.collection) { delete w.collection["6858"]; delete w.collection["6859"]; delete w.collection["6862"]; }
    await sSet("wallet_" + key, w, true);
    showToast(`SOCCER PASS у "${targetNick}" скинуто`, "ok");
  }
  async function eraseAccount() {
    const key = targetNick.toLowerCase();
    if (key === myNick) { showToast("Не можна анулювати власний акаунт, з якого ви зараз залогінені", "err"); return; }
    if (isSuperAdmin(key)) { showToast("Не можна анулювати акаунт адміністратора — це захищений нік", "err"); return; }
    if (!window.confirm(`Точно анулювати акаунт "${targetNick}" НАЗАВЖДИ?\n\nЦе видалить акаунт і гаманець повністю. Нік більше НІКОЛИ не можна буде зареєструвати. Гравця негайно виведе з акаунту. Це незворотньо.`)) return;
    if (!window.confirm(`Останнє підтвердження: анулювати "${targetNick}"? Це справді незворотньо.`)) return;
    await deleteUser(key);
    setUsers((s) => { const c = { ...s }; delete c[key]; return c; });
    const erased = (await sGet("erased_nicks", true)) || []; erased.push(key); await sSet("erased_nicks", erased, true);
    await sSet("wallet_" + key, null, true);
    await sSet("force_logout_" + key, { ts: Date.now(), text: "Цей акаунт було анульовано назавжди." }, true);
    showToast(`Акаунт ${targetNick} анульовано, нік більше недоступний`, "ok");
  }
  async function launchAbuse() {
    if (applyRarityToAbuse) await applyWeights();
    const ev = {
      xpX2: xpX2Toggle,
      id: "abuse_" + Date.now(),
      superQuestId: "abuse_spins500",
      bucksX2: true, chanceX2: true, discount: Number(abuseDiscount) || 0, expiresAt: Date.now() + (Number(abuseMinutes) || 15) * 60000, bannerText, bannerColor,
      tempCard: cardTemp && abuseCardName && abuseCardImg ? { id: "temp_" + Date.now(), name: abuseCardName, season: abuseCardSeason, origin: `Подія ADMIN ABUSE${abuseCardSeason ? ` — ${abuseCardSeason}` : ""}`, rarity: "Ексклюзивна", price: 999999, img: abuseCardImg, tempEvent: true, dropChance: Math.max(0, Number(abuseCardChance) || 2) / 100, expiresAt: Date.now() + (Number(abuseCardTempMin) || 15) * 60000 } : null,
    };
    await sSet("abuse_event", ev, true); setAbuseEvent(ev);
    if (ev.tempCard) { await setCustomCard(ev.tempCard); setCustomCards((s) => [...s, ev.tempCard]); }
    if (autoPartyWithAbuse) await savePartyConfig({ active: true, casinoActive: true });
    showToast("ADMIN ABUSE подію запущено для всіх!", "ok");
  }
  async function updateBannerLive() {
    const cur = await sGet("abuse_event", true);
    if (!cur) { showToast("Подія неактивна", "err"); return; }
    cur.bannerText = bannerText; cur.bannerColor = bannerColor; await sSet("abuse_event", cur, true); setAbuseEvent(cur);
    showToast("Текст банера оновлено для всіх, без перезапуску таймера", "ok");
  }
  async function stopAbuse() {
    await sSet("abuse_event", null, true); setAbuseEvent(null);
    if (autoPartyWithAbuse) await savePartyConfig({ active: false, casinoActive: false });
    showToast("Подію зупинено", "ok");
  }
  async function forceShopRefresh() { const n = ((await sGet("shop_nonce", true)) || 0) + 1; await sSet("shop_nonce", n, true); setGlobalShopNonce(n); showToast("Магазин акцій примусово оновлено для всіх гравців", "ok"); }
  const [rewardCardId, setRewardCardId] = useState("");
  async function giveRewardToAll() {
    if ((!rewardAmount || rewardAmount <= 0) && !rewardCardId && (!rewardSpins || rewardSpins <= 0)) { showToast("Вкажіть суму, прокрути або оберіть картку", "err"); return; }
    const card = rewardCardId ? allCards().find((c) => c.id === rewardCardId) : null;
    const reward = {
      id: "r" + Date.now(), amount: Number(rewardAmount) || 0, spins: Number(rewardSpins) || 0, reason: rewardReason || "Подарунок", ts: Date.now(), active: true,
      ...(card ? { cardId: card.id, cardNames: [card.name] } : {}),
    };
    await sSet("global_reward", reward, true);
    showToast(`Нагороду роздано всім гравцям сайту!${card ? ` (+картка "${card.name}")` : ""}${reward.spins ? ` (+${reward.spins} прокрутів)` : ""}`, "ok");
  }
  async function stopRewardToAll() {
    const cur = await sGet("global_reward", true);
    if (!cur) { showToast("Зараз немає активної роздачі", "err"); return; }
    await sSet("global_reward", { ...cur, active: false }, true);
    showToast("Роздачу вимкнено — ті, хто ще не встиг отримати, більше не отримають", "ok");
  }
  async function sendBroadcast() {
    if (broadcastBusy) return;
    if (!msgText.trim()) { showToast("Ви нічого не написали!", "err"); return; }
    setBroadcastBusy(true);
    const msg = { id: "b" + Date.now() + Math.random().toString(36).slice(2, 6), from: senderName || "Адмін", avatar: profile ? profile.avatar : "👑", text: msgText.trim().slice(0, 200), ts: Date.now(), expiresAt: Date.now() + 60000 };
    const ok = await sSet("broadcast_msg", msg, true);
    if (ok) { setBroadcastSent(true); setMsgText(""); setTimeout(() => setBroadcastSent(false), 4000); showToast("Повідомлення надіслано всім гравцям на 60с!", "ok"); }
    else showToast("Не вдалося надіслати — перевірте з'єднання й спробуйте ще раз", "err");
    setBroadcastBusy(false);
  }
  async function applyWeights() { const o = { "Рідкісна": Number(w1), "Епічна": Number(w2), "Міфічна": Number(w5), "Легендарна": Number(w3), "Ексклюзивна": Number(w4) }; await sSet("rarity_override", o, true); setRarityOverride(o); showToast("Шанси оновлено для всіх гравців негайно", "ok"); }
  async function resetWeights() { await sSet("rarity_override", null, true); setRarityOverride(null); showToast("Шанси скинуто до стандартних", "ok"); }

  function onAbuseImgFile(e) {
    const file = e.target.files[0]; if (!file) return;
    compressImageFile(file, 220, 0.6).then(setAbuseCardImg);
  }
  function onImgFile(e) {

    compressImageFile(file, 220, 0.6).then(setCardImg);
  }
  const [prepLaunchKey, setPrepLaunchKey] = useState("");
  const [prepLaunchMinutes, setPrepLaunchMinutes] = useState(60);
  const [prepLaunchChance, setPrepLaunchChance] = useState(2);
  const [prepLaunchOrigin, setPrepLaunchOrigin] = useState("");
  const [cardIsTemp, setCardIsTemp] = useState(false);
  const [cardSeason, setCardSeason] = useState("");
  const [cardTempMinutes, setCardTempMinutes] = useState(60);
  const [cardChance, setCardChance] = useState(2);
  async function launchPreparedCard(prepKey, minutes, chancePct, customOrigin) {
    const base = PREPARED_EVENT_CARDS[prepKey];
    if (customCards.some((c) => c.id === base.id)) { showToast("Цю картку вже випущено", "err"); return; }
    const mins = Number(minutes) || 60;
    const chance = Math.max(0.1, Number(chancePct) || 2) / 100;
    const origin = (customOrigin && customOrigin.trim()) || `Подія — ${base.name}`;
    const card = { ...base, tempEvent: true, season: "Реліз", origin, dropChance: chance, expiresAt: Date.now() + mins * 60000 };
    await setCustomCard(card);
    setCustomCards((s) => [...s, card]);
    showToast(`"${base.name}" запущено як тимчасову ексклюзивну картку на ${mins} хв!`, "ok");
  }
  const [giveaway6412Status, setGiveaway6412Status] = useState(null); // { busy, done, count }
  async function giveAwayPreparedCard(prepKey) {
    const base = PREPARED_EVENT_CARDS[prepKey];
    if (!window.confirm(`Роздати "${base.name}" усім гравцям по 1 копії? Цю дію не можна скасувати.`)) return;
    setGiveaway6412Status({ busy: true });
    showToast("Роздаю картку всім гравцям…", "info");
    // dropChance: 0 і tempEvent: true — картка ніколи не випадає сама (ні в рулетці, ні в магазині),
    // єдиний спосіб її отримати — саме ця роздача
    const card = customCards.find((c) => c.id === base.id) || { ...base, tempEvent: true, season: "Реліз", origin: `Подарунок від адміна — ${base.name}`, dropChance: 0, expiresAt: Date.now() + 100 * 365 * 24 * 60 * 60000 };
    if (!customCards.some((c) => c.id === base.id)) { await setCustomCard(card); setCustomCards((s) => [...s, card]); }
    const users = await getAllUsersMap();
    let given = 0;
    await Promise.all(Object.values(users).map(async (u) => {
      const w = await sGet("wallet_" + u.nick, true);
      if (!w) return;
      w.collection = w.collection || {};
      if (w.collection[card.id]) return; // вже отримав раніше — не дублюємо
      w.collection[card.id] = 1;
      w.cardOrigin = w.cardOrigin || {}; w.cardOrigin[card.id] = `Подарунок від адміна 🎁 — ${base.name}`;
      await sSet("wallet_" + u.nick, w, true);
      given++;
    }));
    setGiveaway6412Status({ busy: false, done: true, count: given });
    showToast(`"${base.name}" видано ${given} гравцям!`, "ok");
  }

  async function deleteCustomCard(card) {
    if (!card.id.startsWith("custom_")) { showToast("Вбудовані картки видаляти не можна — лише ті, що додали ви", "err"); return; }
    if (!window.confirm(`Видалити картку "${card.name}"? Усі власники отримають компенсацію (${card.price} 💵 за кожну копію) замість неї.`)) return;
    showToast("Видаляю картку і нараховую компенсації…", "info");
    const users = await getAllUsersMap();
    let compensated = 0;
    let failed = 0;
    await Promise.all(Object.values(users).map(async (u) => {
      const w = await sGet("wallet_" + u.nick, true);
      if (!w || !w.collection || !w.collection[card.id]) return;
      const count = w.collection[card.id];
      w.bucks = (w.bucks || 0) + count * card.price;
      delete w.collection[card.id];
      if (w.maxCount) delete w.maxCount[card.id];
      if (w.cardOrigin) delete w.cardOrigin[card.id];
      let ok = await sSet("wallet_" + u.nick, w, true);
      if (!ok) ok = await sSet("wallet_" + u.nick, w, true); // одна повторна спроба, якщо перший запис не пройшов
      if (ok) compensated++; else failed++;
    }));
    await sDelete("card_" + card.id, true);
    setCustomCards((s) => s.filter((c) => c.id !== card.id));
    showToast(failed ? `Готово, але у ${failed} гравців компенсація НЕ пройшла — перевірте вручну` : `Картку видалено. Компенсацію отримали: ${compensated} гравців(я)`, failed ? "err" : "ok");
  }

  async function addCustomCard() {

    const card = {
      id: "custom_" + Date.now(), name: cardName, rarity: cardRarity, price: Number(cardPrice), img: cardImg,

    };
    await setCustomCard(card);
    setCustomCards((s) => [...s, card]);
    showToast(`Картку "${cardName}" додано в гру${cardIsTemp ? ` (тимчасова, ${cardTempMinutes} хв)` : ""}!`, "ok");
    setCardName(""); setCardImg(""); setCardIsTemp(false); setCardSeason("");
  }

  return (

      <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
        <select value={giveCardId} onChange={(e) => setGiveCardId(e.target.value)} style={{ ...sx.input, marginBottom: 0 }}>
          <option value="">— оберіть картку —</option>
          {allCards().map((c) => <option key={c.id} value={c.id}>{c.name} ({c.rarity})</option>)}

        <button style={sx.smallBtn} onClick={() => grantBadge("none")}>Зняти</button>
      </div>
      <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 4 }}>

        <button style={{ ...sx.smallBtn, background: "#dc2626" }} onClick={banUser}>Забанити на N днів</button>
        <button style={sx.smallBtn} onClick={unbanUser}>Розбанити</button>

      <h3 style={{ color: "#fbbf24", fontSize: 14 }}>ADMIN ABUSE подія</h3>

        </label>
        <input placeholder="Оголошення на вкладці Party (необов'язково)" value={partyAnnouncement} onChange={(e) => setPartyAnnouncement(e.target.value)} style={{ ...sx.input, marginTop: 8 }} />
        <button style={{ ...sx.smallBtn, width: "100%", marginBottom: 8, background: "#166534" }} onClick={() => savePartyConfig({ announcement: partyAnnouncement })}>Зберегти оголошення</button>
        <button style={{ ...sx.smallBtn, width: "100%", background: "#7f1d1d" }} onClick={() => { savePartyConfig({ active: false, questActive: false, casinoActive: false, announcement: "" }); setPartyAnnouncement(""); }}>🗑 Прибрати вкладку Party повністю (вимкнути все)</button>
      </div>

      <h3 style={{ color: "#fbbf24", fontSize: 14 }}>📢 Рекламний банер (окремо від подій)</h3>
      <textarea value={adBannerText} onChange={(e) => setAdBannerText(e.target.value)} placeholder="Текст оголошення" style={{ ...sx.input, minHeight: 50 }} />
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
        <input type="color" value={adBannerColor} onChange={(e) => setAdBannerColor(e.target.value)} style={{ width: 44, height: 40, border: "none", borderRadius: 6 }} title="Фон банера" />
        <input type="color" value={adBannerTextColor} onChange={(e) => setAdBannerTextColor(e.target.value)} style={{ width: 44, height: 40, border: "none", borderRadius: 6 }} title="Колір тексту" />
        <span style={{ fontSize: 11, color: "#9ca3af" }}>Фон / текст</span>
      </div>
      <input type="file" accept="image/*" onChange={onAdBannerImgFile} style={{ marginBottom: 6 }} />
      {adBannerImg && <img src={adBannerImg} style={{ width: 80, borderRadius: 6, marginBottom: 6 }} />}
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button style={sx.primaryBtn} onClick={publishAdBanner}>Опублікувати для всіх</button>
        <button style={{ ...sx.smallBtn, background: "#7f1d1d" }} onClick={removeAdBanner}>Зняти банер</button>
      </div>

      <h3 style={{ color: "#fbbf24", fontSize: 14 }}>Прямокутний банер (як «Щоденна рулетка»)</h3>
      <textarea value={tileBannerText} onChange={(e) => setTileBannerText(e.target.value)} placeholder="Текст банера" style={{ ...sx.input, minHeight: 50 }} />
      <input placeholder="Посилання (необов'язково)" value={tileBannerLink} onChange={(e) => setTileBannerLink(e.target.value)} style={sx.input} />
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
        <input type="color" value={tileBannerTextColor} onChange={(e) => setTileBannerTextColor(e.target.value)} style={{ width: 44, height: 40, border: "none", borderRadius: 6 }} title="Колір тексту" />
        <span style={{ fontSize: 11, color: "#9ca3af" }}>Колір тексту (фон — картинка або градієнт)</span>
      </div>
      <input type="file" accept="image/*" onChange={onTileBannerImgFile} style={{ marginBottom: 6 }} />
      {tileBannerImg && <img src={tileBannerImg} style={{ width: 80, borderRadius: 6, marginBottom: 6 }} />}
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button style={sx.primaryBtn} onClick={publishTileBanner}>Опублікувати для всіх</button>
        <button style={{ ...sx.smallBtn, background: "#7f1d1d" }} onClick={removeTileBanner}>Зняти банер</button>
      </div>

      <h3 style={{ color: "#fbbf24", fontSize: 14 }}>Повідомлення всім гравцям</h3>
      <input placeholder="Ваше ім'я/нік для підпису" value={senderName} onChange={(e) => setSenderName(e.target.value)} style={sx.input} />
      <input placeholder="Текст повідомлення" value={msgText} onChange={(e) => setMsgText(e.target.value)} style={sx.input} />
      <button disabled={broadcastBusy} style={{ ...sx.smallBtn, width: "100%", marginBottom: 4, opacity: broadcastBusy ? 0.6 : 1 }} onClick={sendBroadcast}>{broadcastBusy ? "Надсилаю…" : "Надіслати всім (60с)"}</button>
      {broadcastSent && <div style={{ fontSize: 11, color: "#4ade80", marginBottom: 14 }}>✅ Повідомлення відправлено</div>}
      {!broadcastSent && <div style={{ marginBottom: 14 }} />}

      <h3 style={{ color: "#fbbf24", fontSize: 14 }}>🎁 Роздати нагороду всім гравцям одразу</h3>
      <input type="number" placeholder="Сума баксів" value={rewardAmount} onChange={(e) => setRewardAmount(e.target.value)} style={sx.input} />
      <select value={rewardCardId} onChange={(e) => setRewardCardId(e.target.value)} style={sx.input}>
        <option value="">— без картки (лише бакси) —</option>
        {allCards().map((c) => <option key={c.id} value={c.id}>{c.name} ({c.rarity})</option>)}
      </select>
      <input placeholder='Причина (напр. "З Днем Народження сайту!")' value={rewardReason} onChange={(e) => setRewardReason(e.target.value)} style={sx.input} />
      <input type="number" placeholder="Безкоштовних прокрутів (необов'язково)" value={rewardSpins} onChange={(e) => setRewardSpins(e.target.value)} style={sx.input} />
      <button style={{ ...sx.primaryBtn, marginBottom: 8 }} onClick={giveRewardToAll}>Роздати всім гравцям на сайті</button>
      <button style={{ ...sx.smallBtn, marginBottom: 14, background: "#7f1d1d", width: "100%" }} onClick={stopRewardToAll}>🔴 Вимкнути для тих, хто ще не отримав</button>

      <h3 style={{ color: "#fbbf24", fontSize: 14 }}>🎨 Тема оформлення сайту (для всіх)</h3>
      <select value={themeChoice} onChange={(e) => setThemeChoice(e.target.value)} style={sx.input}>
        <option value="default">Звичайна</option>
        <option value="halloween">🕸️ Halloween</option>
        <option value="newyear">❄️ Новий рік (лише сніг)</option>
        <option value="valentine">💘 День закоханих</option>
        <option value="april">🤡 1 квітня (жартівливі назви карток)</option>
        <option value="custom">Своя (обрати колір)</option>
      </select>
      {themeChoice === "custom" && (
        <div style={{ marginBottom: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
            <input type="color" value={themePrimary} onChange={(e) => setThemePrimary(e.target.value)} style={{ width: 50, height: 36, border: "none", borderRadius: 6 }} />
            <input type="color" value={themeSecondary} onChange={(e) => setThemeSecondary(e.target.value)} style={{ width: 50, height: 36, border: "none", borderRadius: 6 }} />
            <span style={{ fontSize: 11, color: "#9ca3af" }}>Основний / другий колір градієнта</span>
          </div>
          <input placeholder="Кутова іконка (будь-яке емодзі, необов'язково)" value={themeCorner} onChange={(e) => setThemeCorner(e.target.value)} style={sx.input} />
        </div>
      )}
      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        <button style={sx.primaryBtn} onClick={applyTheme}>Застосувати тему</button>
        <button style={sx.smallBtn} onClick={resetTheme}>Скинути</button>
      </div>

      <h3 style={{ color: "#fbbf24", fontSize: 14 }}>📊 Голосування серед гравців</h3>
      <input placeholder="Питання" value={pollQuestion} onChange={(e) => setPollQuestion(e.target.value)} style={sx.input} />
      <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
        <input placeholder="Варіант 1" value={pollOpt1} onChange={(e) => setPollOpt1(e.target.value)} style={{ ...sx.input, marginBottom: 0 }} />
        <input placeholder="Варіант 2" value={pollOpt2} onChange={(e) => setPollOpt2(e.target.value)} style={{ ...sx.input, marginBottom: 0 }} />
      </div>
      <label style={{ fontSize: 11, color: "#9ca3af" }}>Стартовий баланс: {pollOpt1 || "Варіант 1"} {pollPct1}% / {pollOpt2 || "Варіант 2"} {100 - pollPct1}%</label>
      <input type="range" min="0" max="100" value={pollPct1} onChange={(e) => setPollPct1(Number(e.target.value))} style={{ width: "100%", marginBottom: 10 }} />
      <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
        <button style={sx.primaryBtn} onClick={launchPoll}>Запустити голосування</button>
        <button style={sx.smallBtn} onClick={stopPoll}>Закрити голосування</button>
        <button style={{ ...sx.smallBtn, background: "#7f1d1d" }} onClick={clearPoll}>Прибрати повністю</button>
      </div>
      <button style={{ ...sx.smallBtn, width: "100%", marginBottom: 8 }} onClick={refreshPollResults}>Оновити (побачити реальні голоси — гравці їх ще не бачать)</button>
      {pollResults && (
        <div style={{ background: "#1f2937", borderRadius: 8, padding: 10, marginBottom: 14, fontSize: 12 }}>
          <p style={{ margin: "0 0 6px", fontWeight: 700, color: "#fbbf24" }}>{pollResults.question}</p>
          {(() => {
            const votes = Object.values(pollResults.votes || {});
            const v1 = votes.filter((v) => v === 1).length, v2 = votes.filter((v) => v === 2).length;
            const totalVotes = v1 + v2;
            const realPct1 = totalVotes > 0 ? Math.round((v1 / totalVotes) * 100) : pollResults.basePct1;
            return (
              <>
                <p style={{ margin: 2, color: "#9ca3af" }}>Реальні голоси (бачите тільки ви): {pollResults.opt1} {realPct1}% ({v1}) · {pollResults.opt2} {100 - realPct1}% ({v2})</p>
                <p style={{ margin: "8px 0 4px", fontWeight: 700, color: "#fbbf24" }}>Що показати гравцям:</p>
                <label style={{ fontSize: 11 }}>{pollResults.opt1}: {revealPct1}% / {pollResults.opt2}: {100 - revealPct1}%</label>
                <input type="range" min="0" max="100" value={revealPct1} onChange={(e) => setRevealPct1(Number(e.target.value))} style={{ width: "100%", marginBottom: 6 }} />
                <input type="number" placeholder="Всього голосів (для показу, необов'язково)" value={revealTotal} onChange={(e) => setRevealTotal(e.target.value)} style={{ ...sx.input, marginBottom: 6 }} />
                <button style={sx.primaryBtn} onClick={revealPollResults}>📢 Показати ці підсумки всім гравцям</button>
                {pollResults.revealed && <p style={{ fontSize: 10, color: "#4ade80", marginTop: 4 }}>Вже показано: {pollResults.finalPct1}% / {100 - pollResults.finalPct1}%</p>}
              </>
            );
          })()}
        </div>
      )}

      <h3 style={{ color: "#fbbf24", fontSize: 14 }}>Живі шанси випадіння (діють одразу для всіх)</h3>
      {[["Рідкісна", w1, setW1], ["Епічна", w2, setW2], ["Міфічна", w5, setW5], ["Легендарна", w3, setW3], ["Ексклюзивна", w4, setW4]].map(([label, val, setter]) => (
        <div key={label} style={{ marginBottom: 4, fontSize: 11, color: "#9ca3af" }}>{label}: <input type="number" step="0.001" value={val} onChange={(e) => setter(e.target.value)} style={{ width: 80, marginLeft: 6 }} /></div>
      ))}
      <div style={{ display: "flex", gap: 6, marginBottom: 14, marginTop: 6 }}>
        <button style={sx.smallBtn} onClick={applyWeights}>Застосувати</button>
        <button style={sx.smallBtn} onClick={resetWeights}>Скинути</button>
      </div>

      <h3 style={{ color: "#fbbf24", fontSize: 14 }}>Додати свою картку в гру</h3>
      <input placeholder="Назва" value={cardName} onChange={(e) => setCardName(e.target.value)} style={sx.input} />
      <input type="file" accept="image/*" onChange={onImgFile} style={{ marginBottom: 8 }} />
      {cardImg && <img src={cardImg} style={{ width: 60, borderRadius: 6, marginBottom: 8 }} />}
      <select value={cardRarity} onChange={(e) => setCardRarity(e.target.value)} style={sx.input}>
        {RARITY_ORDER.map((r) => <option key={r} value={r}>{r}</option>)}
      </select>
      <input type="number" placeholder="Ціна" value={cardPrice} onChange={(e) => setCardPrice(e.target.value)} style={sx.input} />
      <label style={{ fontSize: 11, color: "#9ca3af", display: "flex", gap: 6, alignItems: "center", marginBottom: 6 }}>
        <input type="checkbox" checked={cardIsTemp} onChange={(e) => setCardIsTemp(e.target.checked)} /> Це тимчасова подієва картка (окремо від ADMIN ABUSE)
      </label>
      {cardIsTemp && (
        <>
          <input placeholder='Назва події (напр. "Halloween 2026")' value={cardSeason} onChange={(e) => setCardSeason(e.target.value)} style={sx.input} />
          <input type="number" placeholder="Хвилин дії" value={cardTempMinutes} onChange={(e) => setCardTempMinutes(e.target.value)} style={sx.input} />
          <input type="number" step="0.1" placeholder="Шанс випадіння, % (напр. 2)" value={cardChance} onChange={(e) => setCardChance(e.target.value)} style={sx.input} />
          <p style={{ fontSize: 10, color: "#6b7280", marginTop: -6 }}>Після завершення картка зникне зі спінів і магазину — але лишиться в тих, хто її вже отримав.</p>
        </>
      )}
      <button style={{ ...sx.primaryBtn, marginBottom: 14 }} onClick={addCustomCard}>Додати картку (з'явиться одразу, без перезавантаження)</button>

      {customCards.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          <p style={{ fontSize: 12, color: "#9ca3af", margin: "0 0 6px" }}>Ваші додані картки (вбудовані картки видалити не можна):</p>
          {customCards.map((c) => (
            <div key={c.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#1f2937", padding: 8, borderRadius: 8, marginBottom: 6 }}>
              <span style={{ fontSize: 12 }}>{c.name} <span style={{ color: RARITY_COLOR[c.rarity] }}>({c.rarity})</span>{c.tempEvent && <span style={{ color: "#f87171" }}> ⏰</span>}</span>
              <button style={{ ...sx.smallBtn, background: "#7f1d1d", fontSize: 10 }} onClick={() => deleteCustomCard(c)}>Видалити + компенсація</button>
            </div>
          ))}
        </div>
      )}

      <div style={{ background: "#1f2937", border: "1px solid #7c3aed", borderRadius: 10, padding: 12, marginBottom: 14 }}>
        <p style={{ fontSize: 12, color: "#c4b5fd", fontWeight: 700, margin: "0 0 8px" }}>🃏 Випустити заготовлену картку (з резерву)</p>
        <select value={prepLaunchKey} onChange={(e) => setPrepLaunchKey(e.target.value)} style={sx.input}>
          <option value="">— оберіть картку —</option>
          {Object.keys(PREPARED_EVENT_CARDS).filter((k) => !customCards.some((c) => c.id === PREPARED_EVENT_CARDS[k].id)).map((k) => (
            <option key={k} value={k}>{PREPARED_EVENT_CARDS[k].name} ({PREPARED_EVENT_CARDS[k].rarity})</option>
          ))}
        </select>
        <input type="number" placeholder="Тривалість, хвилин" value={prepLaunchMinutes} onChange={(e) => setPrepLaunchMinutes(e.target.value)} style={sx.input} />
        <input type="number" placeholder="Шанс випадання, % (напр. 2)" value={prepLaunchChance} onChange={(e) => setPrepLaunchChance(e.target.value)} style={sx.input} />
        <input placeholder='Як підписати походження (напр. "SOCCER PASS 🎫")' value={prepLaunchOrigin} onChange={(e) => setPrepLaunchOrigin(e.target.value)} style={sx.input} />
        <button disabled={!prepLaunchKey} style={{ ...sx.smallBtn, opacity: prepLaunchKey ? 1 : 0.5 }} onClick={() => { launchPreparedCard(prepLaunchKey, prepLaunchMinutes, prepLaunchChance, prepLaunchOrigin); setPrepLaunchKey(""); setPrepLaunchOrigin(""); }}>🚀 Випустити</button>
      </div>

      <button style={sx.smallBtn} onClick={forceShopRefresh}>Примусово оновити магазин акцій для всіх</button>

      <button style={{ ...sx.primaryBtn, marginBottom: 14, background: "linear-gradient(135deg,#1d4ed8,#7c3aed)" }} onClick={forceReloadAll}>🔄 Оновити сайт у всіх гравців</button>

      <div style={{ background: "#1f2937", border: "1px solid #fbbf24", borderRadius: 10, padding: 12, marginBottom: 14 }}>
        <p style={{ fontSize: 12, color: "#fbbf24", margin: "0 0 8px", fontWeight: 700 }}>🎫 SOCCER PASS — сезон</p>
        <input placeholder="Назва сезону" value={passSeasonName} onChange={(e) => setPassSeasonName(e.target.value)} style={sx.input} />
        <input placeholder="Емодзі аватарки (напр. 🎓)" value={passSeasonEmoji} onChange={(e) => setPassSeasonEmoji(e.target.value)} style={sx.input} />
        <input type="date" value={passSeasonEnd} onChange={(e) => setPassSeasonEnd(e.target.value)} style={sx.input} />
        <button style={{ ...sx.smallBtn, width: "100%" }} onClick={savePassSeason}>Зберегти сезон</button>
      </div>

      <h3 style={{ color: "#fbbf24", fontSize: 14, marginTop: 18 }}>🛠️ Технічна перерва</h3>
      <p style={{ fontSize: 10, color: "#6b7280", margin: "0 0 8px" }}>
        Статус: {!maintNow || maintNow.phase === "off" ? "вимкнено ✅" : maintNow.phase === "warning" ? `попередження, активується через ${Math.max(0, Math.ceil((maintNow.effectiveAt - Date.now()) / 60000))} хв` : "АКТИВНА 🔴"}
      </p>
      <textarea value={maintMessage} onChange={(e) => setMaintMessage(e.target.value)} placeholder="Повідомлення для гравців" style={{ ...sx.input, minHeight: 50 }} />
      <div style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "center" }}>
        <input type="number" value={maintWarnMin} onChange={(e) => setMaintWarnMin(e.target.value)} style={{ ...sx.input, marginBottom: 0, width: 70 }} />
        <span style={{ fontSize: 11, color: "#9ca3af" }}>хв. попередження</span>
        <label style={{ fontSize: 11, color: "#9ca3af", marginLeft: "auto", display: "flex", alignItems: "center", gap: 4 }}>
          <input type="checkbox" checked={maintMiniGame} onChange={(e) => setMaintMiniGame(e.target.checked)} /> міні-гра
        </label>
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
        <button style={sx.primaryBtn} onClick={scheduleMaintenance}>Запланувати (з попередженням)</button>
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <button style={{ ...sx.smallBtn, background: "#dc2626" }} onClick={activateMaintenanceNow}>Увімкнути негайно</button>
        <button style={{ ...sx.smallBtn, background: "#16a34a" }} onClick={stopMaintenance}>Зняти перерву</button>
        <button style={sx.smallBtn} onClick={refreshAckCount}>Перевірити</button>
      </div>
      {maintNow && maintNow.phase && maintNow.phase !== "off" && (
        <p style={{ fontSize: 11, color: "#4ade80", marginBottom: 12 }}>✅ Підтвердили, що бачать перерву: {ackCount} гравців (натисніть «Перевірити» для оновлення)</p>
      )}

      <h3 style={{ color: "#fbbf24", fontSize: 14, marginTop: 18 }}>🟢 Онлайн зараз ({onlineUsers.length}) <span onClick={refreshActivity} style={{ fontSize: 11, color: "#60a5fa", cursor: "pointer", fontWeight: 400 }}>{activityBusy ? <span style={{ display: "inline-block", animation: "spin 0.8s linear infinite" }}>⟳</span> : "⟳"} {activityBusy ? "оновлюється…" : "переглянути активність"}</span></h3>
      <div style={{ maxHeight: 150, overflowY: "auto", marginBottom: 12 }}>
        {onlineUsers.length === 0 && <p style={{ fontSize: 11, color: "#6b7280" }}>Зараз нікого немає онлайн</p>}
        {onlineUsers.map((u) => {
          const act = activityList.find((a) => a.nick === u.nick);
          return (
            <div key={u.nick} style={{ fontSize: 11, color: "#9ca3af", padding: "4px 0", borderBottom: "1px solid #1f2937", display: "flex", alignItems: "center", gap: 6 }}>
              <span>{u.avatar}</span><span style={{ flex: 1 }}>{u.nick}</span>
              {act && <span style={{ color: "#60a5fa" }}>{act.tab} · {timeAgo(act.ts)}</span>}
            </div>
          );
        })}
      </div>


      <h3 style={{ color: "#fbbf24", fontSize: 14, marginTop: 18 }}>📈 Огляд економіки <span onClick={loadEconomy} style={{ fontSize: 11, color: "#60a5fa", cursor: "pointer", fontWeight: 400 }}>{economyBusy ? <span style={{ display: "inline-block", animation: "spin 0.8s linear infinite" }}>⟳</span> : "⟳"} {economyBusy ? "рахую…" : "порахувати"}</span></h3>
      {economy ? (
        <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 14, lineHeight: 1.8 }}>
          <div>👤 Зареєстровано гравців: <b style={{ color: "#e5e7eb" }}>{economy.userCount}</b></div>
          <div>💵 Баксів в обігу (усього по гравцях): <b style={{ color: "#4ade80" }}>{fmtBucks(economy.totalBucks)}</b></div>
          <div>🃏 Карток на руках (сума копій): <b style={{ color: "#e5e7eb" }}>{economy.totalCards}</b></div>
          <div>⭐ Найпопулярніша картка: <b style={{ color: "#fbbf24" }}>{economy.topCard || "—"}</b></div>
        </div>
      ) : <p style={{ fontSize: 11, color: "#6b7280", marginBottom: 14 }}>Натисніть "порахувати" — прочитає гаманці всіх гравців (може зайняти кілька секунд).</p>}
    </div>
  );
}

/* ============================== STYLES ============================== */
const sx = {
  bootScreen: { color: "#9ca3af", display: "flex", alignItems: "center", justifyContent: "center", height: "100dvh", background: "#0b0f1a" },
  app: { display: "flex", flexDirection: "column", height: "100dvh", background: "radial-gradient(ellipse 120% 60% at 50% -10%, #16213a 0%, #0b0f1a 55%), radial-gradient(ellipse 90% 50% at 100% 100%, #131c2e 0%, transparent 60%), #0b0f1a", fontFamily: "system-ui,sans-serif", color: "#e5e7eb" },

function GlobalStyles({ theme, boldText }) {
  const t = theme || THEME_PRESETS.default;
  return (
    <style>{`
      html { scrollbar-gutter: stable; }
      body { overflow-y: scroll; }
      :root { --primary-a: ${t.a}; --primary-b: ${t.b}; }
      ${boldText ? "body, body * { font-weight: 600 !important; }" : ""}
      @keyframes gradientShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
      @keyframes popIn { 0% { opacity: 0; transform: scale(0.5) rotate(-8deg); } 60% { opacity: 1; transform: scale(1.1) rotate(3deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
      @keyframes marqueeLTR { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
      @keyframes marqueeRTL { 0% { transform: translateX(-50%); } 100% { transform: translateX(0); } }
      @keyframes fadeSlideIn { 0% { opacity: 0; transform: translate(-50%, -8px); } 100% { opacity: 1; transform: translate(-50%, 0); } }
      @keyframes fadeSlideUp { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes reelPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      @keyframes eventGlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      @keyframes goldShine { 0%,100% { box-shadow: 0 0 8px #fbbf2488, inset 0 0 6px #fbbf2444; } 50% { box-shadow: 0 0 18px #fbbf24cc, inset 0 0 10px #fbbf2488; } }
      @keyframes exclusiveShift { 0% { border-color: #a855f7; box-shadow: 0 0 14px #a855f7aa; } 33% { border-color: #ef4444; box-shadow: 0 0 14px #ef4444aa; } 66% { border-color: #fbbf24; box-shadow: 0 0 14px #fbbf24aa; } 100% { border-color: #a855f7; box-shadow: 0 0 14px #a855f7aa; } }
      @keyframes tempShift { 0%,100% { border-color: #3b82f6; box-shadow: 0 0 14px #3b82f6aa; } 50% { border-color: #22d3ee; box-shadow: 0 0 14px #22d3eeaa; } }
      @keyframes themeFall { 0% { transform: translateY(-5vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.9; } 100% { transform: translateY(105vh) rotate(360deg); opacity: 0.7; } }
      @keyframes boostPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
      @keyframes mktPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(1.25); } }
      @keyframes mktPulseBox { 0%,100% { box-shadow: 0 0 6px #f8717166; } 50% { box-shadow: 0 0 18px #f87171cc; } }
      @keyframes nickShimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
      @keyframes passIconGlow { 0%,100% { box-shadow: 0 4px 20px #000b, 0 0 10px #fbbf2455; } 50% { box-shadow: 0 4px 24px #000b, 0 0 22px #fbbf24cc; } }
      @keyframes premiumGoldShine { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  @keyframes eventStripPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }
  @keyframes onboardPulse { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.06); } }

function FireworksCanvas() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let w = (canvas.width = window.innerWidth);
    let h = (canvas.height = window.innerHeight);
    const onResize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
    window.addEventListener("resize", onResize);
    let particles = [];
    const colors = ["#facc15", "#ec4899", "#22d3ee", "#a855f7", "#4ade80", "#f97316", "#ffffff"];
    function spawnFirework() {
      const x = w * 0.15 + Math.random() * w * 0.7;
      const y = h * 0.1 + Math.random() * h * 0.35;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const count = 26 + Math.floor(Math.random() * 16);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        const speed = 1.4 + Math.random() * 2.6;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, color, size: 1.5 + Math.random() * 1.7 });
      }
    }
    let lastSpawn = 0, raf;
    function loop(t) {
      ctx.clearRect(0, 0, w, h);
      if (t - lastSpawn > 850 + Math.random() * 900) { spawnFirework(); lastSpawn = t; }
      particles.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.025; p.life -= 0.011;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      });
      particles = particles.filter((p) => p.life > 0);
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", onResize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 1 }} />;
}
function ThemeCorners({ theme, reduceMotion }) {
  if (!theme || (!theme.corner && !theme.fireworks)) return null;
  return (
    <>
      <div style={{ position: "fixed", top: 0, left: 0, right: 0, height: 3, background: `linear-gradient(90deg, ${theme.a}, ${theme.b}, ${theme.a})`, backgroundSize: "200% 100%", animation: reduceMotion ? "none" : "gradientShift 6s linear infinite", pointerEvents: "none", zIndex: 6 }} />
      {theme.corner && <div style={{ position: "fixed", bottom: 60, right: 8, fontSize: 22, opacity: 0.4, pointerEvents: "none", zIndex: 2 }}>{theme.corner}</div>}
      {theme.bgTint && <div style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 0, background: theme.bgTint }} />}
      {!reduceMotion && theme.fireworks && <FireworksCanvas />}
      {!reduceMotion && <ThemeParticles theme={theme} />}
    </>
  );
}
function ThemeParticles({ theme }) {
  if (!theme || !theme.particles) return null;
  const items = React.useMemo(() => Array.from({ length: 18 }, (_, i) => ({
    id: i,
    emoji: theme.particles[i % theme.particles.length],
    left: Math.random() * 100,
    delay: Math.random() * 8,
    dur: 7 + Math.random() * 6,
    size: 14 + Math.random() * 14,
  })), [theme.label]);
  return (
    <div style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 1, overflow: "hidden" }}>
      {items.map((p) => (
        <span key={p.id} style={{
          position: "absolute", top: -30, left: p.left + "%", fontSize: p.size, opacity: 0.35,
          animation: `themeFall ${p.dur}s linear ${p.delay}s infinite`,
          filter: theme.glow ? `drop-shadow(0 0 4px ${theme.glow})` : "none",
        }}>{p.emoji}</span>
      ))}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("App crashed:", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ height: "100dvh", background: "#0b0f1a", color: "#e5e7eb", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", fontFamily: "system-ui,sans-serif", padding: 24, textAlign: "center" }}>
          <div style={{ fontSize: 48, marginBottom: 10 }}>⚠️</div>
          <h2 style={{ color: "#f87171", margin: "0 0 8px" }}>Щось пішло не так</h2>
          <p style={{ color: "#9ca3af", fontSize: 13, marginBottom: 4 }}>Сталася помилка в одному з компонентів. Ваш прогрес збережено — просто оновіть сторінку.</p>
          <p style={{ color: "#4b5563", fontSize: 11, maxWidth: 320, marginBottom: 18 }}>{String(this.state.error && this.state.error.message || this.state.error)}</p>
          <button onClick={() => window.location.reload()} style={{ background: "linear-gradient(135deg,#22c55e,#16a34a)", color: "#fff", border: "none", borderRadius: 10, padding: "12px 24px", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>Оновити сторінку</button>
        </div>
      );
    }
    return this.props.children;
  }
}



ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
