        <button style={sx.smallBtn} onClick={refreshAckCount}>Перевірити</button>
      </div>
      {maintNow && maintNow.phase && maintNow.phase !== "off" && (
        <p style={{ fontSize: 11, color: "#4ade80", marginBottom: 12 }}>✅ Підтвердили, що бачать перерву: {ackCount} гравців (натисніть «Перевірити» для оновлення)</p>
      )}

      <h3 style={{ color: "#fbbf24", fontSize: 14, marginTop: 18 }}>🟢 Онлайн зараз ({onlineUsers.length}) <span onClick={refreshActivity} style={{ fontSize: 11, color: "#60a5fa", cursor: "pointer", fontWeight: 400 }}>⟳ переглянути активність</span></h3>
      <div style={{ maxHeight: 150, overflowY: "auto", marginBottom: 12 }}>
        {onlineUsers.length === 0 && <p style={{ fontSize: 11, color: "#6b7280" }}>Зараз нікого немає онлайн</p>}
        {onlineUsers.map((u) => {
          const act = activityList.find((a) => a.nick === u.nick);
          return (
            <div key={u.nick} style={{ fontSize: 11, color: "#9ca3af", padding: "4px 0", borderBottom: "1px solid #1f2937", display: "flex", alignItems: "center", gap: 6 }}>
              <span>{u.avatar}</span><span style={{ flex: 1 }}>{u.nick}</span>
              {act && <span style={{ color: "#60a5fa" }}>{act.tab} · {timeAgo(act.ts)}</span>}
            </div>
          );
        })}
      </div>
      <p style={{ fontSize: 10, color: "#6b7280", marginTop: -8, marginBottom: 12 }}>Примітка: реальної трансляції екрану гравця немає (це не підтримується без окремого сервера) — тут показано лише яку вкладку відкрив гравець і коли востаннє була активність.</p>

      <h3 style={{ color: "#fbbf24", fontSize: 14, marginTop: 18 }}>📈 Огляд економіки <span onClick={loadEconomy} style={{ fontSize: 11, color: "#60a5fa", cursor: "pointer", fontWeight: 400 }}>⟳ порахувати</span></h3>
      {economy ? (
        <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 14, lineHeight: 1.8 }}>
          <div>👤 Зареєстровано гравців: <b style={{ color: "#e5e7eb" }}>{economy.userCount}</b></div>
          <div>💵 Баксів в обігу (усього по гравцях): <b style={{ color: "#4ade80" }}>{fmtBucks(economy.totalBucks)}</b></div>
          <div>🃏 Карток на руках (сума копій): <b style={{ color: "#e5e7eb" }}>{economy.totalCards}</b></div>
          <div>⭐ Найпопулярніша картка: <b style={{ color: "#fbbf24" }}>{economy.topCard || "—"}</b></div>
        </div>
      ) : <p style={{ fontSize: 11, color: "#6b7280", marginBottom: 14 }}>Натисніть "порахувати" — прочитає гаманці всіх гравців (може зайняти кілька секунд).</p>}

      <h3 style={{ color: "#fbbf24", fontSize: 14, marginTop: 18 }}>Всі гравці ({Object.keys(users).length})</h3>
      <input placeholder="Пошук за ніком…" value={userSearch} onChange={(e) => setUserSearch(e.target.value)} style={sx.input} />
      <div style={{ maxHeight: 200, overflowY: "auto" }}>
        {Object.values(users).filter((u) => u.nick.includes(userSearch.trim().toLowerCase())).map((u) => (
          <div key={u.nick} style={{ fontSize: 12, color: "#9ca3af", padding: "4px 0", borderBottom: "1px solid #1f2937", display: "flex", alignItems: "center" }}>
            {u.nick}<VerBadge v={u.verified} />{u.banned && u.banUntil > Date.now() && <span style={{ color: "#f87171", marginLeft: 6 }}>🚫 бан</span>}
          </div>
        ))}
      </div>
    </div>
  );
}

function GlobalStyles({ theme }) {
  const t = theme || THEME_PRESETS.default;
  return (
    <style>{`
      :root { --primary-a: ${t.a}; --primary-b: ${t.b}; }
      @keyframes gradientShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
      @keyframes marqueeLTR { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
      @keyframes marqueeRTL { 0% { transform: translateX(-50%); } 100% { transform: translateX(0); } }
      @keyframes fadeSlideIn { 0% { opacity: 0; transform: translate(-50%, -8px); } 100% { opacity: 1; transform: translate(-50%, 0); } }
      @keyframes fadeSlideUp { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes reelPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      @keyframes eventGlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      @keyframes goldShine { 0%,100% { box-shadow: 0 0 8px #fbbf2488, inset 0 0 6px #fbbf2444; } 50% { box-shadow: 0 0 18px #fbbf24cc, inset 0 0 10px #fbbf2488; } }
      @keyframes exclusiveShift { 0% { border-color: #a855f7; box-shadow: 0 0 14px #a855f7aa; } 33% { border-color: #ef4444; box-shadow: 0 0 14px #ef4444aa; } 66% { border-color: #fbbf24; box-shadow: 0 0 14px #fbbf24aa; } 100% { border-color: #a855f7; box-shadow: 0 0 14px #a855f7aa; } }
      @keyframes tempShift { 0%,100% { border-color: #3b82f6; box-shadow: 0 0 14px #3b82f6aa; } 50% { border-color: #22d3ee; box-shadow: 0 0 14px #22d3eeaa; } }
      @keyframes themeFall { 0% { transform: translateY(-5vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.9; } 100% { transform: translateY(105vh) rotate(360deg); opacity: 0.7; } }
      .card-legendary-shine { animation: goldShine 1.8s ease-in-out infinite; }
      .card-exclusive-shimmer { animation: exclusiveShift 2.4s linear infinite; }
      .card-temp-shimmer { animation: tempShift 1.5s ease-in-out infinite; }
      button { transition: transform 0.1s ease, opacity 0.15s ease; }
      button:active { transform: scale(0.96); }
    `}</style>
  );
}
function ThemeCorners({ theme }) {
  if (!theme || !theme.corner) return null;
  return (
    <>
      <div style={{ position: "fixed", top: 0, left: 0, fontSize: 40, opacity: 0.5, pointerEvents: "none", zIndex: 5 }}>{theme.corner}</div>
      <div style={{ position: "fixed", top: 0, right: 0, fontSize: 40, opacity: 0.5, pointerEvents: "none", zIndex: 5, transform: "scaleX(-1)" }}>{theme.corner}</div>
      <ThemeParticles theme={theme} />
    </>
  );
}
function ThemeParticles({ theme }) {
  if (!theme || !theme.particles) return null;
  const items = React.useMemo(() => Array.from({ length: 18 }, (_, i) => ({
    id: i,
    emoji: theme.particles[i % theme.particles.length],
    left: Math.random() * 100,
    delay: Math.random() * 8,
    dur: 7 + Math.random() * 6,
    size: 14 + Math.random() * 14,
  })), [theme.label]);
  return (
    <div style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 3, overflow: "hidden" }}>
      {items.map((p) => (
        <span key={p.id} style={{
          position: "absolute", top: -30, left: p.left + "%", fontSize: p.size, opacity: 0.35,
          animation: `themeFall ${p.dur}s linear ${p.delay}s infinite`,
          filter: theme.glow ? `drop-shadow(0 0 4px ${theme.glow})` : "none",
        }}>{p.emoji}</span>
      ))}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("App crashed:", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ height: "100vh", background: "#0b0f1a", color: "#e5e7eb", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", fontFamily: "system-ui,sans-serif", padding: 24, textAlign: "center" }}>
          <div style={{ fontSize: 48, marginBottom: 10 }}>⚠️</div>
          <h2 style={{ color: "#f87171", margin: "0 0 8px" }}>Щось пішло не так</h2>
          <p style={{ color: "#9ca3af", fontSize: 13, marginBottom: 4 }}>Сталася помилка в одному з компонентів. Ваш прогрес збережено — просто оновіть сторінку.</p>
          <p style={{ color: "#4b5563", fontSize: 11, maxWidth: 320, marginBottom: 18 }}>{String(this.state.error && this.state.error.message || this.state.error)}</p>
          <button onClick={() => window.location.reload()} style={{ background: "linear-gradient(135deg,#22c55e,#16a34a)", color: "#fff", border: "none", borderRadius: 10, padding: "12px 24px", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>Оновити сторінку</button>
        </div>
      );
    }
    return this.props.children;
  }
}



ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
