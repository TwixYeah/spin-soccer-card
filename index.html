  if (day === 30) return { bucks: 1000, medal: "⚽🏆", card: "Легендарна", label: "Легендарна картка!" };

    const week = Math.floor((day - 1) / 7);

// ГЛОБАЛЬНА ЧЕРГА: усі запити до Firestore йдуть по черзі з паузою між ними, а не пачками.

let __fsQueue = Promise.resolve();

function throttledFetch(url, opts) {
  const run = async () => {

async function sGet(key, shared) {

async function sGetLegacyFallback(key) {

async function sGetSafe(key, shared) {

  try {

async function sSet(key, value, shared) {
  if (shared === false) { try { localStorage.setItem("ssc_" + key, JSON.stringify(value)); return true; } catch (e) { console.error("local set failed", e); return false; } }
  const body = { fields: { v: { stringValue: JSON.stringify(value) }, t: { integerValue: String(Date.now()) } } };
  // до 3 спроб: одиничний невдалий запит (мережа/тимчасовий збій) не має тихо "губити" прогрес гравця,
  // саме це і було причиною того, що картки чи бали зберігалися то 50/50
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetchWithRetry(fsDocUrl(key), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (res.ok) return true;
      if (res.status < 500 && res.status !== 429) { console.error("sSet failed", key, "HTTP " + res.status); return false; }
    } catch (e) { console.error("sSet attempt failed", key, e); }
    if (attempt < 2) await sleep(400 + attempt * 500);
  }
  console.error("sSet gave up after retries", key);

async function sList(prefix, shared) {
  try {
    const { col } = routeKey(prefix);
    let keys = [];
    let pageToken = "";
    do {
      const url = `${FS_BASE}/${col}?key=${FS_API_KEY}&pageSize=300` + (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : "");
      const res = await fetchWithRetry(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const docs = data.documents || [];
      // повертаємо повні ключі (з префіксом) — решта коду очікує саме такий формат, як і раніше
      keys = keys.concat(docs.map((d) => prefix + d.name.split("/").pop()));
      pageToken = data.nextPageToken || "";

    return keys;
  } catch (e) { console.error("sList failed", prefix, e); return []; }
}

function compressImageFile(file, maxW, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

      <span onClick={() => setVisible(false)} style={{ cursor: "pointer", color: "#9ca3af", fontSize: 15, padding: 4 }}>✕</span>
    </div>
  );
}
function PollModal({ poll, nick, onClose }) {
  const [voted, setVoted] = useState(null);
  const [live, setLive] = useState(poll);
  useEffect(() => {
    const t = setInterval(async () => { const fresh = await sGet("active_poll", true); if (fresh && fresh.id === poll.id) setLive(fresh); }, 3000);
    return () => clearInterval(t);
  }, []);
  async function vote(opt) {
    const fresh = (await sGet("active_poll", true)) || poll;
    fresh.votes = fresh.votes || {};
    fresh.votes[nick] = opt;
    await sSet("active_poll", fresh, true);
    setLive(fresh); setVoted(opt);
  }
  const revealed = live.revealed;
  const pct1 = revealed ? live.finalPct1 : null;
  const canVote = !voted && !live.closed && !revealed;
  return (
    <div style={sx.modalOverlay}>
      <div style={{ ...sx.modal, textAlign: "center" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ fontSize: 36 }}>📊</div>
        <h3 style={{ color: "#fbbf24" }}>{live.question}</h3>
        {canVote ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <button style={sx.primaryBtn} onClick={() => vote(1)}>{live.opt1}</button>
            <button style={{ ...sx.primaryBtn, background: "linear-gradient(135deg,#3b82f6,#2563eb)" }} onClick={() => vote(2)}>{live.opt2}</button>
          </div>
        ) : revealed ? (
          <div>
            <p style={{ color: "#fbbf24", fontSize: 12, fontWeight: 700 }}>Результати голосування:</p>
            <div style={sx.pollBarWrap}><div style={{ ...sx.pollBarFill, width: pct1 + "%" }} /></div>
            <p style={{ fontSize: 12, margin: "4px 0" }}>{live.opt1}: {pct1}% · {live.opt2}: {100 - pct1}%</p>
            {live.finalTotal != null && <p style={{ fontSize: 10, color: "#6b7280" }}>Проголосувало: {live.finalTotal}</p>}
          </div>
        ) : live.closed ? (
          <p style={{ color: "#9ca3af", fontSize: 13 }}>Голосування закрито. Очікуйте результатів — адміністратор скоро їх оголосить.</p>
        ) : (
          <p style={{ color: "#4ade80", fontSize: 13 }}>Дякуємо за голос! Результати з'являться, коли адміністратор їх оголосить.</p>
        )}
        <button style={{ ...sx.smallBtn, marginTop: 10, width: "100%" }} onClick={onClose}>Закрити</button>
      </div>
    </div>
  );
}

/* ============================== MAIN APP ============================== */
function App() {
  const [booting, setBooting] = useState(true);
  const [nick, setNick] = useState(null);
  const [profile, setProfile] = useState(null);
  const [wallet, setWallet] = useState(null);
  const [tab, setTab] = useState("casino");
  const [event, setEvent] = useState(null);
  const [abuseEvent, setAbuseEvent] = useState(null);
  const [adBanner, setAdBanner] = useState(null);
  const [broadcast, setBroadcast] = useState(null);
  const [toast, setToast] = useState(null);
  const [globalShopNonce, setGlobalShopNonce] = useState(0);
  const [rarityOverride, setRarityOverride] = useState(null);
  const [customCards, setCustomCards] = useState([]);
  const [duelRoom, setDuelRoom] = useState(null);
  const walletRef = useRef(null);
  const busyRef = useRef(false);

  useEffect(() => {
    (async () => {
      const savedNick = await sGet("session_nick", false);
      if (savedNick) await doLogin(savedNick, null, true);
      setBooting(false);
    })();
    const slowTick = async () => {
      if (document.visibilityState !== "visible") return; // не опитуємо базу, коли вкладка згорнута/у фоні
      // адмінські налаштування (тема, банер, шанси, подія, список карток) — міняються рідко,
      // тому опитуємо їх нечасто, це найважчі запити (список карток читає всю колекцію)
      const [abuseR, broadcastV, rarityR, customR, themeR, shopNonceV, maintV, adBannerV] = await Promise.all([
        sGetSafe("abuse_event", true),
        sGet("broadcast_msg", true),
        sGetSafe("rarity_override", true),
        getAllCustomCards().then(v => ({ ok: true, value: v })).catch(() => ({ ok: false })),
        sGetSafe("site_theme", true),
        sGet("shop_nonce", true),
        sGetSafe("maintenance_state", true),
        sGet("ad_banner", true),
      ]);
      if (abuseR.ok) setAbuseEvent(abuseR.value);
      setBroadcast(broadcastV);
      if (rarityR.ok) setRarityOverride(rarityR.value);
      if (customR.ok) setCustomCards(customR.value || []);
      if (themeR.ok) setSiteTheme(themeR.value);
      setGlobalShopNonce(shopNonceV || 0);
      if (maintV.ok) setMaintState(maintV.value);
      setAdBanner(adBannerV);
    };
    const pollTick = async () => {
      if (document.visibilityState !== "visible") return; // не опитуємо базу, коли вкладка згорнута/у фоні
      // швидкий потік — усе, що стосується прямих дій гравця (подарунки, гранти, дуель, голосування)
      const dr = duelRoomRef.current;
      if (dr) { const duelV = await sGet("duel_" + dr.code, true); if (duelV) setDuelRoom(duelV); }
      const curNick = nickRef.current;
      if (curNick) {
        try {
          // "серцебиття" — раз на ~25с оновлюємо lastSeen і поточну вкладку, щоб онлайн-статус і активність адміна працювали
          if (Date.now() - heartbeatRef.current > 25000) {
            heartbeatRef.current = Date.now();
            const u0 = await getUser(curNick);
            if (u0) { u0.lastSeen = Date.now(); await setUser(curNick, u0); }
            await sSet("activity_" + curNick, { tab: tabRef.current, ts: Date.now() }, true);
          }
        } catch (e) { console.error("poll: heartbeat failed", e); }

        try {
          // технічна перерва — миттєво реагуємо, як тільки з'явився активний стан
          const maintState2 = await sGet("maintenance_state", true);
          if (maintState2) setMaintState(maintState2);
          const isLocked = maintState2 && maintState2.phase && maintState2.phase !== "off" &&
            (maintState2.phase === "active" || Date.now() >= maintState2.effectiveAt);
          if (isLocked && Date.now() - maintAckRef.current > 6000) {
            maintAckRef.current = Date.now();
            await sSet("maint_ack_" + curNick, Date.now(), true);
          }
        } catch (e) { console.error("poll: maintenance ack failed", e); }

        try {
          // forced logout check (password changed / banned by admin)
          const kick = await sGet("force_logout_" + curNick, true);
          if (kick && kick.ts && kick.ts > (kickSeenRef.current || 0)) {
            kickSeenRef.current = kick.ts;
            setKickNotice(kick);
          }
        } catch (e) { console.error("poll: kick check failed", e); }

        try {
          // явні гранти від адміна (бакси/прокрути/картки) — обробляємо чергу, без вгадування за порівнянням сум
          const grants = (await sGet("grants_" + curNick, true)) || [];
          if (grants.length > 0 && walletRef.current) {
            const local = walletRef.current;
            const already = local.processedGrantIds || [];
            const fresh = grants.filter((g) => !already.includes(g.id));
            if (fresh.length > 0) {
              const merged = { ...local, collection: { ...local.collection }, obtainedAt: { ...local.obtainedAt }, cardOrigin: { ...(local.cardOrigin || {}) } };
              let addedBucks = 0, addedSpins = 0, addedCards = [];
              fresh.forEach((g) => {
                addedBucks += g.bucks || 0; addedSpins += g.spins || 0;
                if (g.cardId) {
                  merged.collection[g.cardId] = (merged.collection[g.cardId] || 0) + 1;
                  if (!merged.obtainedAt[g.cardId]) merged.obtainedAt[g.cardId] = Date.now();
                  merged.cardOrigin[g.cardId] = "Видано адміністратором 👑";
                  addedCards.push(g.cardName || g.cardId);
                }
              });
              if (!merged.bucksInfinite) merged.bucks += addedBucks;
              merged.freeSpinsLeft = (merged.freeSpinsLeft || 0) + addedSpins;
              merged.processedGrantIds = [...already, ...fresh.map((g) => g.id)].slice(-50);
              setWallet({ ...merged }); walletRef.current = merged;
              await sSet("wallet_" + curNick, merged, true);
              if (addedCards.length) {
                setRewardPopup({ id: "grantcard" + Date.now(), amount: addedBucks, reason: `Адмін видав картку: ${addedCards.join(", ")}`, cardNames: addedCards });
              } else if (addedBucks || addedSpins) {
                const parts = [];
                if (addedBucks) parts.push(`+${addedBucks} 💵`);
                if (addedSpins) parts.push(`+${addedSpins} прокрутів`);
                showToast(`Адміністратор видав вам: ${parts.join(", ")}`, "ok");
              }
            }
          }
        } catch (e) { console.error("poll: grants processing failed", e); }

        try {
          // подаровані картки від друзів
          const giftQueue = (await sGet("gift_queue_" + curNick, true)) || [];
          if (giftQueue.length > 0 && walletRef.current) {
            const local = walletRef.current;
            const already = local.processedGiftIds || [];
            const freshGifts = giftQueue.filter((g) => !already.includes(g.id));
            if (freshGifts.length > 0) {
              const merged = { ...local, collection: { ...local.collection }, obtainedAt: { ...local.obtainedAt } };
              merged.cardOrigin = { ...(merged.cardOrigin || {}) };
              freshGifts.forEach((g) => {
                merged.collection[g.cardId] = (merged.collection[g.cardId] || 0) + 1;
                if (!merged.obtainedAt[g.cardId]) merged.obtainedAt[g.cardId] = Date.now();
                merged.cardOrigin[g.cardId] = `Подаровано гравцем ${g.from} 🎁`;
              });
              merged.processedGiftIds = [...already, ...freshGifts.map((g) => g.id)].slice(-50);
              setWallet({ ...merged }); walletRef.current = merged;
              await sSet("wallet_" + curNick, merged, true);
              showToast(`${freshGifts[freshGifts.length - 1].from} подарував(ла) вам картку! 🎁`, "ok");
            }
          }
        } catch (e) { console.error("poll: gift processing failed", e); }

        try {
          // події друзів (прийняли/видалили) — застосовуємо лише до власного гаманця, без крос-запису
          const friendEvents = (await sGet("friend_events_" + curNick, true)) || [];
          if (friendEvents.length > 0 && walletRef.current) {
            const local = walletRef.current;
            const already = local.processedFriendEventIds || [];
            const freshEvents = friendEvents.filter((e) => !already.includes(e.id));
            if (freshEvents.length > 0) {
              const merged = { ...local, friends: [...(local.friends || [])] };
              freshEvents.forEach((e) => {
                if (e.type === "add" && !merged.friends.includes(e.nick)) merged.friends.push(e.nick);
                if (e.type === "remove") merged.friends = merged.friends.filter((f) => f !== e.nick);
              });
              merged.processedFriendEventIds = [...already, ...freshEvents.map((e) => e.id)].slice(-50);
              setWallet({ ...merged }); walletRef.current = merged;
              await sSet("wallet_" + curNick, merged, true);
            }
          }
        } catch (e) { console.error("poll: friend events processing failed", e); }

        try {
          // щоденний скид (стрік/безкоштовні прокрути) для акаунту, який лишався відкритим через північ
          if (walletRef.current) {
            const merged = { ...walletRef.current };
            const reset = checkDailyReset(merged);
            if (reset) {
              setWallet({ ...merged }); walletRef.current = merged;
              await sSet("wallet_" + curNick, merged, true);
              showToast(`Новий день! ${merged._lastRewardText || ""}`, "ok");
            }
          }
        } catch (e) { console.error("poll: daily reset failed", e); }

        try {
          // глобальна нагорода від адміна всім гравцям одразу (бакси і/або картка)
          const reward = await sGet("global_reward", true);
          if (reward && reward.id && reward.id !== rewardSeenRef.current && walletRef.current) {
            rewardSeenRef.current = reward.id;
            const w2 = { ...walletRef.current, collection: { ...walletRef.current.collection }, obtainedAt: { ...walletRef.current.obtainedAt }, cardOrigin: { ...(walletRef.current.cardOrigin || {}) } };
            if (!w2.bucksInfinite && reward.amount) w2.bucks += reward.amount;
            if (reward.cardId) {
              w2.collection[reward.cardId] = (w2.collection[reward.cardId] || 0) + 1;
              if (!w2.obtainedAt[reward.cardId]) w2.obtainedAt[reward.cardId] = Date.now();
              w2.cardOrigin[reward.cardId] = "Подарунок від адміністрації всім гравцям 🎁";
            }
            w2.lastRewardSeen = reward.id;
            setWallet({ ...w2 }); walletRef.current = w2;
            await sSet("wallet_" + curNick, w2, true);
            setRewardPopup(reward);
          }
        } catch (e) { console.error("poll: global reward failed", e); }

        try {
          // активне голосування від адміна: показ рівно 1 раз на голос і 1 раз на результат,
          // і результат бачать лише ті, хто зайшов протягом 2 хв після оголошення
          const poll = await sGet("active_poll", true);
          const seen = walletRef.current ? (walletRef.current.pollSeen || []) : [];
          if (poll && poll.id && !seen.includes("v:" + poll.id) && !(poll.votes && poll.votes[curNick])) {
            setPollPopup(poll);
          } else if (poll && poll.revealed && !seen.includes("r:" + poll.id + ":" + poll.revealedAt) && Date.now() - poll.revealedAt < 120000) {
            setPollPopup(poll);
          } else if (!poll) {
            setPollPopup((p) => (p ? null : p));
          }
        } catch (e) { console.error("poll: active poll check failed", e); }
      }
    };
    slowTick();
    const t = setInterval(pollTick, 4000);
    const tSlow = setInterval(slowTick, 25000);
    const onVis = () => { if (document.visibilityState === "visible") { pollTick(); slowTick(); } };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("focus", onVis);
    return () => { clearInterval(t); clearInterval(tSlow); document.removeEventListener("visibilitychange", onVis); window.removeEventListener("focus", onVis); };
  }, []);
  const duelRoomRef = useRef(null);
  const nickRef = useRef(null);
  const heartbeatRef = useRef(0);
  const tabRef = useRef("casino");
  const maintAckRef = useRef(0);
  const [maintState, setMaintState] = useState(null);
  const kickSeenRef = useRef(0);
  const [kickNotice, setKickNotice] = useState(null);
  const [rewardPopup, setRewardPopup] = useState(null);
  const [pollPopup, setPollPopup] = useState(null);
  const [siteTheme, setSiteTheme] = useState(null);
  useEffect(() => { ACTIVE_THEME_KEY = (siteTheme && siteTheme.key) || "default"; }, [siteTheme]);
  const rewardSeenRef = useRef(null);
  useEffect(() => { duelRoomRef.current = duelRoom; }, [duelRoom]);
  useEffect(() => { nickRef.current = nick; }, [nick]);
  useEffect(() => { tabRef.current = tab; }, [tab]);
  useEffect(() => {
    if (!kickNotice) return;
    const t = setTimeout(() => { doLogout(); setKickNotice(null); }, 4000);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [kickNotice]);

  function checkDailyReset(w) {
    const today = todayStr();
    if (w.freeSpinsDate !== today) {
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      w.streak = w.lastLogin === yesterday ? (w.streak || 0) + 1 : (w.lastLogin === today ? w.streak : 1);
      w.freeSpinsLeft = 3; w.freeSpinsDate = today; w.lastLogin = today;
      const reward = getStreakReward(w.streak);
      const bucksGiven = Math.round(reward.bucks * bucksMult(abuseEvent));
      if (!w.bucksInfinite) w.bucks += bucksGiven;
      let extra = "";
      if (reward.card) {
        const pool = allCards().filter((c) => c.rarity === reward.card && !c.tempEvent);
        const picked = pool[Math.floor(Math.random() * pool.length)];
        if (picked) {
          w.collection[picked.id] = (w.collection[picked.id] || 0) + 1;
          if (!w.obtainedAt[picked.id]) w.obtainedAt[picked.id] = Date.now();
          extra = ` + картка "${picked.name}"!`;
        }
      }
      w._lastRewardText = `+${bucksGiven} 💵 ${reward.medal} (серія ${w.streak} дн.)${extra}`;
      return true;
    }
    return false;
  }

  function showToast(msg, kind) { setToast({ msg, kind: kind || "info", id: Math.random() }); setTimeout(() => setToast(null), 3400); }

  function allCards() {
    // ВАЖЛИВО: тут НЕ фільтруємо прострочені тимчасові картки — інакше вони зникали б
    // повністю (навіть з колекції гравця, який вже нею володіє). Прострочені картки просто
    // більше не мають випадати в рулетці — це перевіряється окремо, в місцях видачі картки.
    return [...BASE_CARDS, ...customCards];
  }

  async function enterSession(key, u) {
    u.lastSeen = Date.now();
    if (isSuperAdmin(key) && u.verified !== "black") u.verified = "black";
    await setUser(key, u);
    setNick(key); setProfile(u);
    await sSet("session_nick", key, false);
    let w = withDefaults((await sGet("wallet_" + key, true)) || newWallet());
    checkDailyReset(w);
    if (isSuperAdmin(key)) w.bucksInfinite = true;
    setWallet(w);
    await sSet("wallet_" + key, w, true);
    walletRef.current = w;
    rewardSeenRef.current = w.lastRewardSeen || null;
    kickSeenRef.current = Date.now();
    return true;
  }

  async function doLogin(n, pass, skipPassCheck) {
    const key = n.toLowerCase();
    if (!skipPassCheck) {
      const banned = (await sGet("erased_nicks", true)) || [];
      if (banned.includes(key)) { showToast("Цей акаунт було анульовано назавжди", "err"); return false; }
    }
    const u = await getUser(key);
    if (!u) { showToast("Такого ніка не існує", "err"); return false; }
    if (!skipPassCheck && u.passHash !== simpleHash(pass)) { showToast("Невірний пароль", "err"); return false; }
    if (u.banned && u.banUntil && u.banUntil > Date.now()) { showToast("Акаунт заблоковано до " + new Date(u.banUntil).toLocaleString("uk-UA"), "err"); return false; }
    return enterSession(key, u);
  }

  async function saveWallet(w) {
    walletRef.current = w;
    setWallet({ ...w });
    const ok = await sSet("wallet_" + nick, w, true);
    if (!ok) showToast("Не вдалося зберегти прогрес — перевірте з'єднання й спробуйте ще раз", "err");
  }
  async function saveProfile(p) {
    setProfile({ ...p });
    await setUser(nick, p);
  }

  async function doRegister(n, pass) {
    if (!/^[A-Za-zА-Яа-яЇїІіЄєҐґ0-9_]{3,16}$/.test(n)) { showToast("Нік: 3-16 символів, без пробілів", "err"); return; }
    const key = n.toLowerCase();
    if (RESERVED_NICKS.includes(key)) { showToast("Цей нік зарезервовано (офіційний акаунт)", "err"); return; }
    const banned = (await sGet("erased_nicks", true)) || [];
    if (banned.includes(key)) { showToast("Цей нік більше недоступний", "err"); return; }
    const existing = await getUser(key);
    if (existing) { showToast("Цей нік вже зайнятий", "err"); return; }
    const newUser = {
      nick: n, passHash: simpleHash(pass), avatar: "⚽", verified: isSuperAdmin(key) ? "black" : "none",
      banned: false, banUntil: 0, salesGood: 0, salesTotal: 0, createdAt: Date.now(), lastSeen: Date.now(),
    };
    showToast("Акаунт створено! Заходимо...", "ok");
    // одразу входимо з уже готовим об'єктом користувача, без повторного читання зі сховища
    // (миттєве перечитування одразу після запису іноді повертає застарілу версію)
    await enterSession(key, newUser);
  }
  function doLogout() { if (nick) sSet("force_logout_" + nick, null, true); setNick(null); setProfile(null); setWallet(null); sSet("session_nick", "", false); }

  if (booting) return <div style={sx.bootScreen}>Завантаження…</div>;
  if (!nick) return <AuthScreen onLogin={doLogin} onRegister={doRegister} toast={toast} theme={siteTheme || THEME_PRESETS.default} />;
  if (!wallet) return <div style={sx.bootScreen}>Завантаження акаунту…</div>;

  if (duelRoom && duelRoom.status === "active") {
    return <DuelScreen room={duelRoom} nick={nick} wallet={wallet} saveWallet={saveWallet}
      allCards={allCards} rarityOverride={rarityOverride} abuseEvent={abuseEvent}
      onFinish={async (updatedRoom) => { await sSet("duel_" + updatedRoom.code, updatedRoom, true); setDuelRoom(updatedRoom); }}
      onExit={() => setDuelRoom(null)} showToast={showToast} />;
  }

  const maintLocked = maintState && maintState.phase && maintState.phase !== "off" &&
    (maintState.phase === "active" || Date.now() >= maintState.effectiveAt);
  const maintWarning = maintState && maintState.phase === "warning" && Date.now() < maintState.effectiveAt;
  if (maintLocked && !isSuperAdmin(nick) && !duelRoom) {
    return <MaintenanceScreen state={maintState} />;
  }

  const eventActive = abuseEvent && abuseEvent.expiresAt > Date.now();
  return (
    <div style={{ ...sx.app, ...(eventActive ? sx.appEventActive : {}) }}>
      <GlobalStyles theme={siteTheme || THEME_PRESETS.default} />
      <ThemeCorners theme={siteTheme} />
      <TopBar profile={profile} wallet={wallet} abuseEvent={abuseEvent} broadcast={broadcast} onLogout={doLogout} />
      {maintWarning && (
        <div style={{ background: "#7c2d12", color: "#fff", textAlign: "center", fontSize: 12, fontWeight: 700, padding: "8px 10px" }}>
          ⚠️ Технічна перерва через {Math.max(1, Math.ceil((maintState.effectiveAt - Date.now()) / 60000))} хв. {maintState.message ? `— ${maintState.message}` : "Встигніть докрутити / дограти дуель!"}
        </div>
      )}
      {toast && <div style={{ ...sx.toast, ...(toast.kind === "err" ? sx.toastErr : toast.kind === "ok" ? sx.toastOk : {}) }}>{toast.msg}</div>}
      {kickNotice && (

function TicTacToeMini() {
  const empty = Array(9).fill(null);
  const [board, setBoard] = useState(empty);
  const [turn, setTurn] = useState("X"); // гравець завжди X, бот O
  const [over, setOver] = useState(null); // "X" | "O" | "draw" | null
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function winnerOf(b) {
    for (const [a, b1, c] of LINES) if (b[a] && b[a] === b[b1] && b[a] === b[c]) return b[a];
    return b.every(Boolean) ? "draw" : null;
  }
  function botMove(b) {
    const free = b.map((v, i) => v ? null : i).filter(v => v !== null);
    if (free.length === 0) return b;
    const pick = free[Math.floor(Math.random() * free.length)];
    const nb = [...b]; nb[pick] = "O"; return nb;
  }
  function click(i) {
    if (over || board[i] || turn !== "X") return;
    let nb = [...board]; nb[i] = "X";
    let w = winnerOf(nb);
    if (w) { setBoard(nb); setOver(w); return; }
    nb = botMove(nb);
    w = winnerOf(nb);
    setBoard(nb);
    if (w) setOver(w); else setTurn("X");
  }
  function reset() { setBoard(empty); setOver(null); setTurn("X"); }
  return (
    <div style={{ textAlign: "center", marginTop: 18 }}>
      <p style={{ fontSize: 12, color: "#9ca3af", marginBottom: 8 }}>Поки чекаєте — зіграйте в хрестики-нулики проти бота 🤖</p>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,60px)", gap: 4, justifyContent: "center", margin: "0 auto" }}>
        {board.map((v, i) => (
          <div key={i} onClick={() => click(i)} style={{
            width: 60, height: 60, background: "#1f2937", border: "1px solid #374151", borderRadius: 8,
            display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, fontWeight: 800,
            color: v === "X" ? "#4ade80" : "#f87171", cursor: !v && !over ? "pointer" : "default"
          }}>{v}</div>
        ))}
      </div>
      {over && (
        <p style={{ marginTop: 10, fontWeight: 700, color: over === "draw" ? "#9ca3af" : over === "X" ? "#4ade80" : "#f87171" }}>
          {over === "draw" ? "Нічия!" : over === "X" ? "Ви перемогли! 🎉" : "Переміг бот 🤖"}
        </p>
      )}
      <button style={{ ...sx.smallBtn, marginTop: 10 }} onClick={reset}>Заново</button>
    </div>
  );
}

/* ============================== CASINO ============================== */
function bucksMult(abuseEvent) { return (abuseEvent && abuseEvent.expiresAt > Date.now() && abuseEvent.bucksX2) ? 1.5 : 1; }
function effectiveWeights(rarityOverride, abuseEvent, wallet) {
  let w = { ...(rarityOverride || BASE_RARITY_WEIGHT) };
  if (abuseEvent && abuseEvent.expiresAt > Date.now() && abuseEvent.chanceX2) {
    w["Епічна"] *= 2; w["Легендарна"] *= 2; w["Ексклюзивна"] *= 2;
  }
  if (wallet.pityLegendary > 0) w["Легендарна"] /= 5;
  if (wallet.pityExclusive > 0) w["Ексклюзивна"] /= 8;
  return w;
}
function CasinoTab({ wallet, saveWallet, profile, nick, abuseEvent, rarityOverride, allCards, showToast, busyRef }) {
  const [spinning, setSpinning] = useState(false);
  const [result, setResult] = useState(null);
  const [reels, setReels] = useState([null, null, null]);
  const [, forceTick] = useState(0);
  useEffect(() => { const t = setInterval(() => forceTick(v => v + 1), 1000); return () => clearInterval(t); }, []);

  function currentCostLevel(w) {
    let lvl = w.spinLevel || 0;
    if (w.lastPaidSpinAt) {
      const decaySteps = Math.floor((Date.now() - w.lastPaidSpinAt) / DECAY_INTERVAL_MS);
      lvl = Math.max(0, lvl - decaySteps);
    }
    return lvl;
  }
  const costLevel = currentCostLevel(wallet);
  const cost = COST_LEVELS[Math.min(costLevel, COST_LEVELS.length - 1)];
  const active = abuseEvent && abuseEvent.expiresAt > Date.now();

  async function spin() {
    if (spinning || busyRef.current) return;
    const w = walletSnapshot();
    const freeLeft = w.freeSpinsLeft > 0;
    const liveLevel = currentCostLevel(w);
    const liveCost = COST_LEVELS[Math.min(liveLevel, COST_LEVELS.length - 1)];
    if (!freeLeft && (!w.bucksInfinite && w.bucks < liveCost)) { showToast("Недостатньо баксів", "err"); return; }
    busyRef.current = true; setSpinning(true); setResult(null);
    if (freeLeft) w.freeSpinsLeft -= 1;
    else { if (!w.bucksInfinite) w.bucks -= liveCost; w.spinLevel = liveLevel + 1 >= COST_LEVELS.length ? 0 : liveLevel + 1; w.lastPaidSpinAt = Date.now(); }

    let frame = 0;
    const pool = allCards();
    const anim = setInterval(() => {
      setReels([pool[Math.floor(Math.random() * pool.length)], pool[Math.floor(Math.random() * pool.length)], pool[Math.floor(Math.random() * pool.length)]]);
      frame++; if (frame > 14) clearInterval(anim);
    }, 90);

    setTimeout(async () => {
      clearInterval(anim);
      const rng = seededRandom(Date.now() % 1000000 + Math.floor(Math.random() * 100000));
      const weights = effectiveWeights(rarityOverride, abuseEvent, w);
      const won = [];
      for (let i = 0; i < 3; i++) {
        const rarity = weightedPick(rng, weights);
        const tempPool = pool.filter((c) => c.tempEvent && c.expiresAt > Date.now());
        const rarityPool = pool.filter((c) => c.rarity === rarity && !c.tempEvent);
        let card = null;
        for (const tc of tempPool) { if (rng() < (tc.dropChance != null ? tc.dropChance : 0.02)) { card = tc; break; } }
        if (!card) { const idx = Math.floor(rng() * rarityPool.length); card = rarityPool[Math.min(idx, rarityPool.length - 1)] || pool[0]; }
        won.push(card);
      }
      setReels(won);
      w.cardOrigin = w.cardOrigin || {};
      won.forEach((c) => {
        w.collection[c.id] = (w.collection[c.id] || 0) + 1;
        if (!w.obtainedAt[c.id]) w.obtainedAt[c.id] = Date.now();
        w.maxCount[c.id] = Math.max(w.maxCount[c.id] || 0, w.collection[c.id]);
        if (!c.tempEvent) w.cardOrigin[c.id] = "Виграно в казино 🎰";
      });
      const hitLegendary = won.some((c) => c.rarity === "Легендарна");
      const hitExclusive = won.some((c) => c.rarity === "Ексклюзивна");
      if (hitExclusive) w.pityExclusive = 8;
      else if (w.pityExclusive > 0) w.pityExclusive -= 1;
      if (hitLegendary) w.pityLegendary = 5;
      else if (w.pityLegendary > 0) w.pityLegendary -= 1;
      if (active && abuseEvent.bucksX2 && !freeLeft) w.bucks += Math.round(liveCost * 0.2 * bucksMult(abuseEvent)); // кешбек під час події, реально помножений
      setResult(won);
      await saveWallet(w);
      setSpinning(false); busyRef.current = false;
    }, 1500);
  }
  function walletSnapshot() { return JSON.parse(JSON.stringify(wallet)); }

  return (
    <div style={sx.tabWrap}>
      <h2 style={sx.h2}>Крутити</h2>
      <p style={{ color: "#9ca3af", fontSize: 12, marginTop: -8 }}>
        Безкоштовно сьогодні: <b style={{ color: "#4ade80" }}>{wallet.freeSpinsLeft}</b> · Ціна: {cost} 💵
        {costLevel > 0 && <span style={{ color: "#f87171" }}> (ціна поступово знижується, якщо не крутити)</span>}
      </p>
      <div style={sx.reelsRow}>
        {[0, 1, 2].map((i) => (<div key={i} style={{ ...sx.reelSlot, ...(spinning ? { animation: "reelPulse 0.4s ease infinite" } : {}) }}>{reels[i] ? <CardFace card={reels[i]} /> : <div style={sx.reelEmpty}>?</div>}</div>))}
      </div>
      <button disabled={spinning} onClick={spin} style={{ ...sx.primaryBtn, opacity: spinning ? 0.6 : 1, maxWidth: 260 }}>
        {spinning ? "Крутиться…" : wallet.freeSpinsLeft > 0 ? "Крутити" : `Крутити за ${cost} 💵`}
      </button>
      {result && !spinning && (
        <div style={{
          marginTop: 12, padding: "8px 12px", borderRadius: 12, textAlign: "center",
          background: result.some(c => c.rarity === "Ексклюзивна") ? "linear-gradient(135deg,#7c2d12,#a855f7)" :
                      result.some(c => c.rarity === "Легендарна") ? "linear-gradient(135deg,#78350f,#fbbf24)" :
                      result.some(c => c.rarity === "Міфічна") ? "linear-gradient(135deg,#4c1d95,#7c3aed)" : "#111827",
          animation: "fadeSlideUp 0.25s ease",
        }}>
          <p style={{ color: "#fff", fontWeight: 800, fontSize: 13, margin: "0 0 6px" }}>
            {result.some(c => c.rarity === "Ексклюзивна") ? "🔥 Ексклюзивна!" :
             result.some(c => c.rarity === "Легендарна") ? "✨ Легендарна!" :
             result.some(c => c.rarity === "Міфічна") ? "💜 Міфічна!" : "Ви отримали:"}
          </p>
          <div style={{ display: "flex", gap: 6, justifyContent: "center", flexWrap: "wrap" }}>{result.map((c, i) => <CardFace key={i} card={c} small />)}</div>
        </div>
      )}
      <RaritySummary weights={effectiveWeights(rarityOverride, abuseEvent, wallet)} tempCards={allCards().filter((c) => c.tempEvent && c.expiresAt > Date.now())} />
      <DailyRouletteSection wallet={wallet} saveWallet={saveWallet} allCards={allCards} showToast={showToast} abuseEvent={abuseEvent} />
    </div>
  );
}

function DailyRouletteModal({ wallet, saveWallet, allCards, showToast, abuseEvent, onClose }) {

  const [prize, setPrize] = useState(null);
  function pickPrize() {
    const total = DAILY_ROULETTE_TABLE.reduce((a, p) => a + p.weight, 0);
    let r = Math.random() * total;
    for (const p of DAILY_ROULETTE_TABLE) { if (r < p.weight) return p; r -= p.weight; }
    return DAILY_ROULETTE_TABLE[0];
  }
  async function spin() {
    if (spinning || prize) return;
    setSpinning(true);
    const won = pickPrize();
    let ticks = 0;
    const flickerTimer = setInterval(() => {
      setFlicker(DAILY_ROULETTE_TABLE[Math.floor(Math.random() * DAILY_ROULETTE_TABLE.length)].label);

      if (won.type === "bucks") { if (!w.bucksInfinite) w.bucks += Math.round(won.amount * bucksMult(abuseEvent)); }
      else if (won.type === "card") {
        const rp = pool.filter((c) => c.rarity === won.rarity);
        const card = rp[Math.floor(Math.random() * rp.length)];
        if (card) { w.collection[card.id] = (w.collection[card.id] || 0) + 1; if (!w.obtainedAt[card.id]) w.obtainedAt[card.id] = Date.now(); w.cardOrigin = w.cardOrigin || {}; w.cardOrigin[card.id] = "Щоденна рулетка 🎡"; }

        const rp = pool.filter((c) => c.rarity === "Ексклюзивна");
        for (let i = 0; i < won.count; i++) {
          const card = rp[Math.floor(Math.random() * rp.length)];
          if (card) { w.collection[card.id] = (w.collection[card.id] || 0) + 1; if (!w.obtainedAt[card.id]) w.obtainedAt[card.id] = Date.now(); w.cardOrigin = w.cardOrigin || {}; w.cardOrigin[card.id] = "Джекпот щоденної рулетки 🎉"; }
        }

      await saveWallet(w);
      showToast(won.type === "jackpot" ? "ДЖЕКПОТ!! 🎉🎉🎉" : `Виграно: ${won.label}`, "ok");
    }, 1650);

/* ============================== SHOP ============================== */
function ShopTab({ wallet, saveWallet, showToast, globalShopNonce, abuseEvent, rarityOverride, allCards, nick, busyRef }) {
  const [sub, setSub] = useState("deals");
  const WINDOW_MS = 10 * 60 * 1000;
  const bucket = Math.floor(Date.now() / WINDOW_MS) + globalShopNonce + (wallet.shopNonce || 0) * 1000;
  const nextRefresh = WINDOW_MS - (Date.now() % WINDOW_MS);
  const [left, setLeft] = useState(nextRefresh);
  useEffect(() => { const t = setInterval(() => setLeft((l) => (l > 1000 ? l - 1000 : WINDOW_MS)), 1000); return () => clearInterval(t); }, []);
  const extraDiscount = abuseEvent && abuseEvent.expiresAt > Date.now() ? (abuseEvent.discount || 0) : 0;
  const weights = rarityOverride || BASE_RARITY_WEIGHT;
  const boughtIndices = (wallet.dealsBought && wallet.dealsBought.bucket === bucket) ? wallet.dealsBought.indices : [];

  function pickDiscount(rng) {
    const total = DISCOUNT_TABLE.reduce((a, [, w]) => a + w, 0);
    let r = rng() * total;
    for (const [d, w] of DISCOUNT_TABLE) { if (r < w) return d; r -= w; }
    return 5;
  }
  const SHOP_RARITIES = ["Рідкісна", "Епічна", "Міфічна", "Легендарна"]; // Ексклюзивна ніколи не потрапляє в магазин акцій
  const shopWeights = {}; SHOP_RARITIES.forEach(r => { shopWeights[r] = weights[r] || 1; });
  const pool = allCards().filter(c => !c.tempEvent);
  // гарантуємо що кожна з 4 рідкостей з'явиться хоч раз, і жодна не повториться більше 3 разів серед 6 позицій
  const posOrder = [0, 1, 2, 3, 4, 5];
  const shuffleRng = seededRandom(bucket * 31 + 3);
  for (let i = posOrder.length - 1; i > 0; i--) { const j = Math.floor(shuffleRng() * (i + 1)); [posOrder[i], posOrder[j]] = [posOrder[j], posOrder[i]]; }
  const rarityAssign = new Array(6).fill(null);
  const counts = {}; SHOP_RARITIES.forEach(r => (counts[r] = 0));
  SHOP_RARITIES.forEach((r, i) => { rarityAssign[posOrder[i]] = r; counts[r]++; });
  for (let i = 0; i < 6; i++) {
    if (rarityAssign[i]) continue;
    const rng = seededRandom(bucket * 97 + i * 13 + 7);
    let r, tries = 0;
    do { r = weightedPick(rng, shopWeights); tries++; } while (counts[r] >= 3 && tries < 25);
    rarityAssign[i] = r; counts[r] = (counts[r] || 0) + 1;
  }
  const slots = [];
  for (let i = 0; i < 6; i++) {
    const rng = seededRandom(bucket * 97 + i * 13 + 7);
    const rarity = rarityAssign[i];
    const rp = pool.filter(c => c.rarity === rarity);
    const card = rp[Math.floor(rng() * rp.length)] || pool[0];
    let discount = Math.min(95, pickDiscount(rng) + extraDiscount);
    if (discount >= 100 && card.rarity === "Легендарна") discount = 75; // безкоштовна легендарка — це занадто, бережемо економіку
    const price = Math.max(0, Math.round(card.price * (1 - discount / 100)));
    slots.push({ card, discount, price, key: i, free: price === 0 });
  }

  async function buy(slot, isCatalog) {
    if (busyRef.current) return; busyRef.current = true;
    if (!wallet.bucksInfinite && wallet.bucks < slot.price) { showToast("Недостатньо баксів", "err"); busyRef.current = false; return; }
    const w = JSON.parse(JSON.stringify(wallet));
    if (!w.bucksInfinite) w.bucks -= slot.price;
    w.collection[slot.card.id] = (w.collection[slot.card.id] || 0) + 1;
    if (!w.obtainedAt[slot.card.id]) w.obtainedAt[slot.card.id] = Date.now();
    w.maxCount[slot.card.id] = Math.max(w.maxCount[slot.card.id] || 0, w.collection[slot.card.id]);
    w.cardOrigin = w.cardOrigin || {}; w.cardOrigin[slot.card.id] = isCatalog ? "Куплено в каталозі 🛒" : "Куплено в магазині акцій 🛒";
    if (!isCatalog) {
      const cur = (w.dealsBought && w.dealsBought.bucket === bucket) ? w.dealsBought.indices : [];
      w.dealsBought = { bucket, indices: [...new Set([...cur, slot.key])] };
    }
    await saveWallet(w);
    showToast(`Куплено: ${slot.card.name}!`, "ok");
    busyRef.current = false;
  }
  async function reroll(cost, guaranteeGood) {
    if (!wallet.bucksInfinite && wallet.bucks < cost) { showToast("Недостатньо баксів", "err"); return; }
    const w = JSON.parse(JSON.stringify(wallet));
    if (!w.bucksInfinite) w.bucks -= cost;
    w.shopNonce = (w.shopNonce || 0) + 1;
    w.dealsBought = { bucket: 0, indices: [] };
    await saveWallet(w);
    showToast(guaranteeGood ? "Магазин оновлено, серед позицій гарантовано щось хороше!" : "Магазин оновлено особисто для вас!", "ok");
  }

  const mm = Math.floor(left / 60000), ss = Math.floor((left % 60000) / 1000);
  const allSold = boughtIndices.length >= 6;
  return (
    <div style={sx.tabWrap}>
      <h2 style={sx.h2}>Магазин акцій</h2>
      <div style={sx.authTabs}>
        <button onClick={() => setSub("deals")} style={{ ...sx.authTabBtn, ...(sub === "deals" ? sx.authTabActive : {}) }}>Акції</button>
        <button onClick={() => setSub("catalog")} style={{ ...sx.authTabBtn, ...(sub === "catalog" ? sx.authTabActive : {}) }}>Всі картки</button>
      </div>
      {sub === "deals" && (
        <>
          <p style={{ color: "#9ca3af", fontSize: 12 }}>Оновлення через {mm}:{String(ss).padStart(2, "0")}{extraDiscount > 0 && <span style={{ color: "#4ade80" }}> · Подія: додаткова знижка -{extraDiscount}%</span>}</p>
          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
            <button style={sx.smallBtn} onClick={() => reroll(500, false)}>Оновити зараз (500)</button>
            <button style={{ ...sx.smallBtn, background: "#7c3aed" }} onClick={() => reroll(1000, true)}>Преміум-оновлення (1000)</button>
          </div>
          {allSold ? (
            <div style={{ textAlign: "center", padding: 30, color: "#6b7280" }}>
              🛒 Всі 6 акцій розкуплено!<br /><span style={{ fontSize: 12 }}>Наступне оновлення через {mm}:{String(ss).padStart(2, "0")} (або платно вище)</span>
            </div>
          ) : (
            <div style={sx.shopGrid}>
              {slots.map((s) => {
                const bought = boughtIndices.includes(s.key);
                return (
                  <div key={s.key} style={{ ...sx.shopCard, opacity: bought ? 0.4 : 1, ...(s.free ? { border: "2px solid #4ade80", boxShadow: "0 0 14px #4ade8055" } : {}) }}>
                    <CardFace card={s.card} />
                    <div style={{ ...sx.discountTag, ...(s.free ? { background: "#16a34a" } : {}) }}>{s.free ? "БЕЗКОШТОВНО 🎁" : `-${s.discount}%`}</div>
                    <div style={{ marginTop: 6, fontSize: 12, color: "#e5e7eb" }}>
                      <span style={{ textDecoration: "line-through", color: "#6b7280", marginRight: 4 }}>{s.card.price}</span>{s.free ? "0" : fmtBucks(s.price)}
                    </div>
                    <button disabled={bought} onClick={() => buy(s, false)} style={sx.smallBtn}>{bought ? "Куплено" : s.free ? "Забрати" : "Купити"}</button>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}
      {sub === "catalog" && (
        <div style={sx.collectionGrid}>
          {pool.map((c) => {
            const catPrice = c.price * (CATALOG_MULTIPLIER[c.rarity] || 20);
            return (
              <div key={c.id} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                <CardFace card={c} />
                <div style={{ fontSize: 11, color: "#fbbf24", fontWeight: 700 }}>{fmtBucks(catPrice)}</div>
                <button onClick={() => buy({ card: c, price: catPrice }, true)} style={{ ...sx.smallBtn, fontSize: 10 }}>Купити</button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function CollectionTab({ wallet, saveWallet, showToast, allCards, abuseEvent }) {
  const [sortBy, setSortBy] = useState("date");
  const [detail, setDetail] = useState(null);
  const cards = allCards();
  async function sellInstant(id, e) {
    e.stopPropagation();
    const card = cards.find((c) => c.id === id);
    if (card.tempEvent && card.expiresAt > Date.now()) { showToast("Цю подієву картку не можна продати, поки подія ще активна", "err"); return; }
    if (card.tempEvent && !window.confirm("Це ЕКСКЛЮЗИВНА тимчасова подієва картка! Ви точно хочете її продати?")) return;
    const price = Math.round(card.price * 0.4 * bucksMult(abuseEvent));
    const w = JSON.parse(JSON.stringify(wallet));
    w.collection[id] -= 1; if (!w.bucksInfinite) w.bucks += price;
    await saveWallet(w);
    showToast(`Продано миттєво за ${price} 💵`, "ok");
  }
  const rarityRank = { "Ексклюзивна": 0, "Легендарна": 1, "Міфічна": 2, "Епічна": 3, "Рідкісна": 4 };
  const owned = cards.filter(c => (wallet.collection[c.id] || 0) > 0);
  const unowned = cards.filter(c => !(wallet.collection[c.id] || 0) > 0);
  function sortFn(a, b) {
    if (sortBy === "rarity") return rarityRank[a.rarity] - rarityRank[b.rarity];
    return (wallet.obtainedAt[b.id] || 0) - (wallet.obtainedAt[a.id] || 0);
  }
  owned.sort(sortFn);
  const ordered = [...owned, ...unowned];

  return (
    <div style={sx.tabWrap}>
      <h2 style={sx.h2}>Колекція</h2>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <p style={{ color: "#9ca3af", fontSize: 12, margin: 0 }}>Зібрано {owned.length} / {cards.length}</p>
        <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} style={{ ...sx.input, width: "auto", marginBottom: 0, fontSize: 11, padding: "6px 8px" }}>
          <option value="date">Спочатку нові</option>
          <option value="rarity">За рідкістю</option>
        </select>
      </div>
      <div style={sx.collectionGrid}>
        {ordered.map((c) => {
          const count = wallet.collection[c.id] || 0;
          return (
            <div key={c.id} style={sx.collectionCard}>
              <CardFace card={c} count={count > 0 ? count : undefined} hidden={count === 0} small onClick={() => count > 0 && setDetail(c)} />
              {count > 0 && <button onClick={(e) => sellInstant(c.id, e)} style={{ ...sx.smallBtn, fontSize: 9, padding: "3px 6px", marginTop: 4 }}>Продати ({Math.round(c.price * 0.4)})</button>}
            </div>
          );
        })}
      </div>
      {detail && (
        <div style={sx.modalOverlay} onClick={() => setDetail(null)}>
          <div style={sx.modal} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", gap: 12 }}>
              <CardFace card={detail} />
              <div>
                <h3 style={{ margin: "0 0 4px", color: "#fbbf24" }}>{detail.name}</h3>
                <p style={{ margin: 2, fontSize: 12, color: RARITY_COLOR[detail.rarity] }}>{detail.rarity}</p>
                <p style={{ margin: 2, fontSize: 12, color: "#9ca3af" }}>Отримано: {new Date(wallet.obtainedAt[detail.id]).toLocaleString("uk-UA")}</p>
                <p style={{ margin: 2, fontSize: 12, color: "#9ca3af" }}>Зараз маєте: {wallet.collection[detail.id] || 0}</p>
                <p style={{ margin: 2, fontSize: 12, color: "#9ca3af" }}>Рекорд одночасно: {wallet.maxCount[detail.id] || 0}</p>
                <p style={{ margin: 2, fontSize: 12, color: "#9ca3af" }}>Базова ціна: {fmtBucks(detail.price)}</p>
                {detail.tempEvent && detail.origin && (
                  <p style={{ margin: "6px 2px 2px", fontSize: 11, color: "#f87171" }}>🔥 Звідки: {detail.origin}</p>
                )}
              </div>
            </div>
            <button style={{ ...sx.smallBtn, marginTop: 10, width: "100%" }} onClick={() => setDetail(null)}>Закрити</button>
          </div>
        </div>
      )}
    </div>
  );
}

function CustomAvatarInput({ profile, saveProfile }) {
  const [val, setVal] = useState("");
  function apply() {
    const v = val.trim();
    if (!v) return;
    // беремо лише перший "символ" (з урахуванням складних емодзі), максимум ~4 code points
    const chars = Array.from(v).slice(0, 4).join("");
    saveProfile({ ...profile, avatar: chars });
    setVal("");
  }
  return (
    <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
      <input value={val} onChange={(e) => setVal(e.target.value)} placeholder="Свій емодзі (напр. 🌟 або 💩)" style={{ ...sx.input, marginBottom: 0, flex: 1 }} onKeyDown={(e) => e.key === "Enter" && apply()} />
      <button style={sx.smallBtn} onClick={apply}>Встановити</button>
    </div>
  );
}
function ChatModal({ nick, friend, onClose }) {
  // КРИТИЧНО: кожне повідомлення зберігається в ОКРЕМОМУ ключі dm_<room>_<msgid>, а не в одному
  // спільному масиві. Раніше коли обидва співрозмовники писали майже одночасно, це був класичний
  // read-modify-write race: хто зберіг останнім — стирав повідомлення іншого. Саме тому повідомлення
  // "не показувались" або показувалось лише одне. Той самий підхід вже використовується для user_/card_.
  const roomPrefix = "dm_" + [nick, friend.nick].sort().join("_") + "_";
  const [messages, setMessages] = useState([]);
  const [text, setText] = useState("");
  const endRef = useRef(null);
  const load = useCallback(async () => {
    const keys = await sList(roomPrefix, true);
    const loaded = await Promise.all(keys.map((k) => sGet(k, true)));
    const valid = loaded.filter(Boolean).sort((a, b) => a.ts - b.ts);
    setMessages(valid);
  }, [roomPrefix]);
  useEffect(() => { load(); const t = setInterval(load, 2500); return () => clearInterval(t); }, [load]);
  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: "smooth" }); }, [messages]);
  async function send() {
    const v = text.trim(); if (!v) return;
    setText("");
    const msg = { id: "m" + Date.now() + Math.random().toString(36).slice(2, 6), from: nick, text: v.slice(0, 300), ts: Date.now() };
    await sSet(roomPrefix + msg.id, msg, true);
    setMessages((prev) => [...prev, msg]);
  }
  return (
    <div style={sx.modalOverlay} onClick={onClose}>
      <div style={{ ...sx.modal, maxWidth: 340, display: "flex", flexDirection: "column", height: 460, padding: 0, overflow: "hidden" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ padding: "12px 14px", borderBottom: "1px solid #1f2937", display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 22 }}>{friend.avatar}</span>
          <div style={{ flex: 1, fontWeight: 700, fontSize: 14 }}>{friend.nick}<VerBadge v={friend.verified} /></div>
          <span onClick={onClose} style={{ cursor: "pointer", color: "#9ca3af" }}>✕</span>
        </div>
        <div style={{ flex: 1, overflowY: "auto", padding: "10px 12px", display: "flex", flexDirection: "column", gap: 6 }}>
          {messages.length === 0 && <p style={{ textAlign: "center", color: "#6b7280", fontSize: 12, marginTop: 20 }}>Повідомлень ще немає. Напишіть перше!</p>}
          {messages.map((m) => (
            <div key={m.id} style={{ alignSelf: m.from === nick ? "flex-end" : "flex-start", maxWidth: "78%" }}>
              <div style={{
                background: m.from === nick ? "linear-gradient(135deg,#2563eb,#1d4ed8)" : "#1f2937",
                color: "#fff", borderRadius: 12, padding: "7px 11px", fontSize: 13, wordBreak: "break-word",
                borderBottomRightRadius: m.from === nick ? 3 : 12, borderBottomLeftRadius: m.from === nick ? 12 : 3,
              }}>{m.text}</div>
              <div style={{ fontSize: 9, color: "#6b7280", textAlign: m.from === nick ? "right" : "left", marginTop: 2 }}>{new Date(m.ts).toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" })}</div>
            </div>
          ))}
          <div ref={endRef} />
        </div>
        <div style={{ display: "flex", gap: 6, padding: 10, borderTop: "1px solid #1f2937" }}>
          <input value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Написати повідомлення..." style={{ ...sx.input, marginBottom: 0, flex: 1 }} />
          <button style={sx.smallBtn} onClick={send}>➤</button>
        </div>
      </div>
    </div>
  );
}

function DuelSetupModal({ wallet, saveWallet, nick, friendsData, onClose, onEnterDuel, showToast, allCards }) {
  const [mode, setMode] = useState("create");
  const [joinCode, setJoinCode] = useState("");
  const [room, setRoom] = useState(null); // lobby room after creation
  const [stakeType, setStakeType] = useState("none");
  const [stakeAmount, setStakeAmount] = useState(200);
  const [stakeCardId, setStakeCardId] = useState(null);
  const [durationSec, setDurationSec] = useState(60);

  async function createRoom() {
    const code = Math.random().toString(36).slice(2, 6).toUpperCase();
    const r = { code, creator: nick, opponent: null, opponentIsBot: false, status: "lobby", creatorScore: 0, opponentScore: 0, createdAt: Date.now() };
    await sSet("duel_" + code, r, true);
    setRoom(r);
  }
  async function inviteBot() {
    const fresh = { ...room, opponent: BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)], opponentIsBot: true };
    await sSet("duel_" + fresh.code, fresh, true);
    setRoom(fresh);
  }
  useEffect(() => {
    if (!room || room.opponent) return;
    const t = setInterval(async () => { const fresh = await sGet("duel_" + room.code, true); if (fresh && fresh.opponent) setRoom(fresh); }, 2000);
    return () => clearInterval(t);
  }, [room]);

  const ownedDupes = Object.entries(wallet.collection).filter(([, c]) => c > 1);

  async function startMatch() {
    if (stakeType === "bucks") {
      if (stakeAmount % 2 !== 0) { showToast("Сума ставки має бути парною", "err"); return; }
      if (!wallet.bucksInfinite && wallet.bucks < stakeAmount / 2) { showToast("Недостатньо баксів на ставку", "err"); return; }
    }
    const fresh = { ...room, status: "active", durationSec, startedAt: Date.now(), stake: stakeType === "none" ? null : { type: stakeType, amount: stakeAmount, cardId: stakeCardId } };
    if (stakeType === "bucks" && !wallet.bucksInfinite) { const w = JSON.parse(JSON.stringify(wallet)); w.bucks -= stakeAmount / 2; await saveWallet(w); }
    if (stakeType === "card" && stakeCardId) { const w = JSON.parse(JSON.stringify(wallet)); w.collection[stakeCardId] -= 1; await saveWallet(w); }
    await sSet("duel_" + fresh.code, fresh, true);
    onEnterDuel(fresh);
    onClose();
  }
  async function joinRoom() {
    const code = joinCode.trim().toUpperCase();
    const r = await sGet("duel_" + code, true);
    if (!r) { showToast("Кімнату не знайдено", "err"); return; }
    if (r.opponent && r.opponent !== nick) { showToast("Кімната вже заповнена", "err"); return; }
    r.opponent = nick;
    await sSet("duel_" + code, r, true);
    showToast("Приєднались! Чекайте, поки творець кімнати почне матч…", "ok");
    const poll = setInterval(async () => {
      const fresh = await sGet("duel_" + code, true);
      if (fresh && fresh.status === "active") { clearInterval(poll); onEnterDuel(fresh); onClose(); }
    }, 1500);
  }

  if (room) {
    return (
      <div style={sx.modalOverlay} onClick={onClose}>
        <div style={sx.modal} onClick={(e) => e.stopPropagation()}>
          <h3 style={{ marginTop: 0, color: "#fbbf24" }}>Кімната: {room.code}</h3>
          {!room.opponent ? (
            <>
              <p style={{ fontSize: 12, color: "#9ca3af" }}>Дайте цей код другу, або запросіть бота:</p>
              {friendsData.map((f) => (
                <div key={f.nick} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#1f2937", padding: 8, borderRadius: 8, marginBottom: 6 }}>
                  <span>{f.avatar} {f.nick}</span><span style={{ fontSize: 10, color: "#6b7280" }}>дайте код: {room.code}</span>
                </div>
              ))}
              <button style={sx.primaryBtn} onClick={inviteBot}>🤖 Грати проти бота (миттєво)</button>
            </>
          ) : (
            <>
              <p style={{ fontSize: 12, color: "#4ade80" }}>Суперник: {room.opponent} {room.opponentIsBot ? "🤖" : ""} — обирайте умови матчу:</p>
              <label style={{ fontSize: 12, color: "#9ca3af" }}>Тривалість: {durationSec}с</label>
              <input type="range" min="30" max="180" step="10" value={durationSec} onChange={(e) => setDurationSec(Number(e.target.value))} style={{ width: "100%", marginBottom: 10 }} />
              <div style={sx.authTabs}>
                <button onClick={() => setStakeType("none")} style={{ ...sx.authTabBtn, ...(stakeType === "none" ? sx.authTabActive : {}) }}>Без ставки</button>
                <button onClick={() => setStakeType("bucks")} style={{ ...sx.authTabBtn, ...(stakeType === "bucks" ? sx.authTabActive : {}) }}>Бакси</button>
                <button onClick={() => setStakeType("card")} style={{ ...sx.authTabBtn, ...(stakeType === "card" ? sx.authTabActive : {}) }}>Картка</button>
              </div>
              {stakeType === "bucks" && (
                <input type="number" step="2" value={stakeAmount} onChange={(e) => setStakeAmount(Number(e.target.value))} style={sx.input} placeholder="Загальний банк (парне число)" />
              )}
              {stakeType === "card" && (
                <select value={stakeCardId || ""} onChange={(e) => setStakeCardId(e.target.value)} style={sx.input}>
                  <option value="">— оберіть картку-дублікат —</option>
                  {ownedDupes.map(([id, c]) => { const cd = allCards().find((x) => x.id === id); return <option key={id} value={id}>{cd ? cd.name : id} (маєте {c})</option>; })}
                </select>
              )}
              <p style={{ fontSize: 11, color: "#f87171" }}>Рахуються лише Міфічні, Легендарні та Ексклюзивні картки!</p>
              <button style={sx.primaryBtn} onClick={startMatch}>Почати матч (3-2-1)</button>
            </>
          )}
          <button style={{ ...sx.smallBtn, marginTop: 8, width: "100%" }} onClick={onClose}>Закрити</button>
        </div>
      </div>
    );
  }

  return (
    <div style={sx.modalOverlay} onClick={onClose}>
      <div style={sx.modal} onClick={(e) => e.stopPropagation()}>
        <div style={sx.authTabs}>
          <button onClick={() => setMode("create")} style={{ ...sx.authTabBtn, ...(mode === "create" ? sx.authTabActive : {}) }}>Створити</button>
          <button onClick={() => setMode("join")} style={{ ...sx.authTabBtn, ...(mode === "join" ? sx.authTabActive : {}) }}>Приєднатись</button>
        </div>
        {mode === "create" ? (
          <>
            <p style={{ fontSize: 12, color: "#9ca3af" }}>Хто накрутить більше Легендарних/Ексклюзивних карток за час — переможе.</p>
            <button style={sx.primaryBtn} onClick={createRoom}>Створити кімнату</button>
          </>
        ) : (
          <>
            <input placeholder="Код кімнати" value={joinCode} onChange={(e) => setJoinCode(e.target.value)} style={sx.input} />
            <button style={sx.primaryBtn} onClick={joinRoom}>Приєднатись</button>
          </>
        )}
        <button style={{ ...sx.smallBtn, marginTop: 8, width: "100%" }} onClick={onClose}>Закрити</button>
      </div>
    </div>
  );
}
function DuelScreen({ room, nick, wallet, saveWallet, allCards, rarityOverride, abuseEvent, onFinish, onExit, showToast }) {
  const isCreator = room.creator === nick;
  const [countdown, setCountdown] = useState(3);
  const [started, setStarted] = useState(false);
  const [myScore, setMyScore] = useState(0);
  const [oppScore, setOppScore] = useState(0);
  const [timeLeft, setTimeLeft] = useState(room.durationSec);
  const [spinning, setSpinning] = useState(false);
  const [reel, setReel] = useState(null);
  const finishedRef = useRef(false);
  const myScoreRef = useRef(0); const oppScoreRef = useRef(0);
  useEffect(() => { myScoreRef.current = myScore; }, [myScore]);
  useEffect(() => { oppScoreRef.current = oppScore; }, [oppScore]);

  useEffect(() => {
    if (countdown <= 0) { setStarted(true); return; }
    const t = setTimeout(() => setCountdown((c) => c - 1), 800);
    return () => clearTimeout(t);
  }, [countdown]);

  useEffect(() => {
    if (!started) return;
    const t = setInterval(() => setTimeLeft((v) => { if (v <= 1) { finish(); return 0; } return v - 1; }), 1000);
    return () => clearInterval(t);
    // eslint-disable-next-line
  }, [started]);

  // якщо суперник реальний гравець — опитуємо його рахунок; якщо бот — симулюємо самі
  useEffect(() => {
    if (!started || room.opponentIsBot) return;
    const t = setInterval(async () => {
      const fresh = await sGet("duel_" + room.code, true);
      if (fresh) setOppScore(isCreator ? fresh.opponentScore : fresh.creatorScore);
    }, 2000);
    return () => clearInterval(t);
  }, [started]);
  useEffect(() => {
    if (!started || !room.opponentIsBot) return;
    let cancelled = false;
    let timerId;
    function scheduleNext() {
      // адаптивна складність: якщо гравець сильно попереду — бот трохи "наздоганяє" (частіше крутить),
      // якщо гравець позаду — бот трохи стишується, щоб матч не виглядав завжди однаково
      const gap = myScoreRef.current - oppScoreRef.current;
      let baseDelay = 1800;
      if (gap >= 5) baseDelay = 1300; else if (gap <= -5) baseDelay = 2300;
      const jitter = Math.floor(Math.random() * 700) - 250; // трошки випадковості, щоб не виглядало як скрипт
      timerId = setTimeout(() => {
        if (cancelled) return;
        const rng = seededRandom(Date.now() % 1000000 + Math.floor(Math.random() * 100000));
        const weights = effectiveWeights(rarityOverride, abuseEvent, wallet);
        const rarity = weightedPick(rng, weights);
        const rarityScore = { "Рідкісна": 0, "Епічна": 0, "Міфічна": 1, "Легендарна": 3, "Ексклюзивна": 8 }[rarity] || 0;
        if (rarityScore > 0) setOppScore((s) => s + rarityScore);
        scheduleNext();
      }, Math.max(700, baseDelay + jitter));
    }
    scheduleNext();
    return () => { cancelled = true; clearTimeout(timerId); };
  }, [started]);

  async function doSpin() {
    if (spinning || timeLeft <= 0) return;
    setSpinning(true);
    const pool = allCards();
    const rng = seededRandom(Date.now() % 1000000 + Math.floor(Math.random() * 100000));
    const weights = effectiveWeights(rarityOverride, abuseEvent, wallet);
    const rarity = weightedPick(rng, weights);
    const rp = pool.filter(c => c.rarity === rarity && !c.tempEvent);
    const card = rp[Math.floor(rng() * rp.length)] || pool[0];
    setReel(card);
    const rarityScore = { "Рідкісна": 0, "Епічна": 0, "Міфічна": 1, "Легендарна": 3, "Ексклюзивна": 8 }[rarity] || 0;
    const newScore = myScore + rarityScore;
    setMyScore(newScore);
    if (!room.opponentIsBot) {
      const fresh = (await sGet("duel_" + room.code, true)) || room;
      if (isCreator) fresh.creatorScore = newScore; else fresh.opponentScore = newScore;
      await sSet("duel_" + room.code, fresh, true);
    }
    setTimeout(() => setSpinning(false), 500);
  }
  async function payoutIfWinner(winner) {
    if (!room.stake) return;
    if (winner !== nick) return; // тільки переможець нараховує собі виграш, аби уникнути подвійного запису
    const w = JSON.parse(JSON.stringify(wallet));
    if (room.stake.type === "bucks") w.bucks += Math.round(room.stake.amount * bucksMult(abuseEvent));
    if (room.stake.type === "card" && room.stake.cardId) {
      w.collection[room.stake.cardId] = (w.collection[room.stake.cardId] || 0) + (room.opponentIsBot ? 1 : 2);
      w.cardOrigin = w.cardOrigin || {}; w.cardOrigin[room.stake.cardId] = "Виграно в дуелі ⚔️";
    }
    await saveWallet(w);
  }
  async function finish() {
    if (finishedRef.current) return; finishedRef.current = true;
    const myFinal = myScore, oppFinal = oppScore;
    const winner = myFinal === oppFinal ? "draw" : (myFinal > oppFinal ? nick : room.opponent);
    const fresh = { ...room, status: "finished", winner };
    if (!room.opponentIsBot) await sSet("duel_" + room.code, fresh, true);
    await payoutIfWinner(winner);
    onFinish(fresh);
    const RARE_PLUS = ["Міфічна", "Легендарна", "Ексклюзивна"];
    const myTotal = Object.values(wallet.collection || {}).filter((c) => c > 0).length;
    const myRarePlus = allCards().filter((c) => RARE_PLUS.includes(c.rarity) && (wallet.collection[c.id] || 0) > 0).length;
    let oppTotal = null, oppRarePlus = null;
    if (!room.opponentIsBot) {
      const oppW = await sGet("wallet_" + room.opponent, true);
      if (oppW) {
        oppTotal = Object.values(oppW.collection || {}).filter((c) => c > 0).length;
        oppRarePlus = allCards().filter((c) => RARE_PLUS.includes(c.rarity) && (oppW.collection[c.id] || 0) > 0).length;
      }
    }
    setResultData({ winner, myFinal, oppFinal, myTotal, myRarePlus, oppTotal, oppRarePlus });
  }
  const [resultData, setResultData] = useState(null);

  if (resultData) {

            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}>
              <span>{nick}: {resultData.myTotal} карток (рідкісних+: {resultData.myRarePlus})</span>

            {resultData.oppTotal != null && (
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                <span>{room.opponent}: {resultData.oppTotal} карток (рідкісних+: {resultData.oppRarePlus})</span>
              </div>
            )}
            {room.stake && (
              <p style={{ fontSize: 12, color: "#4ade80", marginTop: 8, marginBottom: 0 }}>
                {draw ? "Нічия — ставка повертається кожному." : `Ставку (${room.stake.type === "bucks" ? fmtBucks(room.stake.amount) + " баксів" : "картка"}) отримує: ${resultData.winner}`}
              </p>
            )}
          </div>
          <button style={{ ...sx.primaryBtn, maxWidth: 220 }} onClick={onExit}>Закрити</button>
        </div>
      </div>
    );
  }

  if (!started) {
    return (
      <div style={{ ...sx.app, alignItems: "center", justifyContent: "center", display: "flex" }}>
        <div style={{ fontSize: 64, fontWeight: 900, color: "#fbbf24" }}>{countdown > 0 ? countdown : "ПОЧАЛОСЬ!"}</div>
      </div>
    );
  }
  return (
    <div style={{ ...sx.app }}>
      <div style={{ textAlign: "center", padding: 12 }}>
        <div style={{ fontSize: 20, fontWeight: 900, color: "#f87171" }}>⏱ {timeLeft}с</div>
        <div style={{ display: "flex", justifyContent: "space-around", margin: "10px 0" }}>
          <div><div style={{ fontSize: 12, color: "#9ca3af" }}>{nick} (ви)</div><div style={{ fontSize: 20, fontWeight: 700, color: "#fbbf24" }}>{myScore}</div></div>
          <div style={{ fontSize: 18 }}>VS</div>
          <div><div style={{ fontSize: 12, color: "#9ca3af" }}>{room.opponent}{room.opponentIsBot ? " 🤖" : ""}</div><div style={{ fontSize: 20, fontWeight: 700, color: "#fbbf24" }}>{oppScore}</div></div>
        </div>
        <p style={{ fontSize: 10, color: "#6b7280" }}>Рахуються: Міфічна (+1), Легендарна (+3), Ексклюзивна (+8)</p>
        {reel && <div style={{ display: "flex", justifyContent: "center", marginBottom: 10 }}><CardFace card={reel} /></div>}
        <button disabled={spinning} onClick={doSpin} style={{ ...sx.primaryBtn, maxWidth: 220 }}>{spinning ? "Крутиться…" : "КРУТИТИ!"}</button>
        <button style={{ ...sx.smallBtn, marginTop: 10 }} onClick={() => { finishedRef.current = true; onExit(); }}>Вийти (здатись)</button>
      </div>
    </div>
  );
}

    if (!msgText.trim()) { showToast("Ви нічого не написали!", "err"); return; }
    setBroadcastBusy(true);
    const msg = { from: senderName || "Адмін", avatar: profile ? profile.avatar : "👑", text: msgText.trim(), ts: Date.now() };
    await sSet("broadcast_msg", msg, true);
    setBroadcastSent(true); setMsgText("");
    setTimeout(() => setBroadcastSent(false), 4000);
    setBroadcastBusy(false);
  }
  async function applyWeights() { const o = { "Рідкісна": Number(w1), "Епічна": Number(w2), "Міфічна": Number(w5), "Легендарна": Number(w3), "Ексклюзивна": Number(w4) }; await sSet("rarity_override", o, true); setRarityOverride(o); showToast("Шанси оновлено для всіх гравців негайно", "ok"); }
  async function resetWeights() { await sSet("rarity_override", null, true); setRarityOverride(null); showToast("Шанси скинуто до стандартних", "ok"); }

  function onAbuseImgFile(e) {
    const file = e.target.files[0]; if (!file) return;
    compressImageFile(file, 220, 0.6).then(setAbuseCardImg);
  }
  function onImgFile(e) {
    const file = e.target.files[0]; if (!file) return;
    compressImageFile(file, 220, 0.6).then(setCardImg);
  }
  const [cardIsTemp, setCardIsTemp] = useState(false);
  const [cardSeason, setCardSeason] = useState("");
  const [cardTempMinutes, setCardTempMinutes] = useState(60);
  const [cardChance, setCardChance] = useState(2);
  async function addCustomCard() {
    if (!cardName || !cardImg) { showToast("Вкажіть назву і фото", "err"); return; }
    const card = {
      id: "custom_" + Date.now(), name: cardName, rarity: cardRarity, price: Number(cardPrice), img: cardImg,
      ...(cardIsTemp ? { tempEvent: true, season: cardSeason, origin: cardSeason ? `Особлива подія — ${cardSeason}` : "Особлива тимчасова подія", dropChance: Math.max(0, Number(cardChance) || 2) / 100, expiresAt: Date.now() + Number(cardTempMinutes) * 60000 } : {}),
    };
    await setCustomCard(card);
    setCustomCards((s) => [...s, card]);
    showToast(`Картку "${cardName}" додано в гру${cardIsTemp ? ` (тимчасова, ${cardTempMinutes} хв)` : ""}!`, "ok");
    setCardName(""); setCardImg(""); setCardIsTemp(false); setCardSeason("");
  }

  return (
    <div style={sx.tabWrap}>
      <h2 style={sx.h2}>🛠️ Адмін-панель (лише для вас)</h2>
      <input placeholder="Нікнейм гравця (ціль)" value={targetNick} onChange={(e) => setTargetNick(e.target.value)} style={sx.input} />
      <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
        <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} style={{ ...sx.input, marginBottom: 0 }} />
        <button style={sx.smallBtn} onClick={giveMoney}>Видати бакси</button>
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
        <input type="number" value={extraSpins} onChange={(e) => setExtraSpins(e.target.value)} style={{ ...sx.input, marginBottom: 0 }} />
        <button style={sx.smallBtn} onClick={giveSpins}>Видати прокрути (фішки)</button>
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
        <select value={giveCardId} onChange={(e) => setGiveCardId(e.target.value)} style={{ ...sx.input, marginBottom: 0 }}>
          <option value="">— оберіть картку —</option>
          {allCards().map((c) => <option key={c.id} value={c.id}>{c.name} ({c.rarity})</option>)}
        </select>
        <button style={sx.smallBtn} onClick={giveCard}>Видати картку</button>
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
        <input placeholder="Новий пароль" value={newPass} onChange={(e) => setNewPass(e.target.value)} style={{ ...sx.input, marginBottom: 0 }} />
        <button style={sx.smallBtn} onClick={changePassword}>Змінити пароль</button>
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
        <button style={sx.smallBtn} onClick={() => grantBadge("blue")}>Синя</button>
        <button style={sx.smallBtn} onClick={() => grantBadge("green")}>Зелена</button>
        <button style={sx.smallBtn} onClick={() => grantBadge("rainbow")}>Райдужна</button>
        <button style={sx.smallBtn} onClick={() => grantBadge("black")}>Чорна</button>
        <button style={{ ...sx.smallBtn, background: "#dc2626" }} onClick={() => grantBadge("red")}>Червона (попередження)</button>
        <button style={sx.smallBtn} onClick={() => grantBadge("none")}>Зняти</button>
      </div>
      <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 4 }}>
        <input type="number" value={banDays} onChange={(e) => setBanDays(e.target.value)} style={{ ...sx.input, width: 70, marginBottom: 0 }} />
        <button style={{ ...sx.smallBtn, background: "#dc2626" }} onClick={banUser}>Забанити на N днів</button>
        <button style={sx.smallBtn} onClick={unbanUser}>Розбанити</button>
      </div>
      <p style={{ fontSize: 10, color: "#6b7280", marginTop: 0 }}>Бан — тимчасово не пускає гравця в акаунт до вказаної дати. "Анулювати" нижче — видаляє акаунт НАЗАВЖДИ, нік більше ніхто не зможе зареєструвати.</p>
      <button style={{ ...sx.smallBtn, background: "#7f1d1d", width: "100%", marginBottom: 14 }} onClick={eraseAccount}>Анулювати акаунт назавжди</button>

      <h3 style={{ color: "#fbbf24", fontSize: 14 }}>ADMIN ABUSE подія</h3>
      <input type="number" placeholder="Хвилин" value={abuseMinutes} onChange={(e) => setAbuseMinutes(e.target.value)} style={sx.input} />
      <input type="number" placeholder="Знижка в магазині, %" value={abuseDiscount} onChange={(e) => setAbuseDiscount(e.target.value)} style={sx.input} />
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 10 }}>
        <input placeholder="Текст банера (пусто = авто-текст з актуальними бонусами)" value={bannerText} onChange={(e) => setBannerText(e.target.value)} style={{ ...sx.input, marginBottom: 0, flex: 1 }} />
        <input type="color" value={bannerColor} onChange={(e) => setBannerColor(e.target.value)} style={{ width: 44, height: 40, border: "none", borderRadius: 6 }} title="Колір тексту банера" />
      </div>
      <button style={{ ...sx.smallBtn, width: "100%", marginBottom: 8 }} onClick={updateBannerLive}>Оновити текст банера прямо зараз (без рестарту)</button>

          <input type="number" step="0.1" placeholder="Шанс випадіння, % (напр. 2)" value={abuseCardChance} onChange={(e) => setAbuseCardChance(e.target.value)} style={sx.input} />

      <select value={rewardCardId} onChange={(e) => setRewardCardId(e.target.value)} style={sx.input}>
        <option value="">— без картки (лише бакси) —</option>
        {allCards().map((c) => <option key={c.id} value={c.id}>{c.name} ({c.rarity})</option>)}
      </select>
      <input placeholder='Причина (напр. "З Днем Народження сайту!")' value={rewardReason} onChange={(e) => setRewardReason(e.target.value)} style={sx.input} />
      <button style={{ ...sx.primaryBtn, marginBottom: 14 }} onClick={giveRewardToAll}>Роздати всім гравцям на сайті</button>

      <h3 style={{ color: "#fbbf24", fontSize: 14 }}>🎨 Тема оформлення сайту (для всіх)</h3>
      <select value={themeChoice} onChange={(e) => setThemeChoice(e.target.value)} style={sx.input}>
        <option value="default">Звичайна</option>
        <option value="halloween">🕸️ Halloween</option>
        <option value="newyear">❄️ Новий рік (лише сніг)</option>
        <option value="valentine">💘 День закоханих</option>
        <option value="april">🤡 1 квітня (жартівливі назви карток)</option>
        <option value="custom">Своя (обрати колір)</option>
      </select>
      {themeChoice === "custom" && (
        <div style={{ marginBottom: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
            <input type="color" value={themePrimary} onChange={(e) => setThemePrimary(e.target.value)} style={{ width: 50, height: 36, border: "none", borderRadius: 6 }} />
            <input type="color" value={themeSecondary} onChange={(e) => setThemeSecondary(e.target.value)} style={{ width: 50, height: 36, border: "none", borderRadius: 6 }} />
            <span style={{ fontSize: 11, color: "#9ca3af" }}>Основний / другий колір градієнта</span>
          </div>
          <input placeholder="Кутова іконка (будь-яке емодзі, необов'язково)" value={themeCorner} onChange={(e) => setThemeCorner(e.target.value)} style={sx.input} />
        </div>
      )}
      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        <button style={sx.primaryBtn} onClick={applyTheme}>Застосувати тему</button>
        <button style={sx.smallBtn} onClick={resetTheme}>Скинути</button>
      </div>

      <h3 style={{ color: "#fbbf24", fontSize: 14 }}>📊 Голосування серед гравців</h3>

        <input placeholder="Варіант 1" value={pollOpt1} onChange={(e) => setPollOpt1(e.target.value)} style={{ ...sx.input, marginBottom: 0 }} />
        <input placeholder="Варіант 2" value={pollOpt2} onChange={(e) => setPollOpt2(e.target.value)} style={{ ...sx.input, marginBottom: 0 }} />
      </div>
      <label style={{ fontSize: 11, color: "#9ca3af" }}>Стартовий баланс: {pollOpt1 || "Варіант 1"} {pollPct1}% / {pollOpt2 || "Варіант 2"} {100 - pollPct1}%</label>
      <input type="range" min="0" max="100" value={pollPct1} onChange={(e) => setPollPct1(Number(e.target.value))} style={{ width: "100%", marginBottom: 10 }} />
      <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
        <button style={sx.primaryBtn} onClick={launchPoll}>Запустити голосування</button>
        <button style={sx.smallBtn} onClick={stopPoll}>Закрити голосування</button>
        <button style={{ ...sx.smallBtn, background: "#7f1d1d" }} onClick={clearPoll}>Прибрати повністю</button>
      </div>
      <p style={{ fontSize: 10, color: "#6b7280", marginTop: -4, marginBottom: 8 }}>«Закрити» — гравці більше не голосують, але дані лишаються, щоб ви могли підбити підсумки. «Прибрати повністю» — видаляє голосування з сайту (натисніть після того, як показали результат).</p>

      {pollResults && (
        <div style={{ background: "#1f2937", borderRadius: 8, padding: 10, marginBottom: 14, fontSize: 12 }}>
          <p style={{ margin: "0 0 6px", fontWeight: 700, color: "#fbbf24" }}>{pollResults.question}</p>
          {(() => {
            const votes = Object.values(pollResults.votes || {});
            const v1 = votes.filter((v) => v === 1).length, v2 = votes.filter((v) => v === 2).length;
            const totalVotes = v1 + v2;
            const realPct1 = totalVotes > 0 ? Math.round((v1 / totalVotes) * 100) : pollResults.basePct1;
            return (
              <>
                <p style={{ margin: 2, color: "#9ca3af" }}>Реальні голоси (бачите тільки ви): {pollResults.opt1} {realPct1}% ({v1}) · {pollResults.opt2} {100 - realPct1}% ({v2})</p>
                <p style={{ margin: "8px 0 4px", fontWeight: 700, color: "#fbbf24" }}>Що показати гравцям:</p>
                <label style={{ fontSize: 11 }}>{pollResults.opt1}: {revealPct1}% / {pollResults.opt2}: {100 - revealPct1}%</label>
