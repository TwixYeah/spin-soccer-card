        {showInfo && (
          <p style={{ margin: "10px 0 0", fontSize: 11, color: "#e5e7eb", lineHeight: 1.5, background: "#00000066", borderRadius: 10, padding: 8 }}>
            Як це працює: 1) виставте картку — її купить бот за 1–5 хвилин. 2) Бот платить частину ціни картки (зазвичай 60–80%). Ця частка змінюється щохвилини — дивіться блок «Скільки платять зараз». 3) Картки з 🔥 гарячого попиту купують найдорожче (до 90%). 4) За кожен новий ранг торговця — нагорода. Картки, куплені в акціях зі знижкою від 50%, на ринок не приймаються.
          </p>
        )}
      </div>

      {freshSale && (
        <div style={{ background: "linear-gradient(90deg,#14532d,#166534)", border: "1px solid #4ade80", borderRadius: 12, padding: "10px 12px", marginBottom: 12, animation: "popIn 0.5s ease", display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 24 }}>🤝</span>
          <div style={{ flex: 1, minWidth: 0, fontSize: 12, color: "#dcfce7" }}>
            <b>Угода!</b> {freshSale.buyer} купив «{freshSale.name}»
          </div>
          <b style={{ color: "#fbbf24", fontSize: 14, whiteSpace: "nowrap" }}>+{freshSale.price} 💵</b>
        </div>
      )}

      {/* ---- скільки платять зараз ---- */}
      <div style={{ background: "linear-gradient(160deg,#111827,#0b0f1a)", border: "1px solid #374151", borderRadius: 16, padding: 12 }}>
        <b style={{ fontSize: 13, color: "#67e8f9" }}>💱 Скільки платять зараз</b>
        <p style={{ margin: "4px 0 8px", fontSize: 11, color: "#9ca3af" }}>Бот купує картку за частину її ціни. Що довша смужка — то більше баксів ви отримаєте. Показник змінюється щохвилини.</p>
        {RARITY_ORDER.map((r, idx) => {
          const m = marketMult(r, now), pctNow = payPct(m), soon = payPct(marketMult(r, now + 120000));
          const level = m >= 1.05 ? "good" : m <= 0.95 ? "bad" : "mid";
          const col = level === "good" ? "#4ade80" : level === "bad" ? "#f87171" : "#fbbf24";
          const label = level === "good" ? "Вигідно" : level === "bad" ? "Невигідно" : "Нормально";
          const trend = soon > pctNow ? "↗" : soon < pctNow ? "↘" : "→";
          const fill = Math.max(4, Math.min(100, ((pctNow - 50) / 40) * 100));
          return (
            <div key={r} style={{ padding: "7px 0", borderTop: idx ? "1px solid #1f2937" : "none" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6 }}>
                <span style={{ fontSize: 12, fontWeight: 700 }}>{RARITY_EMOJI[r]} <RName r={r} /></span>
                <span style={{ fontSize: 10, fontWeight: 800, color: col, background: col + "22", padding: "2px 9px", borderRadius: 999 }}>{label} {trend}</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 5 }}>
                <div style={{ flex: 1, height: 8, background: "#0b0f1a", borderRadius: 99, overflow: "hidden" }}>
                  <div style={{ width: fill + "%", height: "100%", borderRadius: 99, background: r === "Ексклюзивна" ? "linear-gradient(90deg," + RAINBOW_STOPS + ")" : col, transition: "width 0.8s ease" }} />
                </div>
                <b style={{ fontSize: 12, color: "#e5e7eb", minWidth: 92, textAlign: "right" }}>платять ~{pctNow}%</b>
              </div>
            </div>
          );
        })}
        <p style={{ margin: "8px 0 0", fontSize: 11, color: "#9ca3af" }}>💡 Зараз найкраще продавати: {RARITY_EMOJI[bestR.r]} <b><RName r={bestR.r} /></b> — ~{payPct(bestR.m)}% ціни картки</p>
      </div>

      {/* ---- гарячий попит ---- */}
      <h3 style={{ ...sectionTitle, marginBottom: 2 }}>🔥 Гарячий попит <span style={{ fontWeight: 400, color: hotLeft < 120000 ? "#f87171" : "#9ca3af", fontSize: 11 }}>· ще {fmtMMSS(hotLeft)}</span></h3>
      <p style={{ margin: "0 0 8px", fontSize: 11, color: "#9ca3af" }}>Рідкості, які зараз у ціні — тут платять максимум.</p>
      <div style={{ display: "flex", gap: 10 }}>
        {hotIds.map((id) => {
          const card = cards.find((c) => c.id === id);
          if (!card) return null;
          const have = sellableCopies(wallet, id);
          const ex = card.rarity === "Ексклюзивна";
          return (
            <div key={id} style={{ flex: 1, minWidth: 0, display: "flex" }}>
              <RainbowWrap on={ex} radius={16} pad={2} block>
                <div style={{ borderRadius: 14, padding: 10, background: "linear-gradient(160deg,#431407,#1c1917)", border: ex ? "none" : "1px solid #f97316", boxShadow: "0 0 16px #f9731644", display: "flex", gap: 8, alignItems: "center" }}>
                  <CardFace card={card} small />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 11, fontWeight: 800, color: RARITY_COLOR[card.rarity], overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{card.name}</div>
                    <div style={{ fontSize: 10, margin: "1px 0" }}><RName r={card.rarity} /></div>
                    <div style={{ fontSize: 10, color: "#fdba74", margin: "2px 0" }}>платять до 90%!</div>
                    <div style={{ fontSize: 10, color: "#9ca3af", marginBottom: 4 }}>{have > 0 ? "Можна продати: " + have : "Немає"}</div>
                    {have > 0 && lots.length < slots && (
                      <button style={{ ...sx.smallBtn, fontSize: 10, padding: "4px 8px", background: "#c2410c", color: "#fff" }} onClick={() => setChosen(id)}>Продати</button>
                    )}
                    {have > 0 && lots.length >= slots && <span style={{ fontSize: 9, color: "#f87171" }}>Слоти зайняті</span>}
                  </div>
                </div>
              </RainbowWrap>
            </div>
          );
        })}
      </div>

      {/* ---- мої лоти ---- */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "20px 0 8px", gap: 6 }}>
        <h3 style={{ margin: 0, fontSize: 14, color: "#fbbf24" }}>🎯 Мої лоти <span style={{ color: "#9ca3af", fontWeight: 400 }}>{lots.length}/{slots}</span></h3>
        <button disabled={lots.length >= slots} onClick={buildQuickPlan} style={{ ...sx.smallBtn, fontSize: 10, background: lots.length >= slots ? "#1f2937" : "linear-gradient(90deg,#0891b2,#0e7490)", color: "#fff", opacity: lots.length >= slots ? 0.5 : 1 }}>⚡ Дублікати в слоти</button>
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        {[0, 1, 2, 3, 4].map((s) => {
          if (s >= visibleTiles) {
            return (
              <div key={"locked" + s} style={{ width: 96, minHeight: 156, borderRadius: 14, border: "1px dashed #374151", background: "repeating-linear-gradient(45deg,#0b0f1a,#0b0f1a 8px,#0f1420 8px,#0f1420 16px)", opacity: 0.7, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, textAlign: "center", padding: 6 }}>
                <span style={{ fontSize: 22 }}>🔒</span><span style={{ fontSize: 10, color: "#fbbf24" }}>Преміум-пас</span>
              </div>
            );
          }
          const lot = lots[s];
          if (!lot) {
            const full = lots.length >= slots;
            return (
              <div key={"empty" + s} onClick={() => { if (!full) { setPicking(true); setChosen(null); } }} style={{ width: 96, minHeight: 156, borderRadius: 14, border: "2px dashed #22c55e88", background: "radial-gradient(circle at 50% 40%,#052e1655,#0f1420)", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4 }}>
                <span style={{ fontSize: 28, color: "#22c55e", animation: "mktPulse 2s ease-in-out infinite" }}>＋</span><span style={{ fontSize: 10, color: "#9ca3af" }}>Вільний слот</span>
              </div>
            );
          }
          const card = cards.find((c) => c.id === lot.cardId);
          if (!card) return null;
          const total = Math.max(1, lot.sellAt - lot.listedAt);
          const pct = Math.min(100, Math.max(0, ((now - lot.listedAt) / total) * 100));
          const left = lot.sellAt - now;
          const hot = hotCardIds(lot.sellAt, cards).includes(card.id);
          const ex = card.rarity === "Ексклюзивна";
          return (
            <RainbowWrap key={lot.id} on={ex} radius={16} pad={2}>
              <div style={{ width: 96, borderRadius: 14, padding: "8px 6px", background: "linear-gradient(160deg,#1a2035,#0f1420)", border: ex ? "none" : "1px solid " + RARITY_COLOR[card.rarity] + "88", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, boxShadow: "0 3px 12px " + RARITY_COLOR[card.rarity] + "33", position: "relative" }}>
                {hot && <span style={{ position: "absolute", top: -6, right: -4, fontSize: 14, zIndex: 2 }}>🔥</span>}
                <CardFace card={card} small />
                <div style={{ fontSize: 10, color: "#e5e7eb", maxWidth: "100%", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{card.name}</div>
                <div style={{ fontSize: 11, fontWeight: 800, color: "#fbbf24" }}>≈ {lotPrice(card, lot, cards)} 💵</div>
                <div style={{ width: "100%", height: 6, background: "#0b0f1a", borderRadius: 99, overflow: "hidden" }}>
                  <div style={{ width: pct + "%", height: "100%", borderRadius: 99, background: "linear-gradient(90deg," + RARITY_COLOR[card.rarity] + ",#ffffffaa," + RARITY_COLOR[card.rarity] + ")", backgroundSize: "200% 100%", animation: "flowX 2s linear infinite", transition: "width 1s linear" }} />
                </div>
                <div style={{ fontSize: 10, color: left > 0 ? "#9ca3af" : "#4ade80" }}>{left > 0 ? "⏳ " + fmtMMSS(left) : "🤝 угода…"}</div>
                <button style={{ ...sx.smallBtn, fontSize: 9, padding: "3px 6px" }} onClick={() => doCancel(lot.id)}>✕ Скасувати</button>
              </div>
            </RainbowWrap>
          );
        })}
      </div>

      {picking && <div ref={pickerRef} style={{ scrollMarginTop: 70 }}><MarketPicker wallet={wallet} cards={cards} chosen={chosen} hotIds={hotIds} onPick={(id) => setChosen(id)} onClose={() => { setPicking(false); setChosen(null); }} /></div>}
      {chosen && cards.find((c) => c.id === chosen) && (
        <ListConfirmModal key={chosen} card={cards.find((c) => c.id === chosen)} wallet={wallet} hot={hotIds.includes(chosen)} now={now} maxQty={Math.max(1, Math.min(sellableCopies(wallet, chosen), slots - lots.length))} onCancel={() => setChosen(null)} onConfirm={(q) => doList(chosen, q)} />
      )}

      {quickPlan && (
        <div style={sx.modalOverlay} onClick={() => setQuickPlan(null)}>
          <div style={{ ...sx.modal, textAlign: "center" }} onClick={(e) => e.stopPropagation()}>
            <h3 style={{ margin: "0 0 4px", color: "#67e8f9" }}>⚡ Швидкий продаж дублікатів</h3>
            <p style={{ margin: "0 0 10px", fontSize: 11, color: "#9ca3af" }}>Виставляємо лише зайві копії: по одній копії кожної картки залишиться в колекції.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 240, overflowY: "auto", marginBottom: 12 }}>
              {quickPlan.map((st) => {
                const c = cards.find((x) => x.id === st.id);
                if (!c) return null;
                const [lo, hi] = lotEstimate(c, now, hotIds.includes(c.id));
                return (
                  <div key={st.id} style={{ display: "flex", alignItems: "center", gap: 8, background: "#111827", borderRadius: 10, padding: "6px 10px", textAlign: "left" }}>
                    <span style={{ flex: 1, minWidth: 0, fontSize: 12, color: RARITY_COLOR[c.rarity], overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{hotIds.includes(c.id) ? "🔥 " : ""}{RARITY_EMOJI[c.rarity]} {c.name}</span>
                    <b style={{ color: "#e5e7eb", fontSize: 12 }}>×{st.n}</b>
                    <span style={{ fontSize: 10, color: "#fbbf24", whiteSpace: "nowrap" }}>≈ {Math.round((lo + hi) / 2) * st.n} 💵</span>
                  </div>
                );
              })}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ ...sx.smallBtn, flex: 1, padding: "10px 0", fontSize: 12 }} onClick={() => setQuickPlan(null)}>Скасувати</button>
              <button style={{ ...sx.primaryBtn, flex: 2 }} onClick={runQuickPlan}>⚡ Виставити</button>
            </div>
          </div>
        </div>
      )}

      {/* ---- стрічка ---- */}
      <h3 style={sectionTitle}>🔔 Останні угоди</h3>
      <div style={{ background: "#0b0f1a", border: "1px solid #1f2937", borderRadius: 12, padding: 6 }}>
        {feedShown.length === 0 && <p style={{ fontSize: 11, color: "#6b7280", textAlign: "center", margin: 8 }}>Поки що тихо…</p>}
        {feedShown.map((e, i) => (
          <div key={e.ts + "_" + i} style={{ display: "flex", justifyContent: "space-between", gap: 8, alignItems: "center", fontSize: 11, padding: "5px 6px", borderRadius: 8, background: e.mine ? "#052e1666" : "transparent", color: e.mine ? "#bbf7d0" : "#9ca3af", animation: i === 0 ? "fadeSlideUp 0.4s ease" : "none" }}>
            <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.mine ? "🟢" : "👤"} {e.text}</span>
            <span className={e.rarity === "Ексклюзивна" ? "rb-text" : undefined} style={{ whiteSpace: "nowrap", color: RARITY_COLOR[e.rarity] || "#fbbf24", fontWeight: 700 }}>{e.price} 💵</span>
          </div>
        ))}
      </div>

      {/* ---- лоти гравців ---- */}
      <h3 style={{ ...sectionTitle, marginBottom: 2 }}>🛒 Лоти гравців <span style={{ fontWeight: 400, color: "#9ca3af", fontSize: 11 }}>· {visibleLots.length} із {allLots.length}</span></h3>
      <p style={{ margin: "0 0 8px", fontSize: 10, color: "#6b7280" }}>Куплений лот зникає, а на його місці за ~30–70 с з'являється новий{restocking > 0 ? " · поповнюється: " + restocking : ""}.</p>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 6 }}>
        <MarketChip col="#e5e7eb" active={!lotRarity} onClick={() => { setLotRarity(null); setLotShown(9); }}>Усі {allLots.length}</MarketChip>
        {RARITY_ORDER.map((r) => (
          <MarketChip key={r} r={r} active={lotRarity === r} dim={!lotCounts[r]} onClick={() => { setLotRarity(lotRarity === r ? null : r); setLotShown(9); }}>{RARITY_EMOJI[r]} {lotCounts[r] || 0}</MarketChip>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
        <span onClick={() => { setLotOnly(lotOnly === "wish" ? null : "wish"); setLotShown(9); }} style={softChip(lotOnly === "wish", "#fbbf24")}>⭐ Бажані {wishCount}</span>
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 10, alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontSize: 12, color: "#9ca3af" }}>Сортувати:</span>
        <SortDropdown value={lotSort} onChange={setLotSort} options={[
          { value: "rarity", label: "За рідкістю" },
          { value: "priceAsc", label: "Ціна: спочатку дешеві" },
          { value: "priceDesc", label: "Ціна: спочатку дорогі" },
          { value: "ending", label: "Скоро зникнуть" },
          { value: "deal", label: "Найвигідніші" },
        ]} />
      </div>
      {visibleLots.length === 0 && <p style={{ fontSize: 12, color: "#6b7280", textAlign: "center", margin: "12px 0" }}>{lotOnly === "wish" ? "Позначте картки зірочкою ⭐ на лотах — і вони з'являться тут." : "Зараз немає лотів за цим фільтром — асортимент оновлюється щохвилини."}</p>}
      <div style={sx.shopGrid}>
        {visibleLots.slice(0, lotShown).map(({ wnd, lot }) => {
          const left = wnd.end - now;
          const lifePct = Math.max(0, Math.min(100, (left / (wnd.end - wnd.start)) * 100));
          const diff = Math.round((lot.factor - 1) * 100);
          const urgent = left < 60000;
          const ex = lot.card.rarity === "Ексклюзивна";
          const isNew = isNewCard(lot.card.id), wished = wish.includes(lot.card.id);
          return (
            <RainbowWrap key={lot.key} on={ex} radius={14} pad={2} block>
              <div style={{ ...sx.shopCard, position: "relative", border: ex ? "none" : "1px solid " + RARITY_COLOR[lot.card.rarity] + (urgent ? "" : "66"), boxShadow: urgent ? "0 0 14px #f8717188" : "0 3px 12px " + RARITY_COLOR[lot.card.rarity] + "22", animation: urgent ? "mktPulseBox 1s ease-in-out infinite" : "none" }}>
                <CardFace card={lot.card} />
                <span onClick={() => toggleWish(lot.card.id)} style={{ position: "absolute", top: 4, right: 4, fontSize: 15, cursor: "pointer", zIndex: 3, filter: wished ? "none" : "grayscale(1) opacity(0.55)" }}>⭐</span>
                {isNew && <span style={{ position: "absolute", top: 26, right: 4, background: "#16a34a", color: "#fff", fontSize: 8, fontWeight: 800, padding: "1px 5px", borderRadius: 5, zIndex: 3 }}>НОВА</span>}
                <div style={{ marginTop: 4, fontSize: 9, color: "#6b7280", maxWidth: "100%", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>👤 {lot.seller}</div>
                <div style={{ fontSize: 12, color: "#fbbf24", fontWeight: 800 }}>{fmtBucks(lot.price)}</div>
                <div style={{ fontSize: 9, color: diff < 0 ? "#4ade80" : "#9ca3af" }}>{diff === 0 ? "як у каталозі" : "на " + Math.abs(diff) + "% " + (diff < 0 ? "дешевше" : "дорожче") + " за каталог"}</div>
                <div style={{ width: "100%", height: 3, background: "#0b0f1a", borderRadius: 99, overflow: "hidden", margin: "3px 0" }}>
                  <div style={{ width: lifePct + "%", height: "100%", background: urgent ? "#f87171" : "#22d3ee", transition: "width 1s linear" }} />
                </div>
                <div style={{ fontSize: 10, color: urgent ? "#f87171" : "#9ca3af", fontWeight: urgent ? 800 : 400 }}>{urgent ? "⚡ Останній шанс " : "⏱ "}{fmtMMSS(left)}</div>
                <button onClick={() => buyBot(lot, wnd.end)} style={{ ...sx.smallBtn, width: "100%", marginTop: 4, background: "linear-gradient(90deg,#16a34a,#15803d)" }}>Купити</button>
              </div>
            </RainbowWrap>
          );
        })}
      </div>
      {visibleLots.length > lotShown && (
        <button onClick={() => setLotShown(lotShown + 9)} style={{ ...sx.smallBtn, width: "100%", marginTop: 10, padding: "10px 0", fontSize: 12 }}>Показати ще ({visibleLots.length - lotShown})</button>
      )}
    </>
  );
}

/* ============================== TRADING ============================== */
function CollectionTab({ wallet, saveWallet, showToast, allCards, abuseEvent }) {
  const [sortBy, setSortBy] = useState("date");
  const [detail, setDetail] = useState(null);
  const [sellDupConfirm, setSellDupConfirm] = useState(null);
  const [rarityFilter, setRarityFilter] = useState(null);
  const cards = allCards();
  function calcDuplicates() {
    let totalCopies = 0, totalBucks = 0;
    cards.forEach((c) => {
      if (c.tempEvent) return;
      const count = wallet.collection[c.id] || 0;
      if (count > 1) {
        const dup = count - 1;
        totalCopies += dup;
        const tmp = { cheapCopies: { ...(wallet.cheapCopies || {}) }, cheapCost: { ...(wallet.cheapCost || {}) } };
        totalBucks += salePayout(tmp, c.id, dup, Math.round(c.price * 0.4 * bucksMult(abuseEvent, wallet)), count);
      }
    });
    return { totalCopies, totalBucks };
  }
  async function confirmSellDuplicates() {
    const w = JSON.parse(JSON.stringify(wallet));
    let gained = 0;
    cards.forEach((c) => {
      if (c.tempEvent) return;
      const count = w.collection[c.id] || 0;
      if (count > 1) {
        const dup = count - 1;
        gained += salePayout(w, c.id, dup, Math.round(c.price * 0.4 * bucksMult(abuseEvent, wallet)), count);
        w.collection[c.id] = 1;
      }
    });
    if (!w.bucksInfinite) w.bucks += gained;
    await saveWallet(w);
    setSellDupConfirm(null);
    showToast(`Продано дублікатів на ${gained} 💵`, "ok");
  }
  async function sellInstant(id) {
    const card = cards.find((c) => c.id === id);
    if (!card) { showToast("Цю картку більше не існує в грі", "err"); return; }
    if (card.tempEvent) { showToast("Тимчасові/подієві картки не можна продати", "err"); return; }
    const per = Math.round(card.price * 0.4 * bucksMult(abuseEvent, wallet));
    const w = JSON.parse(JSON.stringify(wallet));
    if ((w.collection[id] || 0) < 1) return;
    const price = salePayout(w, id, 1, per, w.collection[id] || 0);
    w.collection[id] -= 1; if (!w.bucksInfinite) w.bucks += price;
    await saveWallet(w);
    setDetail(null);
    showToast(`Продано миттєво за ${price} 💵`, "ok");
  }
  async function toggleFavorite(id) {
    const w = JSON.parse(JSON.stringify(wallet));
    const fav = w.favoriteCards || [];
    w.favoriteCards = fav.includes(id) ? fav.filter((x) => x !== id) : [...fav, id];
    await saveWallet(w);
  }
  const rarityRank = { "Ексклюзивна": 0, "Легендарна": 1, "Міфічна": 2, "Епічна": 3, "Рідкісна": 4 };
  const visibleCards = cards.filter(c => !c.tempEvent || (wallet.collection[c.id] || 0) > 0);
  const ownedAll = visibleCards.filter(c => (wallet.collection[c.id] || 0) > 0);
  const unownedAll = visibleCards.filter(c => !(wallet.collection[c.id] || 0) > 0);

  const rarityStats = RARITY_ORDER.map((r) => ({
    rarity: r,
    owned: ownedAll.filter((c) => c.rarity === r).length,
    total: visibleCards.filter((c) => c.rarity === r).length,
  }));
  const closest = [...rarityStats].filter((s) => s.total - s.owned > 0).sort((a, b) => (a.total - a.owned) - (b.total - b.owned))[0];
  const closestMissing = closest ? unownedAll.filter((c) => c.rarity === closest.rarity).slice(0, 3) : null;

  const filteredVisible = rarityFilter ? visibleCards.filter((c) => c.rarity === rarityFilter) : visibleCards;
  const owned = filteredVisible.filter(c => (wallet.collection[c.id] || 0) > 0);
  const unowned = filteredVisible.filter(c => !(wallet.collection[c.id] || 0) > 0);

  function sortFn(a, b) {
    if (sortBy === "rarity") return rarityRank[a.rarity] - rarityRank[b.rarity];
    if (sortBy === "name") return a.name.localeCompare(b.name, "uk");
    if (sortBy === "priceDesc") return b.price - a.price;
    if (sortBy === "priceAsc") return a.price - b.price;
    if (sortBy === "count") return (wallet.collection[b.id] || 0) - (wallet.collection[a.id] || 0);
    return (wallet.obtainedAt[b.id] || 0) - (wallet.obtainedAt[a.id] || 0);
  }
  const favSet = new Set(wallet.favoriteCards || []);
  const favOwned = owned.filter((c) => favSet.has(c.id)).sort(sortFn);
  const restOwned = owned.filter((c) => !favSet.has(c.id)).sort(sortFn);
  const ordered = [...favOwned, ...restOwned, ...unowned];
  const SORT_OPTIONS = [
    { value: "date", label: "Спочатку нові" },
    { value: "rarity", label: "За рідкістю" },
    { value: "name", label: "За назвою (А-Я)" },
    { value: "priceDesc", label: "Ціна: спочатку дорогі" },
    { value: "priceAsc", label: "Ціна: спочатку дешеві" },
    { value: "count", label: "За кількістю копій" },
  ];

  return (
    <div style={sx.tabWrap}>
      <h2 style={sx.h2}>Колекція</h2>

      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
        {rarityStats.map((s) => {
          const isExclusive = s.rarity === "Ексклюзивна";
          const active = rarityFilter === s.rarity;
          const inner = (
            <span onClick={() => setRarityFilter(active ? null : s.rarity)} style={{
              display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, cursor: "pointer",
              color: active ? "#1a1400" : RARITY_COLOR[s.rarity],
              background: active ? RARITY_COLOR[s.rarity] : "#111827",
              border: isExclusive ? "none" : `1px solid ${RARITY_COLOR[s.rarity]}`, borderRadius: 999, padding: "4px 9px", fontWeight: 700,
            }}>{RARITY_EMOJI[s.rarity]} {s.owned}/{s.total}</span>
          );
          return isExclusive ? (
            <span key={s.rarity} className="rainbow-ring" style={{ borderRadius: 999, padding: 1.5, display: "inline-flex" }}>{inner}</span>
          ) : <React.Fragment key={s.rarity}>{inner}</React.Fragment>;
        })}
      </div>

      {closestMissing && closestMissing.length > 0 && (
        <div style={{ background: "#111827", border: "1px solid #374151", borderRadius: 10, padding: 8, marginBottom: 12, textAlign: "center" }}>
          <p style={{ margin: "0 0 6px", fontSize: 11, color: "#9ca3af" }}>
            🎯 Найближче до завершення: <b><RName r={closest.rarity} /></b> — лишилось {closest.total - closest.owned}
          </p>
          <div style={{ display: "flex", gap: 6, justifyContent: "center" }}>
            {closestMissing.map((c) => <CardFace key={c.id} card={c} hidden small />)}
          </div>
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, gap: 6, flexWrap: "wrap" }}>
        <p style={{ color: "#9ca3af", fontSize: 12, margin: 0 }}>
          Зібрано {ownedAll.length} / {visibleCards.length}{rarityFilter ? ` · показано ${owned.length + unowned.length}` : ""}
        </p>
        <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
          <button onClick={() => setSellDupConfirm(calcDuplicates())} style={{ ...sx.smallBtn, fontSize: 10, padding: "6px 8px" }}>🗑 Продати дублікати</button>
          <SortDropdown value={sortBy} onChange={setSortBy} options={SORT_OPTIONS} />
        </div>
      </div>

      {sellDupConfirm && (
        <div style={sx.modalOverlay} onClick={() => setSellDupConfirm(null)}>
          <div style={sx.modal} onClick={(e) => e.stopPropagation()}>
            <h3 style={{ marginTop: 0, color: "#fbbf24" }}>Продати дублікати?</h3>
            {sellDupConfirm.totalCopies > 0 ? (
              <p style={{ fontSize: 13, color: "#e5e7eb" }}>Продати <b>{sellDupConfirm.totalCopies}</b> карток (по одній копії з кожної залишиться) і отримати <b>{sellDupConfirm.totalBucks} 💵</b>?</p>
            ) : (
              <p style={{ fontSize: 13, color: "#9ca3af" }}>У вас немає дублікатів на продаж.</p>
            )}
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ ...sx.smallBtn, flex: 1 }} onClick={() => setSellDupConfirm(null)}>Скасувати</button>
              {sellDupConfirm.totalCopies > 0 && <button style={{ ...sx.primaryBtn, flex: 1 }} onClick={confirmSellDuplicates}>Продати за {sellDupConfirm.totalBucks} 💵</button>}
            </div>
          </div>
        </div>
      )}
      <div style={sx.collectionGrid}>
        {ordered.map((c) => {
          const count = wallet.collection[c.id] || 0;
          const isNew = count > 0 && (Date.now() - (wallet.obtainedAt[c.id] || 0)) < 86400000;
          const isFav = favSet.has(c.id);
          return (
            <div key={c.id} style={{ ...sx.collectionCard, position: "relative" }}>
              {isFav && <span style={{ position: "absolute", top: -3, left: -3, fontSize: 12, zIndex: 2 }}>⭐</span>}
              {isNew && <span style={{ position: "absolute", top: -3, right: -3, background: "#dc2626", color: "#fff", fontSize: 8, fontWeight: 800, padding: "1px 4px", borderRadius: 4, zIndex: 2 }}>NEW</span>}
              <CardFace card={c} count={count > 0 ? count : undefined} hidden={count === 0} small onClick={() => count > 0 && setDetail(c)} />
            </div>
          );
        })}
      </div>
      {detail && (
        <div style={sx.modalOverlay} onClick={() => setDetail(null)}>
          <div style={sx.modal} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", gap: 12 }}>
              <CardFace card={detail} />
              <div>
                <h3 style={{ margin: "0 0 4px", color: "#fbbf24" }}>{detail.name}</h3>
                <p style={{ margin: 2, fontSize: 12 }}><RName r={detail.rarity} /></p>
                <p style={{ margin: 2, fontSize: 12, color: "#9ca3af" }}>Отримано: {new Date(wallet.obtainedAt[detail.id]).toLocaleString("uk-UA")}</p>
                <p style={{ margin: 2, fontSize: 12, color: "#9ca3af" }}>Зараз маєте: {wallet.collection[detail.id] || 0}</p>
                <p style={{ margin: 2, fontSize: 12, color: "#9ca3af" }}>Рекорд одночасно: {wallet.maxCount[detail.id] || 0}</p>
                <p style={{ margin: 2, fontSize: 12, color: "#9ca3af" }}>Базова ціна: {fmtBucks(detail.price)}</p>
                {originDisplayLabel(wallet.cardOrigin[detail.id]) && (
                  <p style={{ margin: "6px 2px 2px", fontSize: 11, color: "#67e8f9" }}>📍 {(detail.id === "custom_6411" || detail.id === "custom_6412") ? "Admin Abuse" : originDisplayLabel(wallet.cardOrigin[detail.id])}</p>
                )}
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <button style={{ ...sx.smallBtn, flex: 1 }} onClick={() => toggleFavorite(detail.id)}>{favSet.has(detail.id) ? "⭐ Прибрати з улюблених" : "☆ В улюблені"}</button>
              {!detail.tempEvent && (wallet.collection[detail.id] || 0) > 0 && (
                <button style={{ ...sx.smallBtn, flex: 1, background: "#7f1d1d" }} onClick={() => sellInstant(detail.id)}>Продати ({Math.round(detail.price * 0.4 * bucksMult(abuseEvent, wallet))})</button>
              )}
            </div>
            <button style={{ ...sx.smallBtn, marginTop: 10, width: "100%" }} onClick={() => setDetail(null)}>Закрити</button>
          </div>
        </div>
      )}
    </div>
  );
}

const GOLD_CASINO_WEIGHT = { "Епічна": 3, "Міфічна": 8, "Легендарна": 15, "Ексклюзивна": 10 };
const GOLD_SPIN_PRICE = 500;
function GoldCasino({ wallet, saveWallet, allCards, showToast }) {
  const [spinning, setSpinning] = useState(false);
  const [flickerCard, setFlickerCard] = useState(null);
  const [won, setWon] = useState(null);
  async function spin() {
    if (spinning) return;
    if (!wallet.bucksInfinite && wallet.bucks < GOLD_SPIN_PRICE) { showToast("Недостатньо баксів", "err"); return; }
    setSpinning(true); setWon(null);
    const w = JSON.parse(JSON.stringify(wallet));
    if (!w.bucksInfinite) w.bucks -= GOLD_SPIN_PRICE;
    const flickerPool = allCards().filter((c) => !c.tempEvent);
    let ticks = 0;
    const flick = setInterval(() => { setFlickerCard(flickerPool[Math.floor(Math.random() * flickerPool.length)]); ticks++; if (ticks > 14) clearInterval(flick); }, 90);
    setTimeout(async () => {
      clearInterval(flick);
      const rarity = weightedPick(Math.random, GOLD_CASINO_WEIGHT);
      const pool = allCards().filter((c) => c.rarity === rarity && !c.tempEvent);
      const card = pool[Math.floor(Math.random() * pool.length)];
      if (card) {
        w.collection[card.id] = (w.collection[card.id] || 0) + 1;
        if (!w.obtainedAt[card.id]) w.obtainedAt[card.id] = Date.now();
        w.maxCount[card.id] = Math.max(w.maxCount[card.id] || 0, w.collection[card.id]);
        w.cardOrigin = w.cardOrigin || {}; w.cardOrigin[card.id] = "Party 🎉";
      }
      await saveWallet(w);
      setFlickerCard(card || null);
      setWon(card || { name: "Немає карток цієї рідкісності", rarity });
      setSpinning(false);
    }, 1300);
  }
  return (
    <div style={{
      marginTop: 12, padding: 16, borderRadius: 16, textAlign: "center", position: "relative", overflow: "hidden",
      background: "linear-gradient(150deg,#451a03,#78350f 50%,#1a1400)", border: "2px solid #fbbf24", boxShadow: "0 0 22px #fbbf2455",
    }}>
      <span style={{ position: "absolute", top: -10, left: -6, fontSize: 60, opacity: 0.12, transform: "rotate(-10deg)" }}>👑</span>
      <p style={{ margin: "0 0 4px", fontWeight: 900, fontSize: 16, color: "#fde68a" }}>👑 Золота рулетка</p>
      <div style={{ display: "flex", justifyContent: "center", margin: "10px 0", minHeight: 140 }}>
        {flickerCard ? (
          <div style={{ filter: spinning ? "blur(1.5px)" : "none", transition: "filter 0.15s" }}>
            <CardFace card={flickerCard} />
          </div>
        ) : (
          <div style={{
            width: 120, aspectRatio: "3/4", borderRadius: 10, background: "linear-gradient(160deg,#78350f,#1a1400)",
            border: "2px dashed #fbbf24", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 36,
          }}>🎰</div>
        )}
      </div>
      {won && (
        <p style={{ margin: "0 0 8px", fontSize: 12, color: "#4ade80", fontWeight: 700 }}>
          {won.id ? `🎉 ${won.name}!` : `Немає карток рідкості "${won.rarity}" — спробуйте ще`}
        </p>
      )}
      <button disabled={spinning} style={{
        ...sx.primaryBtn, background: "linear-gradient(90deg,#fbbf24,#f59e0b)", color: "#1a1400", fontWeight: 900,
        opacity: spinning ? 0.6 : 1,
      }} onClick={spin}>{spinning ? "Крутиться…" : `Крутити за ${GOLD_SPIN_PRICE} 💵`}</button>
    </div>
  );
}

// друзі гравця (спільно для Профілю та вкладки Дуелі)
function useFriendsData(wallet, nick, allCards, intervalMs) {
  const [friendsData, setFriendsData] = useState([]);
  const [incomingRequests, setIncomingRequests] = useState([]);
  const [friendsBusy, setFriendsBusy] = useState(false);
  const loadFriends = useCallback(async () => {
    setFriendsBusy(true);
    const list = [];
    await Promise.all((wallet.friends || []).map(async (f) => {
      const [u, fw] = await Promise.all([getUser(f), sGet("wallet_" + f, true)]);
      if (!u) return;
      const cardCount = fw ? Object.values(fw.collection || {}).filter((c) => c > 0).length : 0;
      const duelWins = (fw && fw.duelStats && fw.duelStats.wins) || 0;
      const duelLosses = (fw && fw.duelStats && fw.duelStats.losses) || 0;
      let favCardId = fw && fw.favoriteCards && fw.favoriteCards[0];
      if (!favCardId && fw) {
        const owned = Object.keys(fw.collection || {}).filter((id) => fw.collection[id] > 0);
        const rarityRank = { "Ексклюзивна": 0, "Легендарна": 1, "Міфічна": 2, "Епічна": 3, "Рідкісна": 4 };
        const ac = allCards();
        const ownedCards = owned.map((id) => ac.find((c) => c.id === id)).filter(Boolean);
        ownedCards.sort((a, b) => (rarityRank[a.rarity] ?? 9) - (rarityRank[b.rarity] ?? 9));
        favCardId = ownedCards[0] && ownedCards[0].id;
      }
      list.push({ nick: u.nick, avatar: u.avatar, verified: u.verified, lastSeen: u.lastSeen, createdAt: u.createdAt, cardCount, nickColor: u.nickColor, duelWins, duelLosses, favCardId, lotSold: (fw && fw.lotStats && fw.lotStats.sold) || 0 });
    }));
    setFriendsData(list);
    setIncomingRequests((await sGet("friend_requests_" + nick, true)) || []);
    setFriendsBusy(false);
  }, [wallet.friends, nick]);
  useEffect(() => { loadFriends(); const t = setInterval(loadFriends, intervalMs || 3000); return () => clearInterval(t); }, [loadFriends, intervalMs]);
  return { friendsData, incomingRequests, setIncomingRequests, friendsBusy, loadFriends };
}

          width: 90, height: 90, borderRadius: "50%", margin: "0 auto 8px", padding: wallet.passPremium ? 3 : 0,
          boxShadow: wallet.passPremium ? "0 0 20px #a855f777" : "none",
        }}>
          <div style={{
            width: "100%", height: "100%", borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 42, background: "#0b0f1a", border: wallet.passPremium ? "none" : "3px solid #374151",
            boxShadow: wallet.passPremium ? "none" : "0 0 10px #0008",
          }}>{profile.avatar}</div>
        </div>
        <div style={{ fontWeight: 800, fontSize: 19, display: "flex", justifyContent: "center", alignItems: "center", gap: 3 }}>
          <ColoredNick nick={profile.nick} color={profile.nickColor} /><VerBadge v={profile.verified} />
        </div>
        {wallet.passPremium && (
          <span style={{ display: "inline-block", marginTop: 4, fontSize: 9, fontWeight: 800, color: "#1a1400", background: "linear-gradient(90deg,#fbbf24,#f59e0b)", padding: "2px 8px", borderRadius: 999 }}>👑 SOCCER PASS</span>
        )}
        <p style={{ margin: "6px 0 0", color: "#6b7280", fontSize: 11, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
          Акаунт з {new Date(profile.createdAt).toLocaleDateString("uk-UA")}
          <span onClick={() => setShowPassChange(true)} title="Змінити пароль" style={{ cursor: "pointer", fontSize: 10, background: "#1f2937", borderRadius: 6, padding: "1px 6px", color: "#9ca3af" }}>🔒</span>
        </p>
      </div>

      <div onClick={() => setShowStreak(true)} style={{
        cursor: "pointer", textAlign: "center", position: "relative", overflow: "hidden",
        background: "linear-gradient(135deg,#7c2d12,#431407)", border: "1px solid #f97316",
        borderRadius: 12, padding: "12px 10px", marginBottom: 14, boxShadow: "0 0 14px #f9731633",
      }}>
        <span style={{ position: "absolute", top: -8, right: -6, fontSize: 46, opacity: 0.14 }}>🔥</span>
        <p style={{ margin: 0, color: "#fed7aa", fontWeight: 900, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>🔥 Серія входів: {wallet.streak} дн.</p>
        <p style={{ margin: "3px 0 0", fontSize: 10, color: "#fdba74" }}>натисніть, щоб побачити нагороди</p>
      </div>

      <div style={{ background: "#111827", border: "1px solid #374151", borderRadius: 14, padding: 12, marginBottom: 14 }}>
        <p style={{ fontSize: 12, color: "#e5e7eb", fontWeight: 800, margin: "0 0 10px", display: "flex", alignItems: "center", gap: 5 }}>🎨 Персоналізація</p>
        <p style={{ fontSize: 11, color: "#9ca3af", margin: "0 0 6px" }}>Обрати аватар:</p>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
          {AVATAR_OPTIONS.map((a) => (<button key={a} onClick={() => saveProfile({ ...profile, avatar: a })} style={{ ...sx.avatarBtn, ...(profile.avatar === a ? sx.avatarBtnActive : {}) }}>{a}</button>))}
          {wallet.passSeasonAvatarUnlocked && (() => { const szn = (passSeason && passSeason.avatarEmoji) || "🎓"; return (
            <button key={"szn"+szn} onClick={() => saveProfile({ ...profile, avatar: szn })} title="Сезонна аватарка SOCCER PASS" style={{ ...sx.avatarBtn, ...(profile.avatar === szn ? sx.avatarBtnActive : {}), border: "2px solid #fbbf24", boxShadow: "0 0 8px #fbbf2477" }}>{szn}</button>
          ); })()}
          {isSuperAdmin(nick) && (<button key={DEV_AVATAR} title="Лише для розробника" onClick={() => saveProfile({ ...profile, avatar: DEV_AVATAR })} style={{ ...sx.avatarBtn, ...(profile.avatar === DEV_AVATAR ? sx.avatarBtnActive : {}), border: "1px solid #fbbf24" }}>{DEV_AVATAR}</button>)}
        </div>
        <p style={{ fontSize: 11, color: "#9ca3af", margin: "0 0 6px" }}>Колір ніку:</p>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 6 }}>
          {PASS_NICK_COLORS_FREE.map((c) => (
            <button key={c} onClick={() => setNickColor(c)} style={{ width: 28, height: 28, borderRadius: "50%", background: c, border: profile.nickColor === c ? "2px solid #fbbf24" : "1px solid #374151", cursor: "pointer" }} />
          ))}
        </div>
        {wallet.passPremium ? (
          <>
            <p style={{ fontSize: 11, color: "#a78bfa", margin: "6px 0 4px" }}>🎫 Ексклюзивні (SOCCER PASS):</p>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {PASS_NICK_COLORS_PREMIUM.map((c) => (
                <button key={c} onClick={() => setNickColor(c)} style={{ width: 28, height: 28, borderRadius: "50%", background: c, border: profile.nickColor === c ? "2px solid #fbbf24" : "1px solid #374151", cursor: "pointer" }} />
              ))}
            </div>
          </>
        ) : (
          <p style={{ fontSize: 10, color: "#6b7280", margin: "4px 0 0" }}>Градієнтні кольори доступні з SOCCER PASS 🎫</p>
        )}
      </div>

      <div style={{ background: "#111827", border: "1px solid #374151", borderRadius: 14, padding: 12, marginBottom: 14 }}>
        <p style={{ fontSize: 12, color: "#e5e7eb", fontWeight: 800, margin: "0 0 10px", display: "flex", alignItems: "center", gap: 5 }}>
          👥 Друзі ({friendsData.length})
          <span onClick={loadFriends} style={{ cursor: "pointer", color: "#60a5fa", fontWeight: 400, marginLeft: "auto", fontSize: 11 }}>
            {friendsBusy ? <span style={{ display: "inline-block", animation: "spin 0.8s linear infinite" }}>⟳</span> : "⟳"} оновити
          </span>
        </p>
        <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
          <input placeholder="Нік друга" value={friendInput} onChange={(e) => setFriendInput(e.target.value)} style={{ ...sx.input, marginBottom: 0 }} />
          <button style={sx.smallBtn} onClick={sendFriendRequest}>Додати</button>
        </div>
        {incomingRequests.length > 0 && (
          <div style={{ marginBottom: 10 }}>
            <p style={{ fontSize: 11, color: "#fbbf24" }}>Нові заявки в друзі:</p>
            {incomingRequests.map((r) => (
              <div key={r.from} style={{ display: "flex", alignItems: "center", gap: 6, background: "#1f2937", borderRadius: 8, padding: 8, marginBottom: 6 }}>
                <span style={{ flex: 1, fontSize: 12 }}>{r.from}</span>
                <button style={{ ...sx.smallBtn, background: "#16a34a" }} onClick={() => respondRequest(r.from, true)}>Прийняти</button>
                <button style={{ ...sx.smallBtn, background: "#7f1d1d" }} onClick={() => respondRequest(r.from, false)}>Відхилити</button>
              </div>
            ))}
          </div>
        )}
        {friendsData.length === 0 && incomingRequests.length === 0 && (
          <p style={{ fontSize: 11, color: "#6b7280", fontStyle: "italic", margin: 0 }}>Ще немає друзів — додайте когось за ніком вище</p>
        )}
        {friendsData.map((f) => (
          <div key={f.nick} style={{ display: "flex", alignItems: "center", gap: 8, background: "#1f2937", borderRadius: 8, padding: 8, marginBottom: 6 }}>
            <span onClick={() => setViewFriend(f)} style={{ fontSize: 20, cursor: "pointer" }}>{f.avatar}</span>
            <div style={{ flex: 1, cursor: "pointer" }} onClick={() => setViewFriend(f)}>
              <div style={{ fontSize: 12, display: "flex", alignItems: "center" }}><ColoredNick nick={f.nick} color={f.nickColor} /><VerBadge v={f.verified} /></div>
              <div style={{ fontSize: 10, color: "#6b7280" }}>{Date.now() - f.lastSeen < 120000 ? "🟢 в мережі" : "востаннє " + timeAgo(f.lastSeen)}</div>
            </div>
            <button onClick={() => setGiftTarget(f)} style={{ ...sx.smallBtn, background: "#7c3aed", fontSize: 10 }}>🎁</button>
            <button onClick={() => removeFriend(f.nick)} style={{ ...sx.smallBtn, background: "#7f1d1d", fontSize: 10 }}>✕</button>
          </div>
        ))}
      </div>

      <div style={{ display: "flex", gap: 8 }}>
        <button style={{ ...sx.smallBtn, flex: 1 }} onClick={onLogout}>🚪 Вийти</button>
      </div>
      {showPassChange && <ChangePasswordModal changeOwnPassword={changeOwnPassword} onClose={() => setShowPassChange(false)} />}
      {showStreak && <StreakModal wallet={wallet} nick={nick} claimStreakReward={claimStreakReward} onClose={() => setShowStreak(false)} />}
      {viewFriend && <FriendProfileModal friend={viewFriend} onClose={() => setViewFriend(null)} allCards={allCards} />}
      {giftTarget && <GiftCardModal wallet={wallet} saveWallet={saveWallet} nick={nick} friend={giftTarget} allCards={allCards} onClose={() => setGiftTarget(null)} showToast={showToast} />}
    </div>
  );
}

// CustomAvatarInput прибрано: гравці обирають аватар лише з готового набору (в т.ч. сезонного SOCCER PASS)

/* ============================== DUEL ============================== */
function DuelSetupModal({ wallet, saveWallet, nick, friendsData, onClose, onEnterDuel, showToast, allCards, prefillOpponent, maintState }) {
  const maintSoon = maintState && maintState.phase && maintState.phase !== "off";
  const [mode, setMode] = useState("create");
  const [joinCode, setJoinCode] = useState("");
  const [room, setRoom] = useState(null); // lobby room after creation
  const [stakeType, setStakeType] = useState("none");
  const [stakeAmount, setStakeAmount] = useState(200);
  const [durationSec, setDurationSec] = useState(60);
  const [waitSec, setWaitSec] = useState(0);
  const joinPollRef = useRef(null);
  useEffect(() => () => { if (joinPollRef.current) clearInterval(joinPollRef.current); }, []);

  async function createRoom() {
    const code = Math.random().toString(36).slice(2, 6).toUpperCase();
    const r = { code, creator: nick, opponent: null, opponentIsBot: false, status: "lobby", createdAt: Date.now() };
    await sSet("duel_" + code, r, true);
    setRoom(r);
    if (prefillOpponent) await inviteFriendObj(prefillOpponent, r);
  }
  async function inviteBot() {
    const fresh = { ...room, opponent: BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)], opponentIsBot: true };
    await sSet("duel_" + fresh.code, fresh, true);
    setRoom(fresh);
  }
  async function cancelRoom() {
    if (room) await sDelete("duel_" + room.code, true);
    setRoom(null);
  }
  useEffect(() => {
    if (!room || room.opponent) return;
    setWaitSec(0);
    const t = setInterval(async () => {
      setWaitSec((s) => s + 2);
      const fresh = await sGet("duel_" + room.code, true);
      if (fresh && fresh.opponent) setRoom(fresh);
    }, 2000);
    return () => clearInterval(t);
  }, [room && room.code, room && room.opponent]);

  const [invited, setInvited] = useState({});
  async function inviteFriendObj(f, r) {
    await sSet("duel_invite_" + f.nick, { from: nick, code: (r || room).code, ts: Date.now(), expiresAt: Date.now() + 120000 }, true);
    setInvited((prev) => ({ ...prev, [f.nick]: true }));
    showToast(`Запрошення надіслано ${f.nick}`, "ok");
  }

  async function startMatch() {
    if (stakeType === "bucks") {
      if (stakeAmount <= 0) { showToast("Вкажіть суму ставки", "err"); return; }
      if (stakeAmount > 10000) { showToast("Максимальна ставка — 10 000 баксів", "err"); return; }
      if (!wallet.bucksInfinite && wallet.bucks < stakeAmount) { showToast("Недостатньо баксів на ставку", "err"); return; }
    }
    // старт з буфером наперед (6с) — обидва клієнти орієнтуються на цей ОДИН абсолютний момент часу,
    // скоригований під реальний час сервера (а не Date.now() кожного окремого пристрою, який може
    // бути неточним) — це і є фікс розсинхрону "у кожного різний рахунок/час"
    const offset = await getServerTimeOffset();
    const startedAt = Date.now() + offset + 6000;
    const fresh = { ...room, status: "active", durationSec, startedAt, stake: stakeType === "none" ? null : { type: "bucks", amount: stakeAmount } };
    if (stakeType === "bucks" && !wallet.bucksInfinite) { const w = JSON.parse(JSON.stringify(wallet)); w.bucks -= stakeAmount; await saveWallet(w); }
    await sSet("duel_" + fresh.code, fresh, true);
    onEnterDuel(fresh);
    onClose();
  }
  async function joinRoom() {
    const code = joinCode.trim().toUpperCase();
    const r = await sGet("duel_" + code, true);
    if (!r) { showToast("Кімнату не знайдено", "err"); return; }
    if (r.opponent && r.opponent !== nick) { showToast("Кімната вже заповнена", "err"); return; }
    r.opponent = nick;
    await sSet("duel_" + code, r, true);
    showToast("Приєднались! Чекайте, поки творець кімнати почне матч…", "ok");
    if (joinPollRef.current) clearInterval(joinPollRef.current);
    joinPollRef.current = setInterval(async () => {
      const fresh = await sGet("duel_" + code, true);
      if (fresh && fresh.status === "active") {
        clearInterval(joinPollRef.current); joinPollRef.current = null;
        if (fresh.stake && fresh.stake.type === "bucks" && !wallet.bucksInfinite) {
          if (wallet.bucks < fresh.stake.amount) {
            showToast("У вас забракло баксів на ставку — матч скасовано", "err");
            // повідомляємо кімнату про скасування, інакше творець матчу (який вже зайшов в екран дуелі)
            // лишався б "грати сам із собою", бо суперник просто закрив вікно й ніхто про це не дізнався
            await sSet("duel_" + code, { ...fresh, status: "cancelled_funds", cancelledBy: nick }, true);
            onClose(); return;
          }
          const w = JSON.parse(JSON.stringify(wallet)); w.bucks -= fresh.stake.amount; await saveWallet(w);
        }
        onEnterDuel(fresh); onClose();
      }
    }, 1500);
  }

  if (room) {
    return (
      <div style={sx.modalOverlay} onClick={onClose}>
        <div style={sx.modal} onClick={(e) => e.stopPropagation()}>
          <h3 style={{ marginTop: 0, color: "#fbbf24" }}>Кімната: {room.code}</h3>
          {!room.opponent ? (
            <>
              <div style={{ display: "flex", alignItems: "center", gap: 10, background: "#111827", borderRadius: 10, padding: 12, marginBottom: 10 }}>
                <div style={{ width: 22, height: 22, border: "3px solid #374151", borderTopColor: "#fbbf24", borderRadius: "50%", animation: "spin 0.9s linear infinite" }} />
                <div>
                  <p style={{ margin: 0, fontSize: 12, color: "#e5e7eb" }}>Очікуємо суперника… {waitSec}с</p>
                  <p style={{ margin: 0, fontSize: 10, color: "#6b7280" }}>Кімната лишається відкритою, поки ви тут</p>
                </div>
              </div>
              <p style={{ fontSize: 12, color: "#9ca3af" }}>Запросіть друга напряму, поділіться кодом кімнати, або запросіть бота:</p>
              <div style={{ background: "#111827", border: "1px dashed #374151", borderRadius: 8, padding: "8px 10px", marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 11, color: "#9ca3af" }}>Код кімнати</span>
                <span style={{ fontSize: 18, fontWeight: 800, color: "#fbbf24", letterSpacing: 2 }}>{room.code}</span>
              </div>
              {friendsData.length === 0 && <p style={{ fontSize: 11, color: "#6b7280" }}>У вас поки немає друзів — дайте код напряму або грайте проти бота.</p>}
              {friendsData.map((f) => (
                <div key={f.nick} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#1f2937", padding: 8, borderRadius: 8, marginBottom: 6 }}>
                  <span>{f.avatar} <ColoredNick nick={f.nick} color={f.nickColor} /></span>
                  <button disabled={invited[f.nick]} onClick={() => inviteFriendObj(f)} style={{ ...sx.smallBtn, fontSize: 11, opacity: invited[f.nick] ? 0.6 : 1 }}>{invited[f.nick] ? "Запрошено ✓" : "📨 Запросити"}</button>
                </div>
              ))}
              <button style={sx.primaryBtn} onClick={inviteBot}>🤖 Грати!</button>
              <button style={{ ...sx.smallBtn, marginTop: 8, width: "100%", background: "#7f1d1d" }} onClick={cancelRoom}>Скасувати кімнату</button>
            </>
          ) : (
            <>
              <p style={{ fontSize: 12, color: "#4ade80" }}>Суперник: {room.opponent} {room.opponentIsBot ? "🤖" : ""} — обирайте умови матчу:</p>
              <label style={{ fontSize: 12, color: "#9ca3af" }}>Тривалість: {durationSec}с</label>
              <input type="range" min="30" max="180" step="10" value={durationSec} onChange={(e) => setDurationSec(Number(e.target.value))} style={{ width: "100%", marginBottom: 10 }} />
              <div style={sx.authTabs}>
                <button onClick={() => setStakeType("none")} style={{ ...sx.authTabBtn, ...(stakeType === "none" ? sx.authTabActive : {}) }}>Без ставки</button>
                <button onClick={() => setStakeType("bucks")} style={{ ...sx.authTabBtn, ...(stakeType === "bucks" ? sx.authTabActive : {}) }}>Бакси</button>
              </div>
              {stakeType === "bucks" && (
                <>
                  <input type="number" min="1" max="10000" value={stakeAmount} onChange={(e) => setStakeAmount(Math.min(10000, Number(e.target.value)))} style={sx.input} placeholder="Ставка (макс. 10 000)" />
                  <p style={{ fontSize: 11, color: "#9ca3af", marginTop: -8 }}>Кожен ставить по {stakeAmount || 0} 💵. Переможець забирає {(stakeAmount || 0) * 2} 💵.</p>
                </>
              )}
              {maintSoon ? <p style={{ color: "#f87171", fontSize: 12, textAlign: "center" }}>⚠️ Скоро технічна перерва — матчі зараз не запускаються</p> : <button style={sx.primaryBtn} onClick={startMatch}>Почати матч (3-2-1)</button>}
            </>
          )}
          <button style={{ ...sx.smallBtn, marginTop: 8, width: "100%" }} onClick={onClose}>Закрити</button>
        </div>
      </div>
    );
  }

  return (
    <div style={sx.modalOverlay} onClick={onClose}>
      <div style={sx.modal} onClick={(e) => e.stopPropagation()}>
        <div style={{
          textAlign: "center", padding: "12px 10px", marginBottom: 12, borderRadius: 12, position: "relative", overflow: "hidden",
          background: "linear-gradient(90deg,#4c1d95,#1e1b4b,#7c3aed,#1e1b4b,#4c1d95)", backgroundSize: "200% 100%", animation: "flowX 8s linear infinite", border: "1px solid #7c3aed",
        }}>
          <span style={{ position: "absolute", top: -10, left: -6, fontSize: 44, opacity: 0.14, pointerEvents: "none" }}>⚔️</span>
          <p style={{ margin: 0, fontSize: 16, fontWeight: 900, color: "#e9d5ff" }}>⚔️ Дуель карток</p>
        </div>
        <div style={sx.authTabs}>
          <button onClick={() => setMode("create")} style={{ ...sx.authTabBtn, ...(mode === "create" ? sx.authTabActive : {}) }}>🆕 Створити</button>
          <button onClick={() => setMode("join")} style={{ ...sx.authTabBtn, ...(mode === "join" ? sx.authTabActive : {}) }}>🔑 Приєднатись</button>
        </div>
        {mode === "create" ? (
          <>
            <div style={{ background: "#111827", border: "1px solid #374151", borderRadius: 10, padding: 10, marginBottom: 10, textAlign: "center" }}>
              <p style={{ fontSize: 12, color: "#e5e7eb", margin: "0 0 8px" }}>🏆 Хто за відведений час набере більше очок — перемагає!</p>
              <div style={{ display: "flex", justifyContent: "center", gap: 6, flexWrap: "wrap" }}>
                {[["Міфічна", "+1"], ["Легендарна", "+3"], ["Ексклюзивна", "+8"]].map(([r, p]) => (
                  <RarityPill key={r} r={r} plain><RName r={r} style={{ fontWeight: 700 }} /> <b style={{ color: "#e5e7eb" }}>{p}</b></RarityPill>
                ))}
              </div>
            </div>
            {wallet.duelStats && (wallet.duelStats.wins > 0 || wallet.duelStats.losses > 0) && (
              <div style={{ display: "flex", gap: 6, justifyContent: "center", flexWrap: "wrap", marginBottom: 12 }}>
                <span style={{ fontSize: 11, background: "#111827", border: "1px solid #4ade80", borderRadius: 999, padding: "4px 9px", color: "#4ade80", fontWeight: 700 }}>✅ {wallet.duelStats.wins} перемог</span>
                <span style={{ fontSize: 11, background: "#111827", border: "1px solid #f87171", borderRadius: 999, padding: "4px 9px", color: "#f87171", fontWeight: 700 }}>❌ {wallet.duelStats.losses} поразок</span>
                <span style={{ fontSize: 11, background: "#111827", border: "1px solid #a78bfa", borderRadius: 999, padding: "4px 9px", color: "#a78bfa", fontWeight: 700 }}>🔥 серія {wallet.duelStats.streak}{wallet.duelStats.bestStreak > 0 ? ` (рекорд ${wallet.duelStats.bestStreak})` : ""}</span>
              </div>
            )}
            <button style={{ ...sx.primaryBtn, background: "linear-gradient(90deg,#7c3aed,#4c1d95)" }} onClick={createRoom}>⚔️ Створити кімнату</button>
          </>
        ) : (
          <>
            <p style={{ fontSize: 12, color: "#9ca3af", textAlign: "center", marginTop: 0 }}>Введіть код кімнати, яким з вами поділився суперник:</p>
            <input placeholder="Код кімнати" value={joinCode} onChange={(e) => setJoinCode(e.target.value)} style={{ ...sx.input, textAlign: "center", fontSize: 18, fontWeight: 800, letterSpacing: 2 }} />
            <button style={{ ...sx.primaryBtn, background: "linear-gradient(90deg,#7c3aed,#4c1d95)" }} onClick={joinRoom}>🔑 Приєднатись</button>
          </>
        )}
        <button style={{ ...sx.smallBtn, marginTop: 8, width: "100%" }} onClick={onClose}>Закрити</button>
      </div>
    </div>
  );
}
function DuelScreen({ room, nick, wallet, saveWallet, allCards, rarityOverride, abuseEvent, onFinish, onExit, showToast, onRematch, maintState }) {
  const mySide = room.creator === nick ? "creator" : "opponent";
  const oppSide = mySide === "creator" ? "opponent" : "creator";
  const otherNick = mySide === "creator" ? room.opponent : room.creator; // РЕАЛЬНЕ ім'я суперника з ТВОЄЇ точки зору —
  // раніше всюди хардкодилось room.opponent, яке для приєднаного гравця дорівнює його ВЛАСНОМУ ніку
  const [clockOffset, setClockOffset] = useState(0);
  useEffect(() => { getServerTimeOffset().then(setClockOffset); }, []);
  const [tick, setTick] = useState(Date.now());
  const now = tick + clockOffset;
  const [myScore, setMyScore] = useState(0);
  const [oppScore, setOppScore] = useState(0);
  const [spinning, setSpinning] = useState(false);
  const [reel, setReel] = useState(null);
  const [pulse, setPulse] = useState(false);
  const finishedRef = useRef(false);
  const myScoreRef = useRef(0); const oppScoreRef = useRef(0);
  useEffect(() => { myScoreRef.current = myScore; }, [myScore]);
  useEffect(() => { oppScoreRef.current = oppScore; }, [oppScore]);

  // ОБИДВА клієнти рахують "почалось / скільки лишилось" від ОДНОГО спільного startedAt,
  // записаного в базу творцем кімнати, і скоригованого під РЕАЛЬНИЙ час сервера (clockOffset)
  // замість "сирого" Date.now() кожного окремого пристрою — телефони й ПК часто мають неточний
  // системний час, через що один гравець міг стартувати на 10+ секунд раніше/пізніше за іншого.
  const startsAt = room.startedAt || Date.now();
  const deadline = startsAt + room.durationSec * 1000;
  const started = now >= startsAt;
  const countdown = Math.max(0, Math.ceil((startsAt - now) / 1000));
  const timeLeftMs = Math.max(0, deadline - now);

  const [cancelledInfo, setCancelledInfo] = useState(null);
  useEffect(() => {
    if (room.opponentIsBot || timeLeftMs <= 0) return; // перевіряємо скасування протягом усього передстарту І всього матчу
    const t = setInterval(async () => {
      const fresh = await sGet("duel_" + room.code, true);
      if (fresh && (fresh.status === "cancelled_funds" || fresh.status === "cancelled_exit") && fresh.cancelledBy !== nick) {
        clearInterval(t);
        finishedRef.current = true;
        if (room.stake && !wallet.bucksInfinite) {
          const w = JSON.parse(JSON.stringify(wallet)); w.bucks += room.stake.amount; await saveWallet(w);
        }
        setCancelledInfo(fresh.status === "cancelled_exit" ? "exit" : "funds");
      }
    }, 900);
    return () => clearInterval(t);
  }, [room.opponentIsBot, timeLeftMs <= 0]);

  useEffect(() => {
    if (!started || finishedRef.current) return;
    const soon = maintState && maintState.phase && maintState.phase !== "off";
    if (soon) finish(true);
  }, [started, maintState && maintState.phase]);

  useEffect(() => {
    const t = setInterval(() => setTick(Date.now()), 200);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (started && timeLeftMs <= 0 && !finishedRef.current) finish();
    // eslint-disable-next-line
  }, [started, timeLeftMs <= 0]);

  // якщо суперник реальний гравець — опитуємо його рахунок; якщо бот — симулюємо самі
  useEffect(() => {
    if (!started || room.opponentIsBot) return;
    const t = setInterval(async () => {
      const s = await sGet("duel_" + room.code + "_score_" + oppSide, true);
      if (s && typeof s.score === "number") setOppScore(s.score);
    }, 1500);
    return () => clearInterval(t);
  }, [started]);
  useEffect(() => {
    if (!started || !room.opponentIsBot) return;
    let cancelled = false;
    let timerId;
    function scheduleNext() {
      // адаптивна складність: якщо гравець сильно попереду — бот трохи "наздоганяє" (частіше крутить),
      // якщо гравець позаду — бот трохи стишується, щоб матч не виглядав завжди однаково
      const gap = myScoreRef.current - oppScoreRef.current;
      let baseDelay = 1800;
      if (gap >= 5) baseDelay = 1300; else if (gap <= -5) baseDelay = 2300;
      const jitter = Math.floor(Math.random() * 700) - 250; // трошки випадковості, щоб не виглядало як скрипт
      timerId = setTimeout(() => {
        if (cancelled) return;
        const rng = seededRandom(Date.now() % 1000000 + Math.floor(Math.random() * 100000));
        const weights = effectiveWeights(rarityOverride, abuseEvent, wallet);
        const rarity = weightedPick(rng, weights);
        const rarityScore = { "Рідкісна": 0, "Епічна": 0, "Міфічна": 1, "Легендарна": 3, "Ексклюзивна": 8 }[rarity] || 0;
        if (rarityScore > 0) setOppScore((s) => s + rarityScore);
        scheduleNext();
      }, Math.max(700, baseDelay + jitter));
    }
    scheduleNext();
    return () => { cancelled = true; clearTimeout(timerId); };
  }, [started]);

  async function doSpin() {
    if (spinning || timeLeftMs <= 0) return;
    setSpinning(true);
    const pool = allCards();
    const rng = seededRandom(Date.now() % 1000000 + Math.floor(Math.random() * 100000));
    const weights = effectiveWeights(rarityOverride, abuseEvent, wallet);
    const rarity = weightedPick(rng, weights);
    const rp = pool.filter(c => c.rarity === rarity && !c.tempEvent);
    const card = rp[Math.floor(rng() * rp.length)] || pool[0];
    setReel(card);
    const rarityScore = { "Рідкісна": 0, "Епічна": 0, "Міфічна": 1, "Легендарна": 3, "Ексклюзивна": 8 }[rarity] || 0;
    const newScore = myScore + rarityScore;
    setMyScore(newScore);
    if (rarityScore > 0) { setPulse(true); setTimeout(() => setPulse(false), 400); }
    if (!room.opponentIsBot) {
      // КРИТИЧНО: рахунок пишеться у СВІЙ окремий ключ, а не в спільний документ кімнати —
      // раніше обидва гравці читали-модифікували-писали ОДИН документ, і одночасний спін
      // суперника міг стерти щойно записаний рахунок (race condition). Тому дуель "не працювала":
      // рахунки губились або не оновлювались.
      await sSet("duel_" + room.code + "_score_" + mySide, { score: newScore, ts: Date.now() }, true);
    }
    setTimeout(() => setSpinning(false), 500);
  }
  function applyPayout(w, winner) {
    if (!room.stake) return;
    if (winner === "draw") { w.bucks += room.stake.amount; setStakeResult({ kind: "draw", amount: room.stake.amount }); return; }
    if (winner === nick) {
      const won = Math.round(room.stake.amount * 2 * bucksMult(abuseEvent, w));
      w.bucks += won;
      setStakeResult({ kind: "win", amount: won });
    } else {
      setStakeResult({ kind: "lose", amount: room.stake.amount }); // програш вже списаний на старті матчу — тут лише показуємо підсумкове вікно
    }
  }
  function applyDuelStats(w, winner) {
    const s = w.duelStats || { wins: 0, losses: 0, draws: 0, streak: 0, bestStreak: 0 };
    if (winner === "draw") { s.draws++; s.streak = 0; }
    else if (winner === nick) { s.wins++; s.streak++; s.bestStreak = Math.max(s.bestStreak, s.streak); }
    else { s.losses++; s.streak = 0; }
    w.duelStats = s;
  }
  const [emergencyEnd, setEmergencyEnd] = useState(false);
  async function finish(emergency) {
    if (finishedRef.current) return; finishedRef.current = true;
    if (emergency) setEmergencyEnd(true);
    let myFinal = myScoreRef.current, oppFinal = oppScoreRef.current;
    if (!room.opponentIsBot) {
      // читаємо ОБИДВА рахунки напряму з їх власних ключів перед підбиттям підсумку,
      // а не покладаємось на локальні (можливо трохи застарілі через опитування раз в 1.5с) значення
      const [mine, opp] = await Promise.all([
        sGet("duel_" + room.code + "_score_" + mySide, true),
        sGet("duel_" + room.code + "_score_" + oppSide, true),
      ]);
      if (mine && typeof mine.score === "number") myFinal = mine.score;
      if (opp && typeof opp.score === "number") oppFinal = opp.score;
    }
    const winner = myFinal === oppFinal ? "draw" : (myFinal > oppFinal ? nick : otherNick);
    const fresh = { ...room, status: "finished", winner };
    if (!room.opponentIsBot) await sSet("duel_" + room.code, fresh, true);
    const w = JSON.parse(JSON.stringify(wallet));
    applyPayout(w, winner);
    if (!room.opponentIsBot) applyDuelStats(w, winner);
    bumpPassQuest(w, "duel_play");
    if (winner === nick) bumpPassQuest(w, "duel_win");
    await saveWallet(w);
    onFinish(fresh);
    const RARE_PLUS = ["Міфічна", "Легендарна", "Ексклюзивна"];
    const myTotal = Object.values(wallet.collection || {}).filter((c) => c > 0).length;
    const myRarePlus = allCards().filter((c) => RARE_PLUS.includes(c.rarity) && (wallet.collection[c.id] || 0) > 0).length;
    let oppTotal = null, oppRarePlus = null;
    if (!room.opponentIsBot) {
      const oppW = await sGet("wallet_" + otherNick, true);
      if (oppW) {
        oppTotal = Object.values(oppW.collection || {}).filter((c) => c > 0).length;
        oppRarePlus = allCards().filter((c) => RARE_PLUS.includes(c.rarity) && (oppW.collection[c.id] || 0) > 0).length;
      }
    }
    setResultData({ winner, myFinal, oppFinal, myTotal, myRarePlus, oppTotal, oppRarePlus });
  }
  const [resultData, setResultData] = useState(null);
  const [stakeResult, setStakeResult] = useState(null);

  const [showExitConfirm, setShowExitConfirm] = useState(false);
  const [exitedInfo, setExitedInfo] = useState(null);
  async function confirmExit() {
    setShowExitConfirm(false);
    finishedRef.current = true;
    if (room.stake && !wallet.bucksInfinite) {
      const w = JSON.parse(JSON.stringify(wallet)); w.bucks += room.stake.amount; await saveWallet(w);
    }
    if (!room.opponentIsBot) {
      await sSet("duel_" + room.code, { ...room, status: "cancelled_exit", cancelledBy: nick }, true);
    }
    setExitedInfo(true);
  }

  if (exitedInfo) {
    return (
      <div style={{ ...sx.app, alignItems: "center", justifyContent: "center", display: "flex" }}>
        <div style={{ textAlign: "center", maxWidth: 300 }}>
          <div style={{ fontSize: 48 }}>🚪</div>
          <h3 style={{ color: "#e5e7eb" }}>Ви вийшли з матчу</h3>
          {room.stake && <p style={{ fontSize: 16, fontWeight: 800, color: "#4ade80" }}>+{fmtBucks(room.stake.amount)} повернено</p>}
          <button style={sx.primaryBtn} onClick={onExit}>Закрити</button>
        </div>
      </div>
    );
  }
  if (cancelledInfo) {
    return (
      <div style={{ ...sx.app, alignItems: "center", justifyContent: "center", display: "flex" }}>
        <div style={{ textAlign: "center", maxWidth: 300 }}>
          <div style={{ fontSize: 48 }}>😔</div>
          <h3 style={{ color: "#f87171" }}>Вибачте, матч завершено</h3>
          <p style={{ fontSize: 13, color: "#9ca3af" }}>
            {cancelledInfo === "exit" ? "Суперник вийшов з матчу достроково." : "У суперника забракло баксів на ставку."} {room.stake ? "Вашу ставку повністю повернено." : ""}
          </p>
          {room.stake && <p style={{ fontSize: 16, fontWeight: 800, color: "#4ade80" }}>+{fmtBucks(room.stake.amount)} повернено</p>}
          <button style={sx.primaryBtn} onClick={onExit}>Закрити</button>
        </div>
      </div>
    );
  }
  if (resultData) {
    const won = resultData.winner === nick;
    const draw = resultData.winner === "draw";
    const tone = draw ? { a: "#374151", c: "#9ca3af" } : won ? { a: "#14532d", c: "#4ade80" } : { a: "#7f1d1d", c: "#f87171" };
    const panel = (name, score, win) => (
      <div style={{ flex: 1, minWidth: 0, borderRadius: 14, padding: "12px 6px", background: win ? "linear-gradient(160deg,#14532d,#052e16)" : "#111827", border: win ? "2px solid #4ade80" : "1px solid #374151", boxShadow: win ? "0 0 18px #4ade8055" : "none" }}>
        <div style={{ fontSize: 11, color: "#9ca3af", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{win ? "👑 " : ""}{name}</div>
        <div style={{ fontSize: 34, fontWeight: 900, color: "#fbbf24", lineHeight: 1.1 }}>{score}</div>
      </div>
    );
    return (
      <div style={{ ...sx.app, alignItems: "center", justifyContent: "center", display: "flex", position: "relative", overflow: "hidden", background: `radial-gradient(ellipse 100% 60% at 50% 0%, ${tone.a} 0%, #0b0f1a 65%)` }}>
        {won && !draw && Array.from({ length: 14 }).map((_, i) => (
          <span key={i} style={{ position: "absolute", top: 0, left: ((i * 7 + 3) % 96) + "%", fontSize: 14 + (i % 3) * 4, pointerEvents: "none", animation: `themeFall ${4 + (i % 5)}s linear ${(i % 7) * 0.4}s infinite` }}>{["🎉", "⭐", "🏆", "✨"][i % 4]}</span>
        ))}
        <div style={{ textAlign: "center", width: "100%", maxWidth: 340, position: "relative", zIndex: 1, padding: 12 }}>
          <div style={{ fontSize: 64, animation: "popIn 0.6s ease", filter: `drop-shadow(0 0 18px ${tone.c}99)` }}>{draw ? "🤝" : won ? "🏆" : "😔"}</div>
          <h2 style={{ margin: "6px 0 14px", fontSize: 28, background: `linear-gradient(90deg,${tone.c},#fde68a,${tone.c})`, backgroundSize: "200% 100%", animation: "flowX 4s linear infinite", WebkitBackgroundClip: "text", backgroundClip: "text", WebkitTextFillColor: "transparent", display: "inline-block" }}>{draw ? "Нічия!" : won ? "Ви перемогли!" : "Ви програли"}</h2>
          {emergencyEnd && (
            <div style={{ background: "#78350f", border: "1px solid #f59e0b", borderRadius: 10, padding: 10, marginBottom: 10 }}>
              <p style={{ margin: 0, fontSize: 12, color: "#fde68a" }}>🛠️ Вибачте, довелося достроково завершити матч через технічну перерву{draw ? " — ставку повернено обом" : ""}. {!draw && "Перемога зарахована лідеру на момент завершення."}</p>
            </div>
          )}
          <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "0 0 14px" }}>
            {panel(nick, resultData.myFinal, won && !draw)}
            <span style={{ fontWeight: 800, color: "#6b7280" }}>VS</span>
            {panel(otherNick, resultData.oppFinal, !won && !draw)}
          </div>
          <div style={{ background: "#111827", border: "1px solid #1f2937", borderRadius: 12, padding: 12, marginBottom: 14, textAlign: "left" }}>
            <p style={{ fontSize: 11, color: "#9ca3af", margin: "0 0 6px", fontWeight: 700 }}>📊 Підсумок колекцій</p>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}>
              <span>{nick}: {resultData.myTotal} карток (рідкісних+: {resultData.myRarePlus})</span>
            </div>
            {resultData.oppTotal != null && (
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                <span>{otherNick}: {resultData.oppTotal} карток (рідкісних+: {resultData.oppRarePlus})</span>
              </div>
            )}
            {stakeResult && (
              <div style={{
                marginTop: 10, padding: 10, borderRadius: 10, textAlign: "center",
                background: stakeResult.kind === "win" ? "linear-gradient(135deg,#14532d,#052e16)" : stakeResult.kind === "lose" ? "linear-gradient(135deg,#7f1d1d,#450a0a)" : "linear-gradient(135deg,#1f2937,#111827)",
                border: `1px solid ${stakeResult.kind === "win" ? "#4ade80" : stakeResult.kind === "lose" ? "#f87171" : "#374151"}`,
              }}>
                <p style={{ margin: 0, fontSize: 18, fontWeight: 900, color: stakeResult.kind === "win" ? "#4ade80" : stakeResult.kind === "lose" ? "#f87171" : "#e5e7eb" }}>
                  {stakeResult.kind === "win" ? `+${fmtBucks(stakeResult.amount)}` : stakeResult.kind === "lose" ? `−${fmtBucks(stakeResult.amount)}` : `Повернуто ${fmtBucks(stakeResult.amount)}`}
                </p>
                <p style={{ margin: "2px 0 0", fontSize: 11, color: "#9ca3af" }}>
                  {stakeResult.kind === "win" ? "Нараховано за перемогу в дуелі" : stakeResult.kind === "lose" ? "Списано за програш у дуелі" : "Нічия — ставку повернено"}
                </p>
              </div>
            )}
            {wallet.duelStats && (
              <p style={{ fontSize: 11, color: "#a78bfa", marginTop: 8, marginBottom: 0 }}>
                ⚔️ Перемоги: {wallet.duelStats.wins} · Поразки: {wallet.duelStats.losses} · Серія перемог: {wallet.duelStats.streak}{wallet.duelStats.bestStreak > 0 ? ` (рекорд: ${wallet.duelStats.bestStreak})` : ""}
              </p>
            )}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            {!room.opponentIsBot && onRematch && <button style={{ ...sx.smallBtn, flex: 1 }} onClick={() => onRematch(otherNick)}>🔁 Реванш</button>}
            <button style={{ ...sx.primaryBtn, flex: 1 }} onClick={onExit}>Закрити</button>
          </div>
        </div>
      </div>
    );
  }

  if (!started) {
    return (
      <div style={{ ...sx.app, alignItems: "center", justifyContent: "center", display: "flex", background: "radial-gradient(ellipse 100% 60% at 50% 50%, #312e81 0%, #0b0f1a 70%)" }}>
        <div style={{ textAlign: "center", width: "100%", maxWidth: 340, padding: 12 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, marginBottom: 26 }}>
            <div style={{ flex: 1, background: "#111827cc", border: "1px solid #7c3aed", borderRadius: 12, padding: "10px 6px", fontWeight: 800, fontSize: 14, color: "#e5e7eb", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", animation: "fadeSlideUp 0.5s ease" }}>{nick}</div>
            <span style={{ fontSize: 22, fontWeight: 900, background: "linear-gradient(90deg,#f87171,#fbbf24,#f87171)", backgroundSize: "200% 100%", animation: "flowX 2s linear infinite", WebkitBackgroundClip: "text", backgroundClip: "text", WebkitTextFillColor: "transparent" }}>VS</span>
            <div style={{ flex: 1, background: "#111827cc", border: "1px solid #7c3aed", borderRadius: 12, padding: "10px 6px", fontWeight: 800, fontSize: 14, color: "#e5e7eb", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", animation: "fadeSlideUp 0.5s ease" }}>{otherNick}{room.opponentIsBot ? " 🤖" : ""}</div>
          </div>
          <div style={{ position: "relative", width: 130, height: 130, margin: "0 auto" }}>
            <span className="rainbow-ring" style={{ position: "absolute", inset: 0, borderRadius: "50%", padding: 4, display: "block", animation: countdown > 0 ? "boostPulse 1s ease-in-out infinite" : "none" }}>
              <div style={{ width: "100%", height: "100%", borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", background: "radial-gradient(circle,#78350f,#1c0a02)" }}>
                <div key={countdown} style={{ fontSize: countdown > 0 ? 60 : 24, fontWeight: 900, color: "#fbbf24", animation: "popIn 0.4s ease" }}>{countdown > 0 ? countdown : "ГО!"}</div>
              </div>
            </span>
          </div>
          <p style={{ marginTop: 20, fontSize: 11, color: "#9ca3af" }}>Міфічна +1 · Легендарна +3 · <RName r="Ексклюзивна" /> +8</p>
        </div>
      </div>
    );
  }
  const timeLeft = Math.ceil(timeLeftMs / 1000);
  const progressPct = Math.max(0, Math.min(100, (timeLeftMs / (room.durationSec * 1000)) * 100));
  const iLead = myScore > oppScore, tied = myScore === oppScore;
  const side = (name, score, leading, mine) => (
    <div style={{
      flex: 1, maxWidth: 140, borderRadius: 16, padding: "12px 8px",
      background: leading ? (mine ? "linear-gradient(160deg,#14532d,#052e16)" : "linear-gradient(160deg,#7f1d1d,#450a0a)") : "#111827",
      border: leading ? `2px solid ${mine ? "#4ade80" : "#f87171"}` : "1px solid #374151",
      boxShadow: leading ? `0 0 18px ${mine ? "#4ade8055" : "#f8717155"}` : "none", transition: "all 0.3s",
    }}>
      <div style={{ fontSize: 11, color: "#9ca3af", marginBottom: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{leading ? "👑 " : ""}{name}</div>
      <div style={{ fontSize: 30, fontWeight: 900, color: "#fbbf24", lineHeight: 1.1, transform: mine && pulse ? "scale(1.3)" : "scale(1)", transition: "transform 0.3s" }}>{score}</div>
    </div>
  );
  return (
    <div style={{ ...sx.app, background: "radial-gradient(ellipse 100% 60% at 50% 0%, #312e81 0%, #0b0f1a 60%)" }}>
      <div style={{ textAlign: "center", padding: 16 }}>
        <div style={{
          display: "inline-flex", alignItems: "center", gap: 8, padding: "6px 16px", borderRadius: 999,
          background: timeLeft <= 10 ? "linear-gradient(135deg,#7f1d1d,#450a0a)" : "linear-gradient(135deg,#78350f,#451a03)",
          border: `1px solid ${timeLeft <= 10 ? "#ef4444" : "#f59e0b"}`, marginBottom: 10, animation: timeLeft <= 10 ? "boostPulse 0.8s ease-in-out infinite" : "none",
        }}>
          <span style={{ fontSize: 16 }}>⏱</span>
          <span style={{ fontSize: 18, fontWeight: 900, color: timeLeft <= 10 ? "#fca5a5" : "#fde68a" }}>{timeLeft}с</span>
        </div>
        <div style={{ height: 8, borderRadius: 6, background: "#1f2937", margin: "0 auto 16px", maxWidth: 300, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${progressPct}%`, background: timeLeft <= 10 ? "#ef4444" : "linear-gradient(90deg,#fbbf24,#f59e0b,#ef4444,#f59e0b,#fbbf24)", backgroundSize: "200% 100%", animation: "flowX 2.5s linear infinite", transition: "width 0.2s linear", borderRadius: 6 }} />
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, marginBottom: 4 }}>
          {side(nick + " (ви)", myScore, iLead && !tied, true)}

}
